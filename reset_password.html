</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 รีเซ็ตรหัสผ่าน</h1>

```
    <div class="info-box">
        <p>💡 <strong>โปรดระวัง:</strong> การรีเซ็ตรหัสผ่านจะเปลี่ยนรหัสผ่านของคุณเป็นรหัสชั่วคราว กรุณาเปลี่ยนรหัสผ่านใหม่หลังจาก Login</p>
    </div>

    <div id="errorMessage" class="message error"></div>
    <div id="successMessage" class="message success"></div>

    <form id="resetForm">
        <div class="form-group">
            <label for="licenseNumber">เลขใบประกอบวิชาชีพแพทย์ (เลข ว)</label>
            <input type="text" id="licenseNumber" name="licenseNumber" required 
                   placeholder="กรอกเลขใบประกอบวิชาชีพ" pattern="[0-9]+">
            <small>กรอกเฉพาะตัวเลขเท่านั้น</small>
        </div>

        <div class="form-group">
            <label for="resetPin">รหัส PIN (4 หลัก)</label>
            <input type="text" id="resetPin" name="resetPin" required 
                   placeholder="กรอกรหัส PIN 4 หลัก" pattern="[0-9]{4}" maxlength="4" inputmode="numeric">
            <small>รหัส PIN ที่คุณตั้งไว้ตอนลงทะเบียน</small>
        </div>

        <button type="submit" class="btn btn-primary">รีเซ็ตรหัสผ่าน</button>
        <button type="button" onclick="window.location.href='index.html'" class="btn btn-secondary">← กลับไปหน้า Login</button>
    </form>
</div>

<script>
    document.getElementById('resetForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const licenseNumber = document.getElementById('licenseNumber').value.trim();
        const resetPin = document.getElementById('resetPin').value.trim();
        
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        
        // ซ่อนข้อความเดิม
        errorMessage.classList.remove('show');
        successMessage.classList.remove('show');

        // ตรวจสอบรูปแบบเลขใบประกอบวิชาชีพ
        if (!/^[0-9]+$/.test(licenseNumber)) {
            errorMessage.textContent = '❌ เลขใบประกอบวิชาชีพต้องเป็นตัวเลขเท่านั้น';
            errorMessage.classList.add('show');
            return;
        }

        // ตรวจสอบรูปแบบ PIN
        if (!/^[0-9]{4}$/.test(resetPin)) {
            errorMessage.textContent = '❌ รหัส PIN ต้องเป็นตัวเลข 4 หลักเท่านั้น';
            errorMessage.classList.add('show');
            return;
        }

        try {
            // เรียก API reset password
            const response = await fetch('https://doc-leave-api.9vk92zm5z2.workers.dev/api/reset-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    licenseNumber: licenseNumber,
                    resetPin: resetPin
                })
            });

            const data = await response.json();
            
            if (response.ok && data.success) {
                // รีเซ็ตสำเร็จ
                successMessage.innerHTML = `
                    <strong>✅ พาสเวิร์ดของคุณถูกรีเซ็ตแล้ว</strong>
                    <div class="new-password">
                        <p style="margin: 0 0 5px 0; color: #666; font-size: 14px;">ขณะนี้พาสเวิร์ดของคุณคือ</p>
                        <div class="password-display">3.1415926535</div>
                    </div>
                    <p style="margin: 10px 0 0 0; font-size: 13px; color: #666;">
                        กรุณา Login ด้วยรหัสผ่านใหม่นี้<br>
                        และเปลี่ยนรหัสผ่านหลังจาก Login
                    </p>
                    <button onclick="window.location.href='index.html'" class="btn btn-primary btn-login-only" style="margin-top: 20px;">→ ไปหน้า Login</button>
                `;
                successMessage.classList.add('show');
                
                // ซ่อนฟอร์ม
                document.getElementById('resetForm').classList.add('hidden');
            } else {
                throw new Error(data.message || 'เกิดข้อผิดพลาด');
            }

        } catch (error) {
            console.error('Reset password error:', error);
            errorMessage.textContent = '❌ ' + error.message;
            errorMessage.classList.add('show');
        }
    });
</script>
