    body {

        background: #ff6b6b;

        text-decoration: none;

        padding: 12px;

        background: white;

<script>
    const API_URL = 'https://dep-doc-worker.9vk92zm5z2.workers.dev';
    const LEAVE_API_URL = 'https://dep-rest-worker.9vk92zm5z2.workers.dev';

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let selectedDates = [];
    let isSelecting = false;
    let doctorLeaves = [];
    let hasShownAlert = false; // ป้องกัน alert ซ้ำ
    
    // ระบบเลือกวันแบบใหม่
    let selectionStep = 0; // 0 = ยังไม่เริ่ม, 1 = เลือกวันเริ่มต้นแล้ว, 2 = เลือกวันสิ้นสุดแล้ว
    let startDate = null;
    let endDate = null;

    // โหลดเมื่อเปิดหน้า
    window.onload = function() {
        const loggedIn = sessionStorage.getItem('loggedIn');
        const role = sessionStorage.getItem('role');

        if (!loggedIn || role !== 'admin') {
            window.location.href = 'index.html';
            return;
        }

        loadDepartments();
        renderCalendar();
    };

    // โหลดแผนก
    async function loadDepartments() {
        try {
            const response = await fetch(`${API_URL}/api/departments`);
            const data = await response.json();
            
            if (response.ok && data.success) {
                const departments = data.data.sort((a, b) => a.name.localeCompare(b.name));
                
                const departmentSelect = document.getElementById('departmentSelect');
                const filterDepartment = document.getElementById('filterDepartment');
                
                departments.forEach(dept => {
                    departmentSelect.innerHTML += `<option value="${dept.id}">${dept.name}</option>`;
                    filterDepartment.innerHTML += `<option value="${dept.id}">${dept.name}</option>`;
                });
            }
        } catch (error) {
            console.error('Load departments error:', error);
        }
    }

    // โหลดแพทย์ตามแผนก
    async function loadDoctors() {
        const departmentId = document.getElementById('departmentSelect').value;
        const workType = document.getElementById('workTypeSelect').value;
        const doctorSelect = document.getElementById('doctorSelect');
        doctorSelect.innerHTML = '<option value="">-- เลือกแพทย์ที่จะลา --</option>';

        if (!departmentId) return;

        // ตั้งค่า default filter แผนก
        document.getElementById('filterDepartment').value = departmentId;

        try {
            const response = await fetch(`${API_URL}/api/doctors`);
            const data = await response.json();
            
            if (response.ok && data.success) {
                let doctors = data.data.filter(d => d.department_id == departmentId);
                
                // กรองตาม work_type
                if (workType === 'full') {
                    doctors = doctors.filter(d => d.work_type === 'full');
                } else if (workType === 'part') {
                    doctors = doctors.filter(d => d.work_type === 'part');
                }
                
                doctors.sort((a, b) => a.name.localeCompare(b.name, ['en', 'th']));
                
                doctors.forEach(doc => {
                    doctorSelect.innerHTML += `<option value="${doc.id}">${doc.name}</option>`;
                });
            }
        } catch (error) {
            console.error('Load doctors error:', error);
        }

        // ไม่เรียก loadReplacementDoctors() ที่นี่
        // จะโหลดเมื่อ user เลือกแพทย์และไปที่ส่วนแพทย์ที่มาแทนเอง
        
        // โหลดการลาทั้งแผนก
        loadDoctorLeaves();
    }

    // เมื่อเลือกแพทย์ที่ลา
    function onDoctorChange() {
        // ถ้าเลือก "มีคนมาแทน" อยู่แล้ว → โหลดแพทย์มาแทนใหม่
        const hasReplacement = document.querySelector('input[name="hasReplacement"]:checked').value;
        if (hasReplacement === 'yes') {
            const filterDept = document.getElementById('filterDepartment').value;
            if (filterDept) {
                loadReplacementDoctors();
            }
        }
    }

    // โหลดแพทย์ที่มาแทน
    async function loadReplacementDoctors() {
        const selectedDoctorId = document.getElementById('doctorSelect').value;
        const filterDept = document.getElementById('filterDepartment').value;
        const filterType = document.getElementById('filterWorkType').value;
        const replacementSelect = document.getElementById('replacementDoctorSelect');
        replacementSelect.innerHTML = '<option value="">-- เลือกแพทย์ที่จะมาแทน --</option>';

        console.log('=== loadReplacementDoctors ===');
        console.log('selectedDoctorId:', selectedDoctorId, typeof selectedDoctorId);
        console.log('filterDept:', filterDept);
        console.log('filterType:', filterType);

        if (!filterDept) return;

        try {
            const response = await fetch(`${API_URL}/api/doctors`);
            const data = await response.json();
            
            if (response.ok && data.success) {
                let doctors = data.data.filter(d => d.department_id == filterDept);
                console.log('Doctors in department:', doctors.length);
                
                // กรองตาม work_type
                if (filterType === 'full') {
                    doctors = doctors.filter(d => d.work_type === 'full');
                } else if (filterType === 'part') {
                    doctors = doctors.filter(d => d.work_type === 'part');
                }
                console.log('After work_type filter:', doctors.length);
                
                // ซ่อนแพทย์ที่กำลังจะลา (ถ้ามี)
                if (selectedDoctorId) {
                    const beforeFilter = doctors.length;
                    doctors = doctors.filter(d => {
                        const keep = d.id != parseInt(selectedDoctorId);
                        if (!keep) {
                            console.log('Filtering out selected doctor:', d.name, 'd.id:', d.id, 'selectedDoctorId:', parseInt(selectedDoctorId));
                        }
                        return keep;
                    });
                    console.log('After removing selected doctor:', beforeFilter, '→', doctors.length);
                } else {
                    console.warn('⚠️ selectedDoctorId is empty! Cannot filter out selected doctor.');
                }
                
                // เรียงตามชื่อ
                doctors.sort((a, b) => a.name.localeCompare(b.name, ['en', 'th']));
                
                doctors.forEach(doc => {
                    replacementSelect.innerHTML += `<option value="${doc.id}">${doc.name} (${doc.work_type === 'full' ? 'Full time' : 'Part time'})</option>`;
                });
                
                console.log('Final replacement doctors:', doctors.length);
            }
        } catch (error) {
            console.error('Load replacement doctors error:', error);
        }
    }

    // เมื่อเปลี่ยนแพทย์ที่ลา → reload แพทย์มาแทน
    function onDoctorChange() {
        // ถ้าเลือก "มีคนมาแทน" และมีแผนก → reload ทันที
        const hasReplacement = document.querySelector('input[name="hasReplacement"]:checked').value;
        const filterDept = document.getElementById('filterDepartment').value;
        
        if (hasReplacement === 'yes' && filterDept) {
            console.log('🔄 Doctor changed, reloading replacement doctors...');
            loadReplacementDoctors();
        }
    }

    // Toggle replacement section
    function toggleReplacement() {
        const hasReplacement = document.querySelector('input[name="hasReplacement"]:checked').value;
        document.getElementById('replacementSection').style.display = hasReplacement === 'yes' ? 'block' : 'none';
        
        // โหลดแพทย์มาแทนทันทีถ้าเลือก "มีคนมาแทน"
        if (hasReplacement === 'yes') {
            // Set default แผนกเป็นแผนกเดียวกับแพทย์ที่ลา
            const mainDepartmentId = document.getElementById('departmentSelect').value;
            if (mainDepartmentId) {
                document.getElementById('filterDepartment').value = mainDepartmentId;
                loadReplacementDoctors();
            }
        }
    }

    // ตรวจสอบก่อนเลือกแพทย์ที่มาแทน - ต้องเลือกวันก่อน
    function checkReplacementFocus(event, element) {
        // 1. ต้องเลือกแพทย์ที่ลาก่อน
        const selectedDoctorId = document.getElementById('doctorSelect').value;
        if (!selectedDoctorId) {
            element.blur();
            alert('⚠️ กรุณาเลือกแพทย์ที่จะลา เป็นอันดับแรก\n(เลือก แผนก >> แพทย์)');
            setTimeout(() => {
                const deptSelect = document.getElementById('departmentSelect');
                if (!deptSelect.value) {
                    deptSelect.focus();
                } else {
                    document.getElementById('doctorSelect').focus();
                }
            }, 100);
            return false;
        }

        // 2. ต้องเลือกวันที่ก่อน
        if (selectedDates.length === 0) {
            element.blur();
            alert('⚠️ กรุณาเลือกวันที่ลา\n(คลิก 2 ครั้งบนปฏิทิน)\nวันเริ่มต้น และ วันสิ้นสุด');
            return false;
        }

        return true;
    }


    // โหลดการลาของแพทย์
    async function loadDoctorLeaves() {
        const departmentId = document.getElementById('departmentSelect').value;
        
        if (!departmentId) {
            doctorLeaves = [];
            renderCalendar();
            displayLeaveRecords();
            return;
        }

        try {
            // โหลดการลาทั้งแผนก (ไม่ใช่เฉพาะแพทย์คนเดียว)
            const response = await fetch(`${LEAVE_API_URL}/api/leaves/department/${departmentId}`);
            const data = await response.json();
            
            if (response.ok && data.success) {
                doctorLeaves = data.data;
                renderCalendar();
                displayLeaveRecords();
            } else {
                // ถ้า API ยังไม่มี endpoint นี้ ให้แสดงว่าง
                console.warn('Department leaves API not available:', data.message);
                doctorLeaves = [];
                renderCalendar();
                displayLeaveRecords();
            }
        } catch (error) {
            console.error('Load leaves error:', error);
            doctorLeaves = [];
            renderCalendar();
            displayLeaveRecords();
        }
        
        // โหลดแพทย์ที่มาแทนด้วย (ถ้ามีคนมาแทน)
        const hasReplacement = document.querySelector('input[name="hasReplacement"]:checked').value;
        if (hasReplacement === 'yes') {
            loadReplacementDoctors();
        }
    }

    // แสดงแถบข้อมูลการลา
    function displayLeaveRecords() {
        const container = document.getElementById('leaveRecords');
        container.innerHTML = '';

        if (doctorLeaves.length === 0) {
            return;
        }

        doctorLeaves.forEach(leave => {
            const startDate = formatDateThai(leave.start_date);
            const endDate = formatDateThai(leave.end_date);
            
            // ดึงชื่อ (ไม่เอานามสกุล) + ตัวอักษรแรกของนามสกุล
            const doctorFullName = leave.doctor_name || '';
            const doctorFirstName = getFirstName(doctorFullName);
            const doctorLastInitial = getLastNameInitial(doctorFullName);
            
            const days = Math.ceil((new Date(leave.end_date) - new Date(leave.start_date)) / (1000 * 60 * 60 * 24)) + 1;

            // สร้างข้อความ
            let displayText = `${startDate} - ${endDate} (${days} วัน) | ${doctorFirstName} (${doctorLastInitial})`;
            
            // เพิ่มข้อมูลแพทย์ที่มาแทน (ถ้ามี)
            if (leave.has_replacement && leave.replacement_doctor_name) {
                const replacementFullName = leave.replacement_doctor_name;
                const replacementFirstName = getFirstName(replacementFullName);
                const replacementLastInitial = getLastNameInitial(replacementFullName);
                displayText += ` >> ${replacementFirstName} (${replacementLastInitial})`;
            }

            const recordDiv = document.createElement('div');
            recordDiv.className = 'leave-record';
            recordDiv.innerHTML = `
                <div class="leave-record-info">
                    ${displayText}
                </div>
                <button class="btn-delete" onclick="deleteLeave(${leave.id})">🗑️ ลบ</button>
            `;
            container.appendChild(recordDiv);
        });
    }

    // ดึงชื่อ (ไม่เอานามสกุล)
    function getFirstName(fullName) {
        if (!fullName) return '';
        const parts = fullName.trim().split(/\s+/);
        if (parts.length < 2) return fullName; // ถ้ามีแค่ชื่อเดียว
        // เอาทุกอย่างยกเว้นคำสุดท้าย (นามสกุล)
        return parts.slice(0, -1).join(' ');
    }

    // ดึงตัวอักษรแรกของนามสกุล
    function getLastNameInitial(fullName) {
        if (!fullName) return '?';
        const parts = fullName.trim().split(/\s+/);
        if (parts.length < 2) return '?';
        const lastName = parts[parts.length - 1];
        
        // ข้ามสระไทย (เอาแค่พยัญชนะตัวแรก)
        const thaiVowels = ['เ', 'แ', 'โ', 'ใ', 'ไ', 'ำ', 'ั', 'า', 'ิ', 'ี', 'ึ', 'ื', 'ุ', 'ู', '็', '่', '้', '๊', '๋', '์', 'ํ', 'ๅ'];
        
        for (let i = 0; i < lastName.length; i++) {
            const char = lastName.charAt(i);
            if (!thaiVowels.includes(char)) {
                return char;
            }
        }
        
        return lastName.charAt(0); // fallback
    }

    // ลบข้อมูลการลา
    async function deleteLeave(leaveId) {
        const leave = doctorLeaves.find(l => l.id === leaveId);
        if (!leave) return;

        const startDate = formatDateThai(leave.start_date);
        const endDate = formatDateThai(leave.end_date);
        
        const confirmMsg = `❌ ยืนยันการลบ\n\nต้องการลบข้อมูลการลานี้หรือไม่?\n\n` +
            `วันที่: ${startDate} - ${endDate}\n\nการกระทำนี้ไม่สามารถย้อนกลับได้`;

        if (!confirm(confirmMsg)) {
            return;
        }

        try {
            const response = await fetch(`${LEAVE_API_URL}/api/leaves/${leaveId}`, {
                method: 'DELETE'
            });

            const data = await response.json();

            if (response.ok && data.success) {
                showMessage('✅ ลบข้อมูลการลาสำเร็จ', 'success');
                await loadDoctorLeaves();
            } else {
                throw new Error(data.message || 'ไม่สามารถลบได้');
            }
        } catch (error) {
            showMessage('❌ ' + error.message, 'error');
        }
    }


    // สร้างปฏิทิน
    function renderCalendar() {
        const calendar = document.getElementById('calendar');
        const monthYear = document.getElementById('currentMonth');
        
        const monthNames = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
                          'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        
        monthYear.textContent = `${monthNames[currentMonth]} ${currentYear + 543}`;
        
        const firstDay = new Date(currentYear, currentMonth, 1);
        const lastDay = new Date(currentYear, currentMonth + 1, 0);
        const startDayOfWeek = firstDay.getDay();
        const daysInMonth = lastDay.getDate();
        
        const dayHeaders = ['จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส', 'อา'];
        
        let html = '';
        dayHeaders.forEach(day => {
            html += `<div class="calendar-day-header">${day}</div>`;
        });
        
        // วันว่าง
        const startDay = startDayOfWeek === 0 ? 6 : startDayOfWeek - 1;
        for (let i = 0; i < startDay; i++) {
            html += '<div class="calendar-day empty"></div>';
        }
        
        // วันในเดือน
        const today = new Date();
        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(currentYear, currentMonth, day);
            const dateStr = formatDate(date);
            const dayOfWeek = date.getDay();
            
            let classes = ['calendar-day'];
            
            // เสาร์อาทิตย์
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                classes.push('weekend');
            }
            
            // วันนี้
            if (date.toDateString() === today.toDateString()) {
                classes.push('today');
            }
            
            // วันที่เลือก
            if (selectedDates.includes(dateStr)) {
                classes.push('selected');
                // เพิ่มลูกศรถ้าเป็นวันเริ่มต้น
                if (startDate === dateStr && selectionStep === 1) {
                    classes.push('start-date');
                }
            }
            
            // วันที่ลาแล้ว (แสดงทุกคนในแผนก)
            if (isDateOnLeaveByAnyone(dateStr)) {
                classes.push('on-leave');
            }
            
            html += `<div class="${classes.join(' ')}" onmousedown="handleMouseDown('${dateStr}', event)">${day}</div>`;
        }
        
        calendar.innerHTML = html;
    }

    // เช็คว่าวันนี้ลาหรือไม่
    // เช็คว่ามีใครลาวันนี้บ้าง (สำหรับแสดงสีเขียวบนปฏิทิน)
    function isDateOnLeaveByAnyone(dateStr) {
        return doctorLeaves.some(leave => {
            return dateStr >= leave.start_date && dateStr <= leave.end_date;
        });
    }

    // เช็คว่าแพทย์ที่เลือกลาวันนี้แล้วหรือยัง (สำหรับป้องกันลาซ้ำ)
    function isDateOnLeaveBySelectedDoctor(dateStr) {
        const selectedDoctorId = document.getElementById('doctorSelect').value;
        if (!selectedDoctorId) return false;
        
        return doctorLeaves.some(leave => {
            return leave.doctor_id == selectedDoctorId && 
                   dateStr >= leave.start_date && 
                   dateStr <= leave.end_date;
        });
    }

    // เลือกวัน - ระบบใหม่: คลิก 2 ครั้ง
    function handleMouseDown(dateStr, event) {
        event.preventDefault();
        
        // ตรวจสอบก่อน
        if (!canSelectDate()) {
            return;
        }

        // ต้องเลือกแพทย์ก่อน
        const doctorId = document.getElementById('doctorSelect').value;
        if (!doctorId) {
            alert('⚠️ กรุณาเลือกแพทย์ที่จะลา เป็นอันดับแรก\n(เลือก แผนก >> แพทย์)');
            setTimeout(() => {
                document.getElementById('doctorSelect').focus();
            }, 100);
            return;
        }

        if (isDateOnLeaveBySelectedDoctor(dateStr)) {
            alert('⚠️ แพทย์ท่านนี้ลาวันนี้อยู่แล้ว');
            return;
        }

        // Step 0 หรือ Step 2 (รีเซ็ต) → เริ่มใหม่
        if (selectionStep === 0 || selectionStep === 2) {
            selectionStep = 1;
            startDate = dateStr;
            endDate = null;
            selectedDates = [dateStr];
        }
        // Step 1 → เลือกวันสิ้นสุด
        else if (selectionStep === 1) {
            selectionStep = 2;
            endDate = dateStr;
            
            // สร้างช่วงวัน
            const dates = getDateRange(startDate, endDate);
            // เช็คว่าแพทย์ที่เลือกไม่ได้ลาช่วงนี้อยู่แล้ว
            const hasConflict = dates.some(d => isDateOnLeaveBySelectedDoctor(d));
            if (hasConflict) {
                alert('⚠️ แพทย์ท่านนี้ลาช่วงวันนี้อยู่แล้ว กรุณาเลือกใหม่');
                selectionStep = 0;
                startDate = null;
                endDate = null;
                selectedDates = [];
            } else {
                selectedDates = dates;
            }
        }
        
        updateSelectedRange();
        renderCalendar();
    }

    // ตรวจสอบว่าสามารถเลือกวันได้หรือไม่
    function canSelectDate() {
        // ตรวจสอบว่าเลือกแผนกหรือยัง (ไม่ต้องเลือกแพทย์)
        const departmentId = document.getElementById('departmentSelect').value;
        if (!departmentId) {
            alert('⚠️ กรุณาเลือกแผนก เป็นอันดับแรก');
            
            // Focus กลับไปที่ dropdown แผนก
            setTimeout(() => {
                document.getElementById('departmentSelect').focus();
            }, 100);
            
            return false;
        }

        // ไม่ต้องเช็คแพทย์ที่มาแทน - เลือกวันก่อนได้
        return true;
    }

    // Drag selection
    // สร้างช่วงวัน
    function getDateRange(start, end) {
        const dates = [];
        let current = new Date(start);
        const endDate = new Date(end);
        
        if (current > endDate) {
            [current, endDate] = [endDate, current];
        }
        
        while (current <= endDate) {
            dates.push(formatDate(current));
            current.setDate(current.getDate() + 1);
        }
        
        return dates;
    }

    // แสดงช่วงที่เลือก
    function updateSelectedRange() {
        const rangeDiv = document.getElementById('selectedRange');
        if (selectedDates.length === 0) {
            rangeDiv.style.display = 'none';
            return;
        }
        
        const start = selectedDates[0];
        const end = selectedDates[selectedDates.length - 1];
        const days = selectedDates.length;
        
        rangeDiv.textContent = `📅 เลือก: ${formatDateThai(start)} - ${formatDateThai(end)} (${days} วัน)`;
        rangeDiv.style.display = 'block';
    }

    // ฟอร์แมตวันที่
    function formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function formatDateThai(dateStr) {
        const date = new Date(dateStr);
        const day = date.getDate();
        const month = date.getMonth() + 1;
        const year = date.getFullYear() + 543;
        return `${day}/${month}/${year}`;
    }

    // เดือนก่อนหน้า
    function previousMonth() {
        currentMonth--;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }
        renderCalendar();
    }

    // เดือนถัดไป
    function nextMonth() {
        currentMonth++;
        if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        renderCalendar();
    }

    // บันทึกการลา
    async function submitLeave() {
        const doctorId = document.getElementById('doctorSelect').value;
        const doctorName = document.getElementById('doctorSelect').selectedOptions[0]?.text || '';
        const leaveType = document.querySelector('input[name="leaveType"]:checked').value;
        const hasReplacement = document.querySelector('input[name="hasReplacement"]:checked').value === 'yes';
        const replacementDoctorId = hasReplacement ? document.getElementById('replacementDoctorSelect').value : null;
        const replacementDoctorName = hasReplacement && replacementDoctorId 
            ? document.getElementById('replacementDoctorSelect').selectedOptions[0]?.text || '' 
            : '';

        if (!doctorId) {
            showMessage('กรุณาเลือกแพทย์ที่จะลา เป็นอันดับแรก (เลือก แผนก >> แพทย์)', 'error');
            return;
        }

        if (selectedDates.length === 0) {
            showMessage('กรุณาเลือกวันที่ลา', 'error');
            return;
        }

        if (hasReplacement && !replacementDoctorId) {
            alert('⚠️ กรุณาระบุแพทย์ที่มาแทน');
            // Focus ไปที่ dropdown
            setTimeout(() => {
                document.getElementById('replacementDoctorSelect').focus();
            }, 100);
            return;
        }

        const startDateStr = selectedDates[0];
        const endDateStr = selectedDates[selectedDates.length - 1];
        
        // สร้างข้อความยืนยัน
        const leaveTypeText = leaveType === 'more_24' ? 'ลา > 24 ชม' : 'ลา ≤ 24 ชม';
        const replacementText = hasReplacement 
            ? `มีแพทย์ที่มาแทน: ${replacementDoctorName}`
            : 'ไม่มีแพทย์ที่มาแทน';
        
        const confirmMessage = `📋 ยืนยันการบันทึก\n\n` +
            `แพทย์ที่ลา: ${doctorName}\n` +
            `ประเภท: ${leaveTypeText}\n` +
            `วันที่: ${formatDateThai(startDateStr)} - ${formatDateThai(endDateStr)}\n` +
            `จำนวน: ${selectedDates.length} วัน\n` +
            `${replacementText}\n\n` +
            `ต้องการบันทึกหรือไม่?`;
        
        if (!confirm(confirmMessage)) {
            return;
        }

        try {
            console.log('=== DEBUG: Sending POST request ===');
            console.log('URL:', `${LEAVE_API_URL}/api/leaves`);
            console.log('Body:', {
                doctorId: parseInt(doctorId),
                leaveType,
                hasReplacement,
                replacementDoctorId: replacementDoctorId ? parseInt(replacementDoctorId) : null,
                startDate: startDateStr,
                endDate: endDateStr
            });

            const response = await fetch(`${LEAVE_API_URL}/api/leaves`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    doctorId: parseInt(doctorId),
                    leaveType,
                    hasReplacement,
                    replacementDoctorId: replacementDoctorId ? parseInt(replacementDoctorId) : null,
                    startDate: startDateStr,
                    endDate: endDateStr
                })
            });

            console.log('=== DEBUG: Response ===');
            console.log('Status:', response.status);
            console.log('OK:', response.ok);

            const data = await response.json();
            console.log('Data:', data);

            if (response.ok && data.success) {
                showMessage('✅ บันทึกการลาสำเร็จ', 'success');
                // รีเซ็ตสถานะ
                selectedDates = [];
                selectionStep = 0;
                startDate = null;
                endDate = null;
                loadDoctorLeaves();
                updateSelectedRange();
            } else {
                throw new Error(data.message || 'ไม่สามารถบันทึกได้');
            }
        } catch (error) {
            showMessage('❌ ' + error.message, 'error');
        }
    }

    // แสดงข้อความ
    function showMessage(text, type) {
        const msg = document.getElementById('message');
        msg.textContent = text;
        msg.className = `message ${type} show`;
        setTimeout(() => msg.classList.remove('show'), 5000);
    }
</script>
