window.onload = async function() {
    const loggedIn = sessionStorage.getItem('loggedIn');
    const role     = sessionStorage.getItem('role');
    const doctorId = sessionStorage.getItem('doctor_id');
    if (!loggedIn || role !== 'doctor' || !doctorId) {
        window.location.href = 'index.html';
        return;
    }
    await Promise.all([loadSchedule(doctorId), loadReplacements(doctorId)]);
};

function logout() {
    if (confirm('ต้องการออกจากระบบหรือไม่?')) {
        sessionStorage.clear();
        window.location.href = 'index.html';
    }
}

// ================================================================
// SECTION 1: ตารางเวรประจำ
// ================================================================
async function loadSchedule(doctorId) {
    const body = document.getElementById('scheduleBody');
    try {
        const docRes  = await fetch(`${API_URL}/api/doctors/${doctorId}`);
        const docData = await docRes.json();
        if (!docData.success) throw new Error('ไม่พบข้อมูลแพทย์');
        const doctor = docData.data;
        document.getElementById('doctorNameDisplay').textContent = doctor.name;

        const deptsRes  = await fetch(`${API_URL}/api/doctors/${doctorId}/departments`);
        const deptsData = await deptsRes.json();
        const allDepts  = deptsData.success ? deptsData.data : [];

        const primaryDept    = allDepts.find(d => d.is_primary)
                            || { department_id: doctor.department_id, department_name: 'แผนกหลัก', is_primary: 1 };
        const secondaryDepts = allDepts.filter(d => !d.is_primary);
        document.getElementById('doctorDeptDisplay').textContent = `แผนกหลัก: ${primaryDept.department_name}`;

        const dutiesRes  = await fetch(`${API_URL}/api/doctor-duties/doctor/${doctorId}`);
        const dutiesData = await dutiesRes.json();
        const allDuties  = dutiesData.success ? dutiesData.data : [];

        cachedDuties = allDuties;
        cachedDepts  = [primaryDept, ...secondaryDepts];

        let html = renderDeptBlock(primaryDept, allDuties, true);
        for (const dept of secondaryDepts) {
            html += renderDeptBlock(dept, allDuties, false);
        }
        body.innerHTML = html || '<div class="empty-state">ไม่มีข้อมูลตารางเวร</div>';
    } catch (err) {
        body.innerHTML = `<div class="empty-state">❌ ${err.message}</div>`;
    }
}

function renderDeptBlock(dept, allDuties, isPrimary) {
    const deptDuties = allDuties.filter(d => d.department_id === dept.department_id);
    const labelClass = isPrimary ? '' : 'secondary';
    const labelText  = isPrimary
        ? `🏥 ${dept.department_name} (แผนกหลัก)`
        : `🔗 ${dept.department_name} (แผนกเสริม)`;
    const inner = deptDuties.length === 0
        ? '<div class="no-duty-text">ไม่มี Duty ที่กำหนด</div>'
        : sortMode === 'day'
            ? renderDoctorDutiesHTML_byDay(deptDuties, `dept${dept.department_id}`)
            : renderDoctorDutiesHTML(deptDuties, `dept${dept.department_id}`);
    return `<div class="dept-block"><div class="dept-label ${labelClass}">${labelText}</div>${inner}</div>`;
}

function parseDutyName(dutyName) {
    const match = dutyName.match(/^(.*?)\s*\((\d{2}:\d{2})-(\d{2}:\d{2})\)$/);
    if (match) return { baseName: match[1].trim(), startTime: match[2], endTime: match[3] };
    return { baseName: dutyName, startTime: null, endTime: null };
}

const DAY_LABEL_UD = {
    monday:'จ', tuesday:'อ', wednesday:'พ',
    thursday:'พฤ', friday:'ศ', saturday:'ส', sunday:'อา'
};

// GEN8 V1: renderDoctorDutiesHTML — Map-based grouping (merge same baseName)
function renderDoctorDutiesHTML(duties, prefix) {
    if (duties.length === 0) return '';

    // worker expand + sort ให้แล้ว แต่ fallback สำหรับ backward compat
    const dayKeys = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
    const expanded = [];
    duties.forEach(d => {
        if (d.day_of_week) {
            expanded.push(d);
        } else {
            dayKeys.forEach(k => {
                if (d[k] === 1 || d[k] === true) expanded.push({ ...d, day_of_week: k });
            });
        }
    });

    expanded.sort((a,b) => {
        const dd = dayKeys.indexOf(a.day_of_week) - dayKeys.indexOf(b.day_of_week);
        if (dd !== 0) return dd;
        return (a.start_time||'00:00').localeCompare(b.start_time||'00:00');
    });

    // Map-based grouping — merge ทุก baseName เดียวกัน
    const groupMap = new Map();
    expanded.forEach(d => {
        const p = parseDutyName(d.duty_name);
        if (!groupMap.has(p.baseName)) groupMap.set(p.baseName, { baseName: p.baseName, rows: [] });
        groupMap.get(p.baseName).rows.push({ duty: d, parsed: p });
    });
    const groups = Array.from(groupMap.values());

    let html = '<div class="doctor-duties-list">';
    groups.forEach((group, gi) => {
        const gid = `${prefix}_${gi}_${group.baseName.replace(/[^a-zA-Z0-9]/g,'_')}`;
        const hasTime = group.rows.some(r => r.parsed.startTime);

        if (hasTime && group.rows.length > 1) {
            const sumDays  = group.rows.map(r => DAY_LABEL_UD[r.duty.day_of_week]||'').join(', ');
            const starts   = group.rows.map(r=>r.parsed.startTime).filter(Boolean);
            const ends     = group.rows.map(r=>r.parsed.endTime).filter(Boolean);
            const timeRange = starts.length
                ? `(${starts.reduce((a,b)=>a<b?a:b)}-${ends.reduce((a,b)=>a>b?a:b)})`
                : '';
            html += `
                <div class="doctor-duty-group-header doctor-duty-item">
                    <span class="doctor-duty-name" style="font-weight:700;">${group.baseName}</span>
                    <button onclick="toggleDutyGroup('${gid}')" id="dg_btn_${gid}" class="btn-toggle-group">แสดง</button>
                </div>
                <div class="doctor-duty-item doctor-duty-group-summary" id="dg_sum_${gid}">
                    <span class="doctor-duty-name" style="color:#888;padding-left:16px;">${timeRange}</span>
                    <span class="doctor-duty-days">${sumDays}</span>
                </div>
                <div id="dg_sub_${gid}" style="display:none;">`;
            group.rows.forEach(({ duty, parsed }) => {
                const dl = DAY_LABEL_UD[duty.day_of_week] || '';
                const tl = parsed.startTime ? `(${parsed.startTime}-${parsed.endTime})` : '';
                html += `
                    <div class="doctor-duty-item doctor-duty-group-subrow">
                        <span class="doctor-duty-name" style="color:#555;padding-left:16px;">${dl} ${tl}</span>
                    </div>`;
            });
            html += `</div>`;
        } else {
            html += `
                <div class="doctor-duty-group-label">
                    <span class="doctor-duty-base-name">${group.baseName}</span>
                </div>
                <div class="doctor-duty-group-rows">`;
            group.rows.forEach(({ duty, parsed }) => {
                const dl = DAY_LABEL_UD[duty.day_of_week] || '';
                const tl = parsed.startTime ? `(${parsed.startTime}-${parsed.endTime})` : '';
                html += `
                    <div class="doctor-duty-item">
                        <span class="doctor-duty-day-col">${dl}</span>
                        <span class="doctor-duty-time-col">${tl}</span>
                    </div>`;
            });
            html += `</div>`;
        }
    });
    html += '</div>';
    return html;
}

function toggleDutyGroup(gid) {
    const sub = document.getElementById('dg_sub_' + gid);
    const sum = document.getElementById('dg_sum_' + gid);
    const btn = document.getElementById('dg_btn_' + gid);
    const open = sub.style.display !== 'none';
    sub.style.display = open ? 'none'  : 'block';
    sum.style.display = open ? ''      : 'none';
    btn.textContent   = open ? 'แสดง'  : 'ซ่อน';
}

// GEN8 V1: เรียงตามวัน (priority: วัน > duty)
function renderDoctorDutiesHTML_byDay(duties, prefix) {
    if (duties.length === 0) return '';
    const dayKeys = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];

    const expanded = [];
    duties.forEach(d => {
        if (d.day_of_week) {
            expanded.push(d);
        } else {
            dayKeys.forEach(k => {
                if (d[k] === 1 || d[k] === true) expanded.push({ ...d, day_of_week: k });
            });
        }
    });

    const dayMap = {};
    dayKeys.forEach(d => { dayMap[d] = []; });
    expanded.forEach(d => { if (dayMap[d.day_of_week]) dayMap[d.day_of_week].push(d); });

    let html = '<div class="doctor-duties-list">';
    dayKeys.forEach(day => {
        const dayDuties = dayMap[day];
        if (dayDuties.length === 0) return;
        const dl = DAY_LABEL_UD[day];
        dayDuties.forEach((d, idx) => {
            const p = parseDutyName(d.duty_name);
            const tl = p.startTime ? ` (${p.startTime}-${p.endTime})` : '';
            html += `
                <div class="doctor-duty-item" style="grid-template-columns:28px 1fr;">
                    <span style="font-weight:700;color:#667eea;font-size:13px;">${idx === 0 ? dl : ''}</span>
                    <span style="color:#555;font-size:13px;">${p.baseName}${tl}</span>
                </div>`;
        });
    });
    html += '</div>';
    return html;
}

// GEN8 V1: toggle sort mode
function toggleSortMode() {
    sortMode = sortMode === 'duty' ? 'day' : 'duty';
    const btn = document.getElementById('sort-toggle-btn');
    if (btn) btn.textContent = sortMode === 'duty' ? 'duty' : 'วัน';
    if (!cachedDepts.length) return;
    const body = document.getElementById('scheduleBody');
    const [primary, ...secondary] = cachedDepts;
    let html = renderDeptBlock(primary, cachedDuties, true);
    secondary.forEach(dept => { html += renderDeptBlock(dept, cachedDuties, false); });
    body.innerHTML = html || '<div class="empty-state">ไม่มีข้อมูลตารางเวร</div>';
}

// ================================================================
// SECTION 2: รายการรับฝาก
// ================================================================
async function loadReplacements(doctorId) {
    const body = document.getElementById('replacementBody');
    try {
        const res  = await fetch(`${API_URL}/api/leaves/replacement/${doctorId}`);
        const data = await res.json();
        if (!data.success) throw new Error(data.message || 'เกิดข้อผิดพลาด');
        if (!data.data || data.data.length === 0) {
            body.innerHTML = '<div class="empty-state">ไม่มีรายการที่รับฝาก</div>';
            return;
        }
        body.innerHTML = data.data.map(leave => renderRepCard(leave)).join('');
    } catch (err) {
        body.innerHTML = `<div class="empty-state">❌ ${err.message}</div>`;
    }
}

function formatDateThai(dateStr) {
    const d = new Date(dateStr);
    const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543}`;
}
function formatDateShort(dateStr) {
    const d = new Date(dateStr);
    return `${d.getDate()}/${d.getMonth()+1}/${(d.getFullYear()+543).toString().slice(-2)}`;
}

function renderRepCard(leave) {
    const status   = leave.approval_status;
    // pending ไม่มี label แสดง — แสดงแค่ approved / rejected
    const statusTH  = { approved:'✅ อนุมัติแล้ว', rejected:'❌ ปฏิเสธ' };
    const chipClass = { pending:'', approved:'approved-chip', rejected:'rejected-chip' };

    const dateRange = leave.start_date === leave.end_date
        ? formatDateThai(leave.start_date)
        : `${formatDateThai(leave.start_date)} – ${formatDateThai(leave.end_date)}`;

    const delegateLabel = leave.delegation_type === 'single' ? 'ฝาก 1 คน' : 'กำหนดเอง';

    const dayRows = (leave.duty_per_day || []).map(day => {
        const dateLabel = `${formatDateShort(day.date)} (${day.day_label})`;
        const dutiesHtml = day.duties.length === 0
            ? `<span class="no-duty">ไม่มี duty</span>`
            : day.duties.map(du => {
                // GEN6: แสดง split_label ถ้ามี
                const splitNote = du.split_label ? ` [${du.split_label}]` : '';
                return `<span class="duty-chip ${chipClass[status] || ''}">${du.duty_name}${splitNote}</span>`;
              }).join('');
        return `
            <div class="rep-day-row">
                <div class="rep-day-label">${dateLabel}</div>
                <div class="rep-day-duties">${dutiesHtml}</div>
            </div>`;
    }).join('');

    // badge — pending ไม่มี badge
    const badgeHtml = statusTH[status]
        ? `<span class="status-badge ${status}">${statusTH[status]}</span>`
        : '';

    return `
        <div class="rep-card">
            <div class="rep-card-header status-${status}">
                <span class="rep-doctor-name">${leave.doctor_name}</span>
                <span class="rep-dept-name">${leave.department_name} · ${delegateLabel}</span>
                ${badgeHtml}
            </div>
            <div class="rep-date-bar">📅 ${dateRange}</div>
