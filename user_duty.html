<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ภาระงาน - ระบบลางานแพทย์</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        /* ── Header ── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { color: #333; font-size: 26px; }
        .header-right { display: flex; gap: 10px; }

        .btn-back {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
            color: white;
        }
        .btn-back:hover { transform: translateY(-1px); opacity: 0.9; }
        .btn-leave  { background: #667eea; }
        .btn-logout { background: #ff6b6b; }

        /* ── Doctor Info ── */
        .doctor-info-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .doctor-info-bar .name { font-size: 18px; font-weight: 700; }
        .doctor-info-bar .dept { font-size: 14px; opacity: 0.85; }

        /* ── Section Card ── */
        .section-card {
            background: #f9f9fb;
            border-radius: 14px;
            margin-bottom: 25px;
            border: 1px solid #e8e8f0;
            overflow: hidden;
        }
        .section-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-body { padding: 18px 20px; }

        /* ── Dept Block ── */
        .dept-block {
            margin-bottom: 20px;
        }
        .dept-block:last-child { margin-bottom: 0; }

        .dept-label {
            font-size: 13px;
            font-weight: 700;
            color: white;
            background: #667eea;
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
        }
        .dept-label.secondary { background: #a29bfe; }

        /* ── Duty Items (reuse จาก dep_doc) ── */
        .doctor-duties-list { margin-top: 4px; }

        .doctor-duty-item {
            background: white;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 6px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
            border: 1px solid #e0e0e0;
            font-size: 14px;
        }
        .doctor-duty-name { font-weight: 600; color: #667eea; }
        .doctor-duty-days { color: #666; font-size: 13px; text-align: right; }

        .doctor-duty-group-header {
            background: #f0f2ff;
            border: 1px solid #c5caf5;
            border-radius: 6px;
            margin-bottom: 4px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .doctor-duty-group-header .doctor-duty-name { flex: 1; }

        .doctor-duty-group-summary {
            background: #fafafa;
            border: 1px dashed #d0d0d0;
            margin-bottom: 4px;
            margin-left: 8px;
        }
        .doctor-duty-group-subrow {
            background: white;
            border: 1px solid #e8e8e8;
            margin-bottom: 4px;
            margin-left: 8px;
        }

        .btn-toggle-group {
            background: #667eea;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            margin-left: auto;
        }
        .btn-toggle-group:hover { background: #5568d3; }

        .no-duty-text {
            color: #aaa;
            font-size: 13px;
            font-style: italic;
            padding: 8px 0;
        }

        /* ── Replacement Cards ── */
        .rep-card {
            background: white;
            border-radius: 10px;
            margin-bottom: 14px;
            border: 1px solid #e0e0e0;
            overflow: hidden;
        }

        /* Status สี header ของการ์ด */
        .rep-card-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .rep-card-header.status-approved { background: #212121; border-left: 5px solid #000; }
        .rep-card-header.status-rejected {
            background: #f5f5f5;
            border-left: 5px solid #333;
            position: relative;
        }

        .rep-doctor-name {
            font-weight: 700;
            font-size: 15px;
        }
        .rep-card-header.status-approved .rep-doctor-name { color: white; }
        .rep-card-header.status-rejected .rep-doctor-name {
            color: #555;
            position: relative;
            display: inline-block;
        }
        /* แถบแดงพาดชื่อ */
        .rep-card-header.status-rejected .rep-doctor-name::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            top: 50%;
            height: 2px;
            background: #e53935;
            transform: translateY(-50%);
        }

        .rep-dept-name {
            font-size: 13px;
            opacity: 0.75;
        }
        .rep-card-header.status-approved .rep-dept-name { color: #ddd; }

        .status-badge {
            margin-left: auto;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }
        .status-badge.approved { background: #444;    color: white; border: 1px solid #888; }
        .status-badge.rejected { background: #bbb;    color: #333; border: 1px solid #888; }

        /* Date range bar */
        .rep-date-bar {
            padding: 8px 16px;
            font-size: 13px;
            background: #f5f5f5;
            color: #555;
            border-bottom: 1px solid #eee;
        }
        .rep-card-header.status-approved + .rep-date-bar {
            background: #333;
            color: #ccc;
            border-bottom: 1px solid #555;
        }

        /* Duty per day list */
        .rep-day-list { padding: 10px 16px; }

        .rep-day-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 5px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }
        .rep-day-row:last-child { border-bottom: none; }

        .rep-day-label {
            min-width: 90px;
            color: #555;
            font-weight: 600;
        }
        .rep-day-duties { color: #333; flex: 1; }
        .rep-day-duties .no-duty { color: #bbb; font-style: italic; }

        .duty-chip {
            display: inline-block;
            background: #e8eaff;
            color: #3d3d8f;
            border-radius: 10px;
            padding: 2px 9px;
            font-size: 12px;
            font-weight: 600;
            margin: 2px 3px 2px 0;
        }
        .duty-chip.approved-chip { background: #444; color: #ddd; }
        .duty-chip.rejected-chip { background: #ddd; color: #888; }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 30px;
            color: #aaa;
            font-size: 15px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 20px;
            color: #888;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container { padding: 16px; }
            .header h1 { font-size: 20px; }
            .doctor-duty-item { grid-template-columns: 1fr; gap: 4px; }
            .doctor-duty-days { text-align: left; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- Header -->
    <div class="header">
        <h1>⚡ ภาระงาน</h1>
        <div class="header-right">
            <button class="btn-back btn-leave" onclick="window.location.href='user.html'">← จัดการการลา</button>
            <button class="btn-back btn-logout" onclick="logout()">ออกจากระบบ</button>
        </div>
    </div>

    <!-- Doctor Info -->
    <div class="doctor-info-bar">
        <div>
            <div class="name" id="doctorNameDisplay">กำลังโหลด...</div>
            <div class="dept" id="doctorDeptDisplay"></div>
        </div>
    </div>

    <!-- Section 1: ตารางเวรประจำ -->
    <div class="section-card">
        <div class="section-header">📅 ตารางเวรประจำ</div>
        <div class="section-body" id="scheduleBody">
            <div class="loading">กำลังโหลดข้อมูล...</div>
        </div>
    </div>

    <!-- Section 2: รายการรับฝาก -->
    <div class="section-card">
        <div class="section-header">🤝 รายการที่รับฝาก</div>
        <div class="section-body" id="replacementBody">
            <div class="loading">กำลังโหลดข้อมูล...</div>
        </div>
    </div>

</div>

<script>
    const API_URL = 'https://dep-doc-worker.9vk92zm5z2.workers.dev';

    // ─── Auth check ────────────────────────────────────────
    window.onload = async function() {
        const loggedIn  = sessionStorage.getItem('loggedIn');
        const role      = sessionStorage.getItem('role');
        const doctorId  = sessionStorage.getItem('doctor_id');

        if (!loggedIn || role !== 'doctor' || !doctorId) {
            window.location.href = 'index.html';
            return;
        }

        await Promise.all([
            loadSchedule(doctorId),
            loadReplacements(doctorId)
        ]);
    };

    function logout() {
        if (confirm('ต้องการออกจากระบบหรือไม่?')) {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }
    }

    // ================================================================
    // SECTION 1: ตารางเวรประจำ
    // ================================================================
    async function loadSchedule(doctorId) {
        const body = document.getElementById('scheduleBody');
        try {
            // 1. ดึงข้อมูลแพทย์
            const docRes  = await fetch(`${API_URL}/api/doctors/${doctorId}`);
            const docData = await docRes.json();
            if (!docData.success) throw new Error('ไม่พบข้อมูลแพทย์');
            const doctor = docData.data;

            // แสดงชื่อ
            document.getElementById('doctorNameDisplay').textContent = doctor.name;

            // 2. ดึงแผนกทั้งหมดของแพทย์ (primary + secondary)
            const deptsRes  = await fetch(`${API_URL}/api/doctors/${doctorId}/departments`);
            const deptsData = await deptsRes.json();
            const allDepts  = deptsData.success ? deptsData.data : [];

            // แยก primary / secondary
            const primaryDept = allDepts.find(d => d.is_primary) 
                             || { department_id: doctor.department_id, department_name: doctor.department_name || 'แผนกหลัก', is_primary: 1 };
            const secondaryDepts = allDepts.filter(d => !d.is_primary);

            document.getElementById('doctorDeptDisplay').textContent = `แผนกหลัก: ${primaryDept.department_name}`;

            // 3. ดึง duties ทั้งหมดของแพทย์
            const dutiesRes  = await fetch(`${API_URL}/api/doctor-duties/doctor/${doctorId}`);
            const dutiesData = await dutiesRes.json();
            const allDuties  = dutiesData.success ? dutiesData.data : [];

            // 4. Render
            let html = '';

            // แผนกหลัก
            html += renderDeptBlock(primaryDept, allDuties, true);

            // แผนกเสริม
            for (const dept of secondaryDepts) {
                html += renderDeptBlock(dept, allDuties, false);
            }

            body.innerHTML = html || '<div class="empty-state">ไม่มีข้อมูลตารางเวร</div>';

        } catch (err) {
            body.innerHTML = `<div class="empty-state">❌ ${err.message}</div>`;
        }
    }

    function renderDeptBlock(dept, allDuties, isPrimary) {
        const deptDuties = allDuties.filter(d => d.department_id === dept.department_id);
        const labelClass = isPrimary ? '' : 'secondary';
        const labelText  = isPrimary
            ? `🏥 ${dept.department_name} (แผนกหลัก)`
            : `🔗 ${dept.department_name} (แผนกเสริม)`;

        let inner = '';
        if (deptDuties.length === 0) {
            inner = '<div class="no-duty-text">ไม่มี Duty ที่กำหนด</div>';
        } else {
            inner = renderDoctorDutiesHTML(deptDuties, `dept${dept.department_id}`);
        }

        return `
            <div class="dept-block">
                <div class="dept-label ${labelClass}">${labelText}</div>
                ${inner}
            </div>
        `;
    }

    // ── Helper: parse duty name เพื่อหา base + time ──────────────────
    function parseDutyName(dutyName) {
        const match = dutyName.match(/^(.*?)\s*\((\d{2}:\d{2})-(\d{2}:\d{2})\)$/);
        if (match) return { baseName: match[1].trim(), startTime: match[2], endTime: match[3] };
        return { baseName: dutyName, startTime: null, endTime: null };
    }

    function groupDoctorDutiesByBaseName(duties) {
        const parsed = duties.map(d => ({ ...d, _p: parseDutyName(d.duty_name) }));
        const baseMap = {};
        parsed.forEach(d => {
            if (d._p.startTime !== null) {
                if (!baseMap[d._p.baseName]) baseMap[d._p.baseName] = [];
                baseMap[d._p.baseName].push(d);
            }
        });
        const groupNames = new Set(Object.keys(baseMap).filter(k => baseMap[k].length >= 2));

        const result = [];
        const added  = new Set();
        parsed.forEach(d => {
            const { baseName, startTime } = d._p;
            if (groupNames.has(baseName) && startTime !== null) {
                if (!added.has(baseName)) {
                    added.add(baseName);
                    const subs = baseMap[baseName].sort((a,b) => a._p.startTime.localeCompare(b._p.startTime));
                    const dayKeys = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
                    const summaryDays = {};
                    dayKeys.forEach(k => { summaryDays[k] = subs.reduce((s,x) => s + (x[k] ? 1 : 0), 0); });
                    const sumStart = subs.map(x=>x._p.startTime).reduce((a,b)=>a<b?a:b);
                    const sumEnd   = subs.map(x=>x._p.endTime).reduce((a,b)=>a>b?a:b);
                    result.push({ type:'group', baseName, duties:subs, summary:{ startTime:sumStart, endTime:sumEnd, ...summaryDays } });
                }
            } else {
                result.push({ type:'single', duty:d });
            }
        });
        return result;
    }

    function renderDutyDays(duty) {
        const map = { monday:'จ', tuesday:'อ', wednesday:'พ', thursday:'พฤ', friday:'ศ', saturday:'ส', sunday:'อา' };
        return Object.entries(map).filter(([k])=>duty[k]).map(([,v])=>v).join(', ');
    }
    function renderSummaryDays(s) {
        const map = { monday:'จ', tuesday:'อ', wednesday:'พ', thursday:'พฤ', friday:'ศ', saturday:'ส', sunday:'อา' };
        return Object.entries(map).filter(([k])=>s[k]).map(([k,v])=>`${s[k]} ${v}`).join(', ');
    }

    function renderDoctorDutiesHTML(duties, prefix) {
        duties.sort((a,b)=>{
            const ae=/^[a-zA-Z]/.test(a.duty_name), be=/^[a-zA-Z]/.test(b.duty_name);
            if(ae&&!be) return -1; if(!ae&&be) return 1;
            return a.duty_name.localeCompare(b.duty_name,['en','th']);
        });
        const grouped = groupDoctorDutiesByBaseName(duties);
        let html = '<div class="doctor-duties-list">';

        grouped.forEach(item => {
            if (item.type === 'single') {
                const d = item.duty;
                html += `
                    <div class="doctor-duty-item">
                        <span class="doctor-duty-name">${d.duty_name}</span>
                        <span class="doctor-duty-days">${renderDutyDays(d)}</span>
                    </div>`;
            } else {
                const gid = `${prefix}_${item.baseName.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'')}`;
                const { summary, duties: subs } = item;
                html += `
                    <div class="doctor-duty-group-header doctor-duty-item">
                        <span class="doctor-duty-name" style="font-weight:700;">${item.baseName}</span>
                        <button onclick="toggleDutyGroup('${gid}')" id="dg_btn_${gid}" class="btn-toggle-group">แสดง</button>
                    </div>
                    <div class="doctor-duty-item doctor-duty-group-summary" id="dg_sum_${gid}">
                        <span class="doctor-duty-name" style="color:#888;padding-left:16px;">(${summary.startTime}-${summary.endTime})</span>
                        <span class="doctor-duty-days">${renderSummaryDays(summary)}</span>
                    </div>
                    <div id="dg_sub_${gid}" style="display:none;">`;
                subs.forEach(d => {
                    html += `
                        <div class="doctor-duty-item doctor-duty-group-subrow">
                            <span class="doctor-duty-name" style="color:#555;padding-left:16px;">(${d._p.startTime}-${d._p.endTime})</span>
                            <span class="doctor-duty-days">${renderDutyDays(d)}</span>
                        </div>`;
                });
                html += `</div>`;
            }
        });

        html += '</div>';
        return html;
    }

    function toggleDutyGroup(gid) {
        const sub = document.getElementById('dg_sub_' + gid);
        const sum = document.getElementById('dg_sum_' + gid);
        const btn = document.getElementById('dg_btn_' + gid);
        const open = sub.style.display !== 'none';
        sub.style.display = open ? 'none' : 'block';
        sum.style.display = open ? ''     : 'none';
        btn.textContent   = open ? 'แสดง' : 'ซ่อน';
    }

    // ================================================================
    // SECTION 2: รายการรับฝาก
    // ================================================================
    async function loadReplacements(doctorId) {
        const body = document.getElementById('replacementBody');
        try {
            const res  = await fetch(`${API_URL}/api/leaves/replacement/${doctorId}`);
            const data = await res.json();

            if (!data.success) throw new Error(data.message || 'เกิดข้อผิดพลาด');

            if (!data.data || data.data.length === 0) {
                body.innerHTML = '<div class="empty-state">ไม่มีรายการที่รับฝาก</div>';
                return;
            }

            const filtered = data.data.filter(l => l.approval_status !== 'pending');
            if (filtered.length === 0) {
                body.innerHTML = '<div class="empty-state">ไม่มีรายการที่รับฝาก</div>';
                return;
            }
            body.innerHTML = filtered.map(leave => renderRepCard(leave)).join('');

        } catch (err) {
            body.innerHTML = `<div class="empty-state">❌ ${err.message}</div>`;
        }
    }

    function formatDateThai(dateStr) {
        const d = new Date(dateStr);
        const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
        return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543}`;
    }
    function formatDateShort(dateStr) {
        const d = new Date(dateStr);
        return `${d.getDate()}/${d.getMonth()+1}/${(d.getFullYear()+543).toString().slice(-2)}`;
    }

    function renderRepCard(leave) {
        const status    = leave.approval_status; // approved | rejected
        const statusTH  = { approved:'✅ อนุมัติแล้ว', rejected:'❌ ปฏิเสธ' };
        const chipClass = { approved:'approved-chip', rejected:'rejected-chip' };

        const dateRange = leave.start_date === leave.end_date
            ? formatDateThai(leave.start_date)
            : `${formatDateThai(leave.start_date)} – ${formatDateThai(leave.end_date)}`;

        const delegateLabel = leave.delegation_type === 'single' ? 'ฝาก 1 คน' : 'กำหนดเอง';

        // Duty per day rows
        const dayRows = (leave.duty_per_day || []).map(day => {
            const dateLabel = `${formatDateShort(day.date)} (${day.day_label})`;
            let dutiesHtml;
            if (day.duties.length === 0) {
                dutiesHtml = `<span class="no-duty">ไม่มี duty</span>`;
            } else {
                dutiesHtml = day.duties.map(du => {
                    const timeLabel = du.start_time && !du.is_all_day
                        ? ` <span style="font-weight:400;opacity:0.8">${du.start_time}-${du.end_time}</span>`
                        : '';
                    return `<span class="duty-chip ${chipClass[status]}">${du.duty_name}</span>`;
                }).join('');
            }
            return `
                <div class="rep-day-row">
                    <div class="rep-day-label">${dateLabel}</div>
                    <div class="rep-day-duties">${dutiesHtml}</div>
                </div>`;
        }).join('');

        // Header style ตาม status
        const headerClass = `status-${status}`;

        // Doctor name — rejected ใส่ strikethrough via CSS ::after
        const doctorNameHtml = `<span class="rep-doctor-name">${leave.doctor_name}</span>`;

        return `
            <div class="rep-card">
                <div class="rep-card-header ${headerClass}">
                    ${doctorNameHtml}
                    <span class="rep-dept-name">${leave.department_name} · ${delegateLabel}</span>
                    <span class="status-badge ${status}">${statusTH[status]}</span>
                </div>
                <div class="rep-date-bar">
                    📅 ${dateRange}
                </div>
                ${dayRows ? `<div class="rep-day-list">${dayRows}</div>` : ''}
            </div>`;
    }
</script>
</body>
</html>
