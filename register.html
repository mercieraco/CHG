    <div class="register-container">
        <div class="header">
            <div class="icon">📝</div>
            <h1>ลงทะเบียน</h1>

```
    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>

    <form id="registerForm">
        <div class="form-group">
            <label for="licenseNumber">เลขใบประกอบวิชาชีพแพทย์ (เลข ว)</label>
            <input type="text" id="licenseNumber" name="licenseNumber" required 
                   placeholder="กรอกเลขใบประกอบวิชาชีพ" pattern="[0-9]+">
            <small>กรอกเฉพาะตัวเลขเท่านั้น</small>
        </div>

        <div class="form-group">
            <label for="password">รหัสผ่าน</label>
            <input type="password" id="password" name="password" required 
                   placeholder="กรอกรหัสผ่าน" minlength="4">
            <small>รหัสผ่านอย่างน้อย 4 ตัวอักษร</small>
        </div>

        <div class="form-group">
            <label for="confirmPassword">ยืนยันรหัสผ่าน</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required 
                   placeholder="กรอกรหัสผ่านอีกครั้ง" minlength="4">
        </div>

        <div class="form-group pin-section">
            <label for="resetPin">🔐 รหัส PIN สำหรับ Reset Password (4 หลัก)</label>
            <input type="text" id="resetPin" name="resetPin" required 
                   placeholder="กรอกเลข 4 หลัก" pattern="[0-9]{4}" maxlength="4" inputmode="numeric">
            <small>⚠️ เลขนี้ใช้สำหรับการ reset password<br>
            กรุณาใส่เลขสี่หลักที่จำได้ง่าย เช่น วันเดือนที่เกิด, ปี พศ หรือ คศ ที่เกิด</small>
        </div>

        <div class="form-group">
            <label for="confirmResetPin">ยืนยันรหัส PIN</label>
            <input type="text" id="confirmResetPin" name="confirmResetPin" required 
                   placeholder="กรอกเลข 4 หลักอีกครั้ง" pattern="[0-9]{4}" maxlength="4" inputmode="numeric">
        </div>

        <button type="submit" class="btn btn-primary">ลงทะเบียน</button>
        <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">← กลับไปหน้าล็อกอินระบบ</button>
    </form>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const licenseNumber = document.getElementById('licenseNumber').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const resetPin = document.getElementById('resetPin').value.trim();
        const confirmResetPin = document.getElementById('confirmResetPin').value.trim();
        
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        
        errorMessage.classList.remove('show');
        successMessage.classList.remove('show');

        if (password !== confirmPassword) {
            errorMessage.textContent = '❌ รหัสผ่านไม่ตรงกัน กรุณาตรวจสอบอีกครั้ง';
            errorMessage.classList.add('show');
            return;
        }

        if (!/^[0-9]+$/.test(licenseNumber)) {
            errorMessage.textContent = '❌ เลขใบประกอบวิชาชีพต้องเป็นตัวเลขเท่านั้น';
            errorMessage.classList.add('show');
            return;
        }

        if (!/^[0-9]{4}$/.test(resetPin)) {
            errorMessage.textContent = '❌ รหัส PIN ต้องเป็นตัวเลข 4 หลักเท่านั้น';
            errorMessage.classList.add('show');
            return;
        }

        if (resetPin !== confirmResetPin) {
            errorMessage.textContent = '❌ รหัส PIN ไม่ตรงกัน กรุณาตรวจสอบอีกครั้ง';
            errorMessage.classList.add('show');
            return;
        }

        try {
            const response = await fetch('https://doc-leave-api.9vk92zm5z2.workers.dev/api/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    licenseNumber: licenseNumber,
                    password: password,
                    resetPin: resetPin
                })
            });

            const data = await response.json();
            
            if (response.ok && data.success) {
                successMessage.innerHTML = `
                    ✅ <strong>ลงทะเบียนสำเร็จ!</strong><br><br>
                    <strong>ข้อมูลของคุณ:</strong><br>
                    เลขใบประกอบวิชาชีพ: <strong>${licenseNumber}</strong><br>
                    รหัส PIN: <strong>${resetPin}</strong> (เก็บไว้ดีๆ สำหรับ reset password)<br><br>
                    🎉 <strong>สามารถ Login ได้ทันที!</strong><br>
                    <small>กดปุ่มด้านล่างเพื่อไปหน้า Login</small>
                `;
                successMessage.classList.add('show');
                
                document.getElementById('registerForm').reset();
            } else {
                throw new Error(data.message || 'เกิดข้อผิดพลาด');
            }

        } catch (error) {
            console.error('Registration error:', error);
            errorMessage.textContent = '❌ เกิดข้อผิดพลาด: ' + error.message;
            errorMessage.classList.add('show');
        }
    });
</script>
