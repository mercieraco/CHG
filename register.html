        display: block;

    <div id="successMessage" class="success-message"></div>
    <div id="errorMessage" class="error-message"></div>

    <form id="registerForm">
        <div class="form-group">
            <label for="licenseNumber">เลขใบประกอบวิชาชีพแพทย์ (เลข ว)</label>
            <input type="text" id="licenseNumber" name="licenseNumber" required 
                   placeholder="กรอกเลขใบประกอบวิชาชีพ" pattern="[0-9]+">
            <small>กรอกเฉพาะตัวเลขเท่านั้น</small>
        </div>

        <div class="form-group">
            <label for="email">อีเมล</label>
            <input type="email" id="email" name="email" required 
                   placeholder="example@hospital.com">
            <small>ใช้สำหรับยืนยันตัวตนและรับการแจ้งเตือน</small>
        </div>

        <div class="form-group">
            <label for="password">รหัสผ่าน</label>
            <input type="password" id="password" name="password" required 
                   placeholder="กรอกรหัสผ่าน" minlength="4">
            <small>รหัสผ่านอย่างน้อย 4 ตัวอักษร</small>
        </div>

        <div class="form-group">
            <label for="confirmPassword">ยืนยันรหัสผ่าน</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required 
                   placeholder="กรอกรหัสผ่านอีกครั้ง" minlength="4">
        </div>

        <button type="submit" class="btn btn-primary">ลงทะเบียน</button>
        <button type="button" class="btn btn-secondary" onclick="goBack()">← กลับไปหน้าเข้าสู่ระบบ</button>
    </form>
</div>
