        const doctorName = document.getElementById('doctorSelect').selectedOptions[0]?.text || '';

        if (!doctorId) {
            showMessage('กรุณาเลือกแพทย์ที่จะลา เป็นอันดับแรก (เลือก แผนก >> แพทย์)', 'error');
            return;
        }

        if (selectedDates.length === 0) {
            showMessage('กรุณาเลือกวันที่ลา', 'error');
            return;
        }

        // เช็คว่ากดยืนยันเลือกวันที่แล้วหรือยัง
        if (currentDutyData.length === 0) {
            showMessage('กรุณากดปุ่ม "ยืนยันเลือกวันที่ลา" ก่อน', 'error');
            return;
        }

        // ========================================
        // Multi-Department: เช็คแผนกที่เลือก
        // ========================================
        const selectedDepartments = getSelectedDepartments();
        
        if (selectedDepartments.length === 0) {
            showMessage('กรุณาเลือกอย่างน้อย 1 แผนก', 'error');
            return;
        }

        const startDateStr = selectedDates[0];
        const endDateStr = selectedDates[selectedDates.length - 1];

        let confirmMessage = `📋 ยืนยันการบันทึก\n\n` +
            `แพทย์ที่ลา: ${doctorName}\n` +
            `วันที่: ${formatDateThai(startDateStr)} - ${formatDateThai(endDateStr)}\n` +
            `จำนวน: ${selectedDates.length} วัน\n`;

        // แสดงแผนกที่เลือก (ถ้ามีหลายแผนก)
        if (selectedDepartments.length > 1) {
            confirmMessage += `แผนก: ${selectedDepartments.map(d => d.department_name).join(', ')}\n`;
            confirmMessage += `⚠️ จะบันทึกแยกกัน ${selectedDepartments.length} ครั้ง\n`;
        }

        // ========================================
        // เก็บข้อมูล Delegation ของแต่ละแผนก
        // ========================================
        const departmentData = [];
        
        for (const dept of selectedDepartments) {
            const deptId = dept.department_id;
            const delegationType = document.querySelector(`input[name="delegationType_${deptId}"]:checked`)?.value || 'none';
            
            let deptRequestBody = {
                doctorId: parseInt(doctorId),
                startDate: startDateStr,
                endDate: endDateStr,
                delegationType: delegationType,
                departmentId: deptId
            };

            if (delegationType === 'single') {
                // Single Delegation
                const replacementSelect = document.getElementById(`replacementDoctorSelect_${deptId}`);
                const replacementDoctorId = replacementSelect?.value;
                const replacementDoctorName = replacementDoctorId 
                    ? replacementSelect.selectedOptions[0]?.text || '' 
                    : '';

                if (!replacementDoctorId) {
                    showMessage(`กรุณาเลือกแพทย์ที่มาแทนสำหรับแผนก ${dept.department_name}`, 'error');
                    return;
                }

                deptRequestBody.hasReplacement = true;
                deptRequestBody.replacementDoctorId = parseInt(replacementDoctorId);
                
                confirmMessage += `\n📍 ${dept.department_name}: แพทย์ ${replacementDoctorName}`;

            } else if (delegationType === 'custom') {
                // GEN4 V3 Step 4: Custom Delegation with Grouping
                
                // รวบรวมข้อมูลทั้งหมด
                const allDuties = [];
                
                // หา duties ทั้งหมดจาก DOM
                const allSelects = document.querySelectorAll(`.custom-delegation-select[data-dept-id="${deptId}"]`);
                
                console.log(`=== Collecting duties for Dept ${deptId} ===`);
                console.log('Found selects:', allSelects.length);
                console.log('dutyDelegationStates:', dutyDelegationStates);
                
                allSelects.forEach(select => {
                    const uniqueId = select.dataset.uniqueId;
                    const dutyId = select.dataset.dutyId;
                    const date = select.dataset.date;
                    const splitLabel = select.dataset.splitLabel || null; // GEN6
                    const parentUid = select.dataset.parentUid || null;  // GEN6

                    // GEN7: เช็คว่า split row นี้เลือก "อยู่เอง" หรือไม่
                    const isSelfDuty = parentUid ? !!splitSelfOnDutyStates[uniqueId] : false;

                    // GEN6: ถ้าเป็น split row ให้ใช้ state ของ parent (delegate เสมอ)
                    let state;
                    if (parentUid) {
                        state = 'delegate'; // split rows บังคับ delegate (รวม self-duty)
                    } else if (splitLabel === null && dutySplitStates[uniqueId]) {
                        return; // parent ที่ split แล้ว — ข้าม (ใช้ child rows แทน)
                    } else {
                        state = dutyDelegationStates[uniqueId] || 'delegate';
                    }

                    console.log(`  - uniqueId: ${uniqueId}, state: ${state}, splitLabel: ${splitLabel}, isSelfDuty: ${isSelfDuty}`);

                    allDuties.push({
                        uniqueId,
                        date,
                        dutyId,
                        state,
                        splitLabel,
                        isSelfDuty,
                        select
                    });
                });
                
                console.log('Total allDuties:', allDuties.length);
                
                // Validation: ต้องมีอย่างน้อย 1 duty
                if (allDuties.length === 0) {
                    showMessage(`ไม่มี duty สำหรับแผนก ${dept.department_name}`, 'error');
                    return;
                }
                
                // Validation: เช็คว่าเลือกแพทย์ครบทุก duty ที่ "ฝาก" (รวม split rows)
                // GEN7: ข้าม row ที่ isSelfDuty = true
                for (const item of allDuties) {
                    if (item.state === 'delegate' && !item.isSelfDuty) {
                        const select = document.querySelector(`.custom-delegation-select[data-unique-id="${item.uniqueId}"]`);
                        const replacementDoctorId = select?.value;
                        if (!replacementDoctorId) {
                            const label = item.splitLabel ? `(${item.splitLabel}) ` : '';
                            showMessage(`กรุณาเลือกแพทย์ที่มาแทนให้ครบทุก Duty ${label}ที่เลือก "ฝาก" ในแผนก ${dept.department_name}`, 'error');
                            return;
                        }
                    }
                }
                
                // Validation: เช็คว่าใส่เหตุผลครบทุก duty ที่ "ไม่ฝาก"
                for (const item of allDuties) {
                    if (item.state === 'no-delegate') {
                        const textarea = document.getElementById(`noDelegationReason_${item.uniqueId}`);
                        const reason = textarea?.value.trim() || '';
                        
                        if (!reason) {
                            showMessage(`กรุณาระบุเหตุผลให้ครบทุก Duty ที่เลือก "ไม่ฝาก" ในแผนก ${dept.department_name}`, 'error');
                            textarea?.focus();
                            return;
                        }
                    }
                }
                
                // GEN4 V3 Step 5: Group วันติดกัน (ทั้ง delegate และ no-delegate)
                const { delegateGroups, noDelegateGroups } = groupConsecutiveDelegateDays(allDuties);
                
                console.log(`=== Dept ${deptId}: ${delegateGroups.length} delegate groups, ${noDelegateGroups.length} no-delegate groups ===`);
                
                // บันทึกข้อมูล
                const dutyAssignments = [];
                for (const item of allDuties.filter(d => d.state === 'delegate')) {
                    // GEN7: self-duty → replacementDoctorId = null, isSelfDuty = true
                    if (item.isSelfDuty) {
                        dutyAssignments.push({
                            dutyId: parseInt(item.dutyId),
                            dutyDate: item.date,
                            replacementDoctorId: null,
                            splitLabel: item.splitLabel || null,
                            isSelfDuty: true
                        });
                    } else {
                        const select = document.querySelector(`.custom-delegation-select[data-unique-id="${item.uniqueId}"]`);
                        dutyAssignments.push({
                            dutyId: parseInt(item.dutyId),
                            dutyDate: item.date,
                            replacementDoctorId: parseInt(select.value),
                            splitLabel: item.splitLabel || null,  // GEN6
                            isSelfDuty: false
                        });
                    }
                }
                
                deptRequestBody.dutyAssignments = dutyAssignments;
                
                // GEN4 V3 Step 5: เก็บ grouping info
                deptRequestBody.delegateGroups = delegateGroups;
                deptRequestBody.noDelegateGroups = noDelegateGroups;
                
                confirmMessage += `\n📍 ${dept.department_name}: กำหนดเอง (${delegateGroups.length} กลุ่มฝาก, ${noDelegateGroups.length} กลุ่มไม่ฝาก)`;
                
            } else if (delegationType === 'none') {
                // No Delegation
                const reasonTextarea = document.getElementById(`noDelegationReason_${deptId}`);
                const reason = reasonTextarea?.value.trim() || '';
                
                if (!reason) {
                    showMessage(`กรุณาระบุเหตุผลที่ไม่ฝากงานสำหรับแผนก ${dept.department_name}`, 'error');
                    reasonTextarea?.focus();
                    return;
                }
                
                deptRequestBody.hasReplacement = false;
                deptRequestBody.noDelegationReason = reason;
                confirmMessage += `\n📍 ${dept.department_name}: ไม่ฝากงาน`;
            }

            departmentData.push({
                department: dept,
                requestBody: deptRequestBody
            });
        }

        confirmMessage += `\n\nต้องการบันทึกหรือไม่?`;
        
        // Confirm
        if (!confirm(confirmMessage)) {
            return;
        }

        // GEN4 V3: แจ้งเตือนเพิ่มถ้ามีแผนกที่ไม่ฝากงาน (รวม custom delegation)
        const noDelegationDepts = departmentData.filter(d => {
            // เช็คทั้ง delegation_type: none และ custom ที่มี noDelegateGroups
            if (d.requestBody.delegationType === 'none') {
                return true;
            }
            if (d.requestBody.delegationType === 'custom' && d.requestBody.noDelegateGroups) {
                return d.requestBody.noDelegateGroups.length > 0;
            }
            return false;
        });
        
        if (noDelegationDepts.length > 0) {
            const confirm1 = confirm(
                '⚠️ ยืนยันการลางานโดยไม่มอบหมายงานแทน\n\n' +
                `แผนก: ${noDelegationDepts.map(d => d.department.department_name).join(', ')}\n\n` +
                '  •  ไม่มีการมอบหมายงานแทน\n' +
                '  •  อาจส่งผลกระทบต่อการดำเนินงาน\n' +
                '  •  ท่านยินดีรับผิดชอบต่อผลที่เกิดขึ้น\n\n' +
                'ดำเนินการต่อหรือไม่?'
            );
            
            if (!confirm1) return;
            
            const confirm2 = confirm(
                '📌 แจ้งเตือน\n\n' +
                '  •  ต้องรอการอนุมัติ\n' +
                '  •  อาจไม่ได้รับการอนุมัติ\n\n' +
                'ยืนยันการบันทึกหรือไม่?'
            );
            
            if (!confirm2) return;
        }

        try {
            // ========================================
            // GEN4 V3 Step 5: Multi-Department + Multi-Records
            // ========================================
            const groupId = selectedDepartments.length > 1 
                ? `grp_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`
                : null;
                
            let successCount = 0;
            let totalRecords = 0;

            for (const item of departmentData) {
                const dept = item.department;
                const requestBody = item.requestBody;
                
                // เช็คว่าเป็น custom delegation ที่มี delegateGroups/noDelegateGroups หรือไม่
                if (requestBody.delegationType === 'custom' && 
                    (requestBody.delegateGroups || requestBody.noDelegateGroups)) {
                    
                    // GEN4 V3 Step 5: แยกบันทึกเป็นหลาย records
                    const delegateGroups = requestBody.delegateGroups || [];
                    const noDelegateGroups = requestBody.noDelegateGroups || [];
                    
                    console.log(`=== แผนก ${dept.department_name}: ${delegateGroups.length} กลุ่มฝาก + ${noDelegateGroups.length} กลุ่มไม่ฝาก ===`);
                    
                    // 1. บันทึกแต่ละ delegate group
                    for (const group of delegateGroups) {
                        // สร้าง dutyAssignments สำหรับ group นี้
                        const groupDutyAssignments = [];
                        
                        for (const duty of group.duties) {
                            const select = document.querySelector(`.custom-delegation-select[data-unique-id="${duty.uniqueId}"]`);
                            const replacementDoctorId = select?.value;
                            
                            if (replacementDoctorId) {
                                groupDutyAssignments.push({
                                    dutyId: parseInt(duty.dutyId),
                                    dutyDate: duty.date,
                                    replacementDoctorId: parseInt(replacementDoctorId),
                                    splitLabel: duty.splitLabel || null  // GEN6
                                });
                            }
                        }
                        
                        const groupBody = {
                            doctorId: requestBody.doctorId,
                            startDate: group.startDate,
                            endDate: group.endDate,
                            delegationType: 'custom',
                            departmentId: requestBody.departmentId,
                            dutyAssignments: groupDutyAssignments,
                            groupId: groupId
                        };
                        
                        console.log(`  → บันทึก delegate group: ${group.startDate} - ${group.endDate}`);
                        console.log('    Body:', groupBody);
                        
                        const response = await fetch(`${LEAVE_API_URL}/api/leaves`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(groupBody)
                        });
                        
                        const data = await response.json();
                        console.log('    Response:', response.status, data);
                        
                        if (response.ok && data.success) {
                            successCount++;
                            totalRecords++;
                            console.log(`    ✅ สำเร็จ (Record ${totalRecords})`);
                        } else {
                            throw new Error(`แผนก ${dept.department_name} (ฝาก): ${data.message || 'ไม่สามารถบันทึกได้'}`);
                        }
                    }
                    
                    // 2. GEN4 V3 Step 5 Fix: บันทึกแต่ละ no-delegate group (รวมวันติดกัน)
                    for (const noDelGroup of noDelegateGroups) {
                        // รวบรวมเหตุผลจากทุกวันใน group
                        const reasons = [];
                        for (const duty of noDelGroup.duties) {
                            const textarea = document.getElementById(`noDelegationReason_${duty.uniqueId}`);
                            const reason = textarea?.value.trim() || '';
                            if (reason && !reasons.includes(reason)) {
                                reasons.push(reason);
                            }
                        }
                        
                        const combinedReason = reasons.join('; ');
                        
                        const noDelBody = {
                            doctorId: requestBody.doctorId,
                            startDate: noDelGroup.startDate,
                            endDate: noDelGroup.endDate,
                            delegationType: 'none',
                            departmentId: requestBody.departmentId,
                            hasReplacement: false,
                            noDelegationReason: combinedReason,
                            groupId: groupId
                        };
                        
                        console.log(`  → บันทึก no-delegate group: ${noDelGroup.startDate} - ${noDelGroup.endDate}`);
                        console.log('    Body:', noDelBody);
                        
                        const response = await fetch(`${LEAVE_API_URL}/api/leaves`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noDelBody)
                        });
                        
                        const data = await response.json();
                        console.log('    Response:', response.status, data);
                        
                        if (response.ok && data.success) {
                            successCount++;
                            totalRecords++;
                            console.log(`    ✅ สำเร็จ (Record ${totalRecords})`);
                        } else {
                            throw new Error(`แผนก ${dept.department_name} (ไม่ฝาก): ${data.message || 'ไม่สามารถบันทึกได้'}`);
                        }
                    }
                    
                } else {
                    // ไม่ใช่ custom delegation แบบใหม่ → บันทึกแบบเดิม (1 record)
                    const deptRequestBody = {
                        ...requestBody,
                        groupId: groupId
                    };

                    console.log(`=== บันทึกการลาแผนก: ${dept.department_name} ===`);
                    console.log('Body:', deptRequestBody);

                    const response = await fetch(`${LEAVE_API_URL}/api/leaves`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(deptRequestBody)
                    });

                    const data = await response.json();
                    console.log('Response:', response.status, data);
                    
                    if (data.success && data.data) {
                        console.log('📝 Created leave record:', {
                            id: data.data.id,
                            doctor_id: data.data.doctor_id,
                            department_id: data.data.department_id,
                            start_date: data.data.start_date,
                            end_date: data.data.end_date
                        });
                    }

                    if (response.ok && data.success) {
                        successCount++;
                        totalRecords++;
                        console.log(`✅ บันทึกแผนก ${dept.department_name} สำเร็จ`);
                    } else {
                        console.error(`❌ Error from server:`, data);
                        throw new Error(`แผนก ${dept.department_name}: ${data.message || 'ไม่สามารถบันทึกได้'}`);
                    }
                }
            }

            // สำเร็จทั้งหมด
            if (successCount > 0) {
                const message = totalRecords > 1
                    ? `✅ บันทึกการลาสำเร็จทั้งหมด ${totalRecords} records`
                    : '✅ บันทึกการลาสำเร็จ';
                
                showMessage(message, 'success');
                
                // ⭐ Phase 3: กลับเป็น Phase 1 - ซ่อนปุ่มบันทึก + แสดงแถบรายการลางานทั้งหมด
                document.querySelector('.btn-submit').style.display = 'none';
                
                // รีเซ็ตสถานะ
                selectedDates = [];
                selectionStep = 0;
                startDate = null;
                endDate = null;
                currentDutyData = [];
                dutySplitStates = {}; // GEN6: reset split states หลัง submit
                splitSelfOnDutyStates = {}; // GEN7: reset self-duty states หลัง submit
                dutyDelegationStates = {};
                document.getElementById('departmentDetailsContainer').innerHTML = '';
                
                // แสดงแถบรายการลางานทั้งหมดกลับมา
                const topLeaveRecords = document.getElementById('leaveRecords');
                if (topLeaveRecords) topLeaveRecords.style.display = 'block'; // แถบหลัก
                document.querySelectorAll('.dept-leave-records').forEach(el => {
                    el.style.display = 'block'; // แถบในแผนก
                });
                
                document.getElementById('confirmDatesBtn').style.display = 'none';
                loadDoctorLeaves();
                updateSelectedRange();
                renderCalendar();
            }
        } catch (error) {
            showMessage('❌ ' + error.message, 'error');
        }
    }

    // แสดงข้อความ
    function showMessage(text, type) {
        const msg = document.getElementById('message');
        msg.textContent = text;
        msg.className = `message ${type} show`;
        setTimeout(() => msg.classList.remove('show'), 5000);
    }

    // Highlight วันที่ลาในปฏิทิน (toggle on/off)
    function highlightLeaveDates(startDate, endDate, containerId = 'leaveRecords') {
        console.log('🔍 highlightLeaveDates called:');
        console.log('  - startDate:', startDate);
        console.log('  - endDate:', endDate);
        console.log('  - containerId:', containerId);
        
        // สร้าง array วันที่
        const start = new Date(startDate);
        const end = new Date(endDate);
        const dates = [];
        
        for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
            dates.push(formatDate(d));
        }

        // ⭐ เพิ่ม: เปลี่ยนปฏิทินไปเดือนที่เริ่มลา
        const startMonth = start.getMonth(); // 0-11
        const startYear = start.getFullYear();
        console.log(`  📅 Changing calendar to: ${startMonth + 1}/${startYear}`);
        
        currentMonth = startMonth;
        currentYear = startYear;
        renderCalendar();
        
        // รอ Render เสร็จ (50ms) แล้วค่อย Highlight
        setTimeout(() => {
            performHighlight(dates, containerId);
        }, 50);
    }
    
    function performHighlight(dates, containerId) {
        // ฟังก์ชันช่วยทำ Highlight หลังจาก Render เสร็จ

        // หา calendar ที่ถูกต้อง
        let targetCalendar;
        let targetScrollElement;
        
        if (containerId.startsWith('leaveRecords-')) {
            // ปฏิทิน 2/3: หา department calendar
            const deptId = containerId.replace('leaveRecords-', '');
            targetCalendar = document.getElementById(`dept-calendar-${deptId}`);
            
            // เช็คว่าปฏิทินนี้แสดงอยู่หรือไม่ (ปฏิทิน 2 อาจถูกซ่อน)
            if (targetCalendar && window.getComputedStyle(targetCalendar.parentElement).display === 'none') {
                // ปฏิทิน 2 (แผนกหลัก) ถูกซ่อน → ใช้ปฏิทิน 1 แทน
                console.log(`  📍 dept-calendar-${deptId} is hidden, using Calendar 1 instead`);
                targetCalendar = document.getElementById('calendar');
                targetScrollElement = targetCalendar;
            } else {
                // ปฏิทิน 3 (แผนกเสริม) แสดงอยู่
                const leaveContainer = document.getElementById(containerId);
                if (leaveContainer) {
                    targetScrollElement = leaveContainer.closest('.department-section');
                }
                console.log(`  📍 Target: Calendar 3 (dept-calendar-${deptId})`);
            }
        } else {
            // ปฏิทิน 1
            targetCalendar = document.getElementById('calendar');
            targetScrollElement = targetCalendar;
            console.log('  📍 Target: Calendar 1 (main calendar)');
        }
        
        if (!targetCalendar) {
            console.log('  ❌ Target calendar not found');
            return;
        }

        // เช็คว่ามี highlight อยู่แล้วหรือไม่ (ในปฏิทินนั้นๆ)
        let hasHighlight = false;
        dates.forEach(dateStr => {
            const dayElements = targetCalendar.querySelectorAll('.calendar-day');
            dayElements.forEach(el => {
                const dateAttribute = el.getAttribute('data-date');
                if (dateAttribute === dateStr && el.classList.contains('highlight')) {
                    hasHighlight = true;
                }
            });
        });

        if (hasHighlight) {
            // ถ้ามี highlight อยู่แล้ว → ลบออก (toggle off)
            dates.forEach(dateStr => {
                const dayElements = targetCalendar.querySelectorAll('.calendar-day');
                dayElements.forEach(el => {
                    const dateAttribute = el.getAttribute('data-date');
                    if (dateAttribute === dateStr) {
                        el.classList.remove('highlight');
                    }
                });
            });
        } else {
            // ถ้ายังไม่มี → เพิ่ม highlight (toggle on)
            // ลบ highlight เก่าทั้งหมดก่อน (จากทุกปฏิทิน)
            document.querySelectorAll('.calendar-day.highlight').forEach(el => {
                el.classList.remove('highlight');
            });

            // เพิ่ม highlight ใหม่ (เฉพาะปฏิทินนั้นๆ)
            dates.forEach(dateStr => {
                const dayElements = targetCalendar.querySelectorAll('.calendar-day');
                dayElements.forEach(el => {
                    const dateAttribute = el.getAttribute('data-date');
                    if (dateAttribute === dateStr) {
                        el.classList.add('highlight');
                    }
                });
            });
            
            // === เพิ่ม: กรอบสีฟ้า 3 วินาที (เฉพาะปฏิทินนั้นๆ) ===
            dates.forEach(dateStr => {
                const dayCell = targetCalendar.querySelector(`.calendar-day[data-date="${dateStr}"]`);
                if (dayCell) {
                    dayCell.style.outline = '4px solid #2196F3';
                    dayCell.style.outlineOffset = '-4px';
                    dayCell.style.boxShadow = '0 0 0 4px rgba(33, 150, 243, 0.3)';
                    dayCell.style.position = 'relative';
                    dayCell.style.zIndex = '100';
                    console.log(`  ✅ Added blue border to ${dateStr}`);
                }
            });
            
            // Scroll ไปที่ปฏิทินที่ถูกต้อง
            if (targetScrollElement) {
                targetScrollElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                console.log('  ✅ Scrolled to target');
            }
            
            // ลบกรอบสีฟ้าหลัง 3 วินาที (แต่ยังเก็บ class highlight)
            setTimeout(() => {
                console.log('🧹 Removing blue borders');
                document.querySelectorAll('.calendar-day[data-date]').forEach(cell => {
                    cell.style.outline = '';
                    cell.style.outlineOffset = '';
                    cell.style.boxShadow = '';
                    cell.style.position = '';
                    cell.style.zIndex = '';
                });
            }, 3000);
        }
    }

    function getSelectedDepartments() {

        // ถ้ามีหลายแผนก → อ่านจาก Checkbox
        const checkboxes = document.querySelectorAll('#departmentCheckboxes input[type="checkbox"]:checked');
        const result = Array.from(checkboxes).map(cb => {

    // โหลด Duties ของแผนก
    async function loadDutiesForDepartment(departmentId) {
        if (!selectedDates || selectedDates.length === 0) {
            return [];
        }

        try {
            const doctorId = sessionStorage.getItem('doctor_id');
            const response = await fetch(`${API_URL}/api/doctor-duties/doctor/${doctorId}`);
            const data = await response.json();
            
            if (response.ok && data.success) {
                // Filter เฉพาะ Duties ของแผนกนี้
                const allDuties = data.data.filter(d => d.department_id == departmentId);
                
                // จับคู่กับวันที่เลือก
                const result = [];
                selectedDates.forEach(date => {
                    const dayName = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'][new Date(date).getDay()];
                    const dutiesOnThisDay = allDuties.filter(duty => (duty.day_of_week ? duty.day_of_week === dayName : duty[dayName] === 1));
                    
                    result.push({
                        date: date,
                        duties: dutiesOnThisDay
                    });
                });
                
                return result;
            }
        } catch (error) {
            console.error('Load duties error:', error);
        }
        
        return [];
    }

    // GEN4 V3 Step 2: ฟังก์ชัน Toggle ระหว่าง ฝาก/ไม่ฝาก
    // GEN6: Toggle Split Mode สำหรับ custom delegation
    window.toggleDutySplit = function(uniqueId, dutyId, date, deptId) {
        const splitBtn = document.getElementById(`btn-split-${uniqueId}`);
        const delegateBtn = document.querySelector(`.btn-delegate[data-unique-id="${uniqueId}"]`);
        const noDelegateBtn = document.querySelector(`.btn-no-delegate[data-unique-id="${uniqueId}"]`);
        const content = document.getElementById(`delegationContent_${uniqueId}`);

        if (dutySplitStates[uniqueId]) {
            // === ยกเลิก split → กลับปกติ ===
            delete dutySplitStates[uniqueId];
            splitBtn.style.background = 'white';
            splitBtn.style.color = '#ff9800';
            // แสดงปุ่ม ฝาก/ไม่ฝาก กลับมา
            if (delegateBtn) { delegateBtn.style.display = ''; }
            if (noDelegateBtn) { noDelegateBtn.style.display = ''; }
            // reset state
            dutyDelegationStates[uniqueId] = 'delegate';
            // render content ปกติ
            content.innerHTML = renderNormalDelegationContent(uniqueId, deptId);
            loadDoctorsForCustomDuty(uniqueId, deptId);
        } else {
            // === เข้า split mode → แสดง time picker ===
            splitBtn.style.background = '#ff9800';
            splitBtn.style.color = 'white';
            // ซ่อนปุ่ม ฝาก/ไม่ฝาก
            if (delegateBtn) { delegateBtn.style.display = 'none'; }
            if (noDelegateBtn) { noDelegateBtn.style.display = 'none'; }
            // แสดง time picker ก่อน
            content.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px; padding:10px; background:#fff3e0; border-radius:8px; border:1px solid #ff9800;">
                    <span style="font-weight:600; color:#e65100;">✂️ แบ่งเวรที่เวลา:</span>
                    <input type="time" id="splitTime_${uniqueId}" value="13:00"
                        style="padding:6px; border:1px solid #ff9800; border-radius:6px; font-size:14px; color:#333;">
                    <button type="button" onclick="applySplitTime('${uniqueId}', ${dutyId}, '${date}', ${deptId})"
                        style="padding:6px 14px; background:#ff9800; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:600;">
                        ยืนยัน
                    </button>
                </div>`;
        }
    };

    window.toggleSelfOnDuty = function(thisUid, siblingUid) {
        const alreadyActive = splitSelfOnDutyStates[thisUid];

        if (alreadyActive) {
            // === ยกเลิก self-duty → คืน delegate area ===
            delete splitSelfOnDutyStates[thisUid];
            const btn = document.getElementById(`btn-self-${thisUid}`);

                btn.style.color = '#43a047';
                btn.style.borderColor = '#43a047';

            const area = document.getElementById(`delegateArea_${thisUid}`);
            if (area) area.style.display = '';
        } else {
            // === ตรวจสอบ: sibling ถูกกดอยู่แล้วหรือไม่ ===
            if (splitSelfOnDutyStates[siblingUid]) {

    // โหลดแพทย์สำหรับแต่ละ Duty (Custom Delegation)
    window.loadDoctorsForCustomDuty = async function(uniqueId, defaultDeptId) {
        const filterDeptSelect = document.getElementById(`customFilterDept_${uniqueId}`);
        const doctorSelect = document.querySelector(`.custom-delegation-select[data-unique-id="${uniqueId}"]`);
        
        if (!filterDeptSelect || !doctorSelect) return;

        // ประกาศตัวแปรหลักก่อน
        const currentDoctorId = sessionStorage.getItem('doctor_id');
        const workType = 'full'; // GEN6: user.html เฉพาะ full time
        const dutyDate = doctorSelect.getAttribute('data-date');
        const dutyId = doctorSelect.getAttribute('data-duty-id');

        // โหลด Departments ที่มีแพทย์รับฝากได้เท่านั้น
        if (filterDeptSelect.options.length === 1) {
            try {
                const dayNames = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
                const availableDeptIds = new Set();
                availableDeptIds.add(defaultDeptId);

                if (dutyId && dutyDate) {
                    const dayName = dayNames[new Date(dutyDate).getDay()];
                    const res = await fetch(
                        `${API_URL}/api/available-replacements?dutyId=${dutyId}&departmentId=${defaultDeptId}&mode=dept&dayOfWeek=${dayName}&doctorId=${currentDoctorId}`
                    );
                    const data = await res.json();
                    if (data.success) {
                        data.available.forEach(d => {
                            if (d.department_id) availableDeptIds.add(d.department_id);
                        });
                    }
                }

                const response = await fetch(`${API_URL}/api/departments`);
                const data = await response.json();
                if (response.ok && data.success) {
                    data.data
                        .filter(dept => availableDeptIds.has(dept.id))
                        .forEach(dept => {
                            const option = document.createElement('option');
                            option.value = dept.id;
                            option.textContent = dept.name;
                            if (dept.id === defaultDeptId) option.selected = true;
                            filterDeptSelect.appendChild(option);
                        });
                }
            } catch (error) {
                console.error('Load departments error:', error);
            }
        }

        const selectedDeptId = parseInt(filterDeptSelect.value) || defaultDeptId;
        if (!currentDoctorId || !dutyDate) return;

        doctorSelect.innerHTML = '<option value="">กำลังโหลด...</option>';

        try {
            const dayNames = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
            const dayName = dayNames[new Date(dutyDate).getDay()];
            let availableDoctors = [];

            if (dutyId) {
                const res = await fetch(
                    `${API_URL}/api/available-replacements?dutyId=${dutyId}&departmentId=${selectedDeptId}&leaveDepartmentId=${defaultDeptId}&dayOfWeek=${dayName}&dutyDate=${dutyDate}&doctorId=${currentDoctorId}`
                );
                const data = await res.json();
                if (data.success) {
                    availableDoctors = data.available;
                }
            }

            if (workType === 'full') {
                availableDoctors = availableDoctors.filter(d => d.work_type === 'full');
            } else if (workType === 'part') {
                availableDoctors = availableDoctors.filter(d => d.work_type === 'part');
            }

            // กรองคนที่ลาอยู่แล้ว
            availableDoctors = availableDoctors.filter(doc => {
                return !doctorLeaves.some(leave =>
                    leave.doctor_id === doc.id &&
                    dutyDate >= leave.start_date && dutyDate <= leave.end_date
                );
            });

            availableDoctors.sort((a, b) => a.name.localeCompare(b.name, ['en', 'th']));

            doctorSelect.innerHTML = '<option value="">-- เลือกแพทย์ที่จะมาแทน --</option>';
            availableDoctors.forEach(doc => {
                const option = document.createElement('option');
                option.value = doc.id;
                option.textContent = doc.name;
                doctorSelect.appendChild(option);
            });

            if (availableDoctors.length === 0) {
                doctorSelect.innerHTML = '<option value="">-- ไม่มีแพทย์ว่าง --</option>';
            }
        } catch (error) {
            console.error('loadDoctorsForCustomDuty error:', error);
            doctorSelect.innerHTML = '<option value="">-- เกิดข้อผิดพลาด --</option>';
        }
    }

        if (!filterDeptSelect || !replacementSelect) return;

        const workType = 'full'; // GEN6: user.html เฉพาะ full time

        if (filterDeptSelect.options.length === 1) {
            try {
                const dayNames = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
                const dutiesRes = await fetch(`${API_URL}/api/doctor-duties/doctor/${currentDoctorId}`);
                const dutiesData = await dutiesRes.json();

                    ? dutiesData.data.filter(d => d.department_id == deptId)
                    : [];

                const availableDeptIds = new Set();
                availableDeptIds.add(deptId);

                for (const date of selectedDates) {
                    const dayName = dayNames[new Date(date).getDay()];
                    const dutiesOnThisDay = leaveDoctorDuties.filter(d => (d.day_of_week ? d.day_of_week === dayName : d[dayName] === 1));
                    for (const duty of dutiesOnThisDay) {
                        const res = await fetch(
                            `${API_URL}/api/available-replacements?dutyId=${duty.duty_id}&departmentId=${deptId}&mode=dept&dayOfWeek=${dayName}&doctorId=${currentDoctorId}`
                        );
                        const data = await res.json();
                        if (data.success) {
                            data.available.forEach(d => {
                                if (d.department_id) availableDeptIds.add(d.department_id);
                            });
                        }
                    }
                }

                const response = await fetch(`${API_URL}/api/departments`);
                const data = await response.json();
                if (response.ok && data.success) {
                    data.data
                        .filter(dept => availableDeptIds.has(dept.id))
                        .forEach(dept => {
                            const option = document.createElement('option');
                            option.value = dept.id;
                            option.textContent = dept.name;
                            if (dept.id === deptId) option.selected = true;
                            filterDeptSelect.appendChild(option);
                        });
                }
            } catch (error) {
                console.error('Load departments error:', error);
            }
        }

        const selectedDeptId = parseInt(filterDeptSelect.value) || deptId;

        if (!currentDoctorId || !selectedDates || selectedDates.length === 0) {
            replacementSelect.innerHTML = '<option value="">-- เลือกแพทย์ที่จะมาแทน --</option>';
            return;
        }

        replacementSelect.innerHTML = '<option value="">กำลังโหลด...</option>';

        try {
            const dayNames = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
            const unavailableDoctorIds = new Set();
            const availableDoctorMap = new Map();

            const dutiesRes = await fetch(`${API_URL}/api/doctor-duties/doctor/${currentDoctorId}`);
            const dutiesData = await dutiesRes.json();
            const leaveDoctorDuties = dutiesData.success
                ? dutiesData.data.filter(d => d.department_id == deptId)
                : [];

            for (const date of selectedDates) {
                const dayName = dayNames[new Date(date).getDay()];
                const dutiesOnThisDay = leaveDoctorDuties.filter(d => (d.day_of_week ? d.day_of_week === dayName : d[dayName] === 1));
                for (const duty of dutiesOnThisDay) {
                    const res = await fetch(
                        `${API_URL}/api/available-replacements?dutyId=${duty.duty_id}&departmentId=${selectedDeptId}&leaveDepartmentId=${deptId}&dayOfWeek=${dayName}&dutyDate=${date}&doctorId=${currentDoctorId}`
                    );
                    const data = await res.json();
                    if (data.success) {
                        data.unavailable.forEach(d => unavailableDoctorIds.add(d.id));
                        data.available.forEach(d => availableDoctorMap.set(d.id, d));
                    }
                }
            }

            let availableDoctors = [...availableDoctorMap.values()]
                .filter(d => !unavailableDoctorIds.has(d.id));

            if (workType === 'full') {
                availableDoctors = availableDoctors.filter(d => d.work_type === 'full');
            } else if (workType === 'part') {
                availableDoctors = availableDoctors.filter(d => d.work_type === 'part');
            }

            availableDoctors = availableDoctors.filter(doc => {
                for (const date of selectedDates) {
                    const isOnLeave = doctorLeaves.some(leave =>
                        leave.doctor_id === doc.id &&
                        date >= leave.start_date && date <= leave.end_date
                    );
                    if (isOnLeave) return false;
                }
                return true;
            });

            availableDoctors.sort((a, b) => a.name.localeCompare(b.name, ['en', 'th']));

            replacementSelect.innerHTML = '<option value="">-- เลือกแพทย์ที่จะมาแทน --</option>';
            availableDoctors.forEach(doc => {
                const option = document.createElement('option');
                option.value = doc.id;
                option.textContent = doc.name;
                replacementSelect.appendChild(option);
            });

            if (availableDoctors.length === 0) {
                replacementSelect.innerHTML = '<option value="">-- ไม่มีแพทย์ว่างในช่วงนี้ --</option>';
            }

            // โหลด custom delegation selects ด้วย
            const customSelects = document.querySelectorAll(`.custom-delegation-select[data-dept-id="${deptId}"]`);
            customSelects.forEach(select => {
                select.innerHTML = '<option value="">-- เลือกแพทย์ที่จะมาแทน --</option>';
                availableDoctors.forEach(doc => {
                    const option = document.createElement('option');
                    option.value = doc.id;
                    option.textContent = doc.name;
                    select.appendChild(option);
                });
            });

        } catch (error) {
            console.error('loadReplacementDoctorsForDept error:', error);
            replacementSelect.innerHTML = '<option value="">-- เกิดข้อผิดพลาด --</option>';
        }
    }

    // ดึงชื่อ (ไม่เอานามสกุล)
    function getFirstName(fullName) {
        if (!fullName) return '';
        const parts = fullName.trim().split(/\s+/);
        if (parts.length < 2) return fullName;
        return parts.slice(0, -1).join(' ');
    }

    // ดึงตัวอักษรแรกของนามสกุล
    function getLastNameInitial(fullName) {
        if (!fullName) return '?';
        const parts = fullName.trim().split(/\s+/);
        if (parts.length < 2) return '?';
        const lastName = parts[parts.length - 1];
        
        const thaiVowels = ['เ', 'แ', 'โ', 'ใ', 'ไ', 'ำ', 'ั', 'า', 'ิ', 'ี', 'ึ', 'ื', 'ุ', 'ู', '็', '่', '้', '๊', '๋', '์', 'ํ', 'ๅ'];
        
        for (let i = 0; i < lastName.length; i++) {
            const char = lastName.charAt(i);
            if (!thaiVowels.includes(char)) {
                return char;
            }
        }
        
        return lastName.charAt(0);
    }

        const startDayOfWeek = firstDay.getDay();
        const daysInMonth = lastDay.getDate();
        
        const dayHeaders = ['จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส', 'อา'];
        
        let html = '';
        dayHeaders.forEach(day => {
            html += `<div class="calendar-day-header">${day}</div>`;
        });
        
        // วันว่าง
        const startDay = startDayOfWeek === 0 ? 6 : startDayOfWeek - 1;
        for (let i = 0; i < startDay; i++) {
            html += '<div class="calendar-day empty"></div>';
        }
        
        // ฟังก์ชันคำนวณสี (แสดงการลาทุกคน + cursor สีฟ้า)
        const calculateColorClass = (dateStr, isSelected) => {
            const leaveTypes = {
                green: 0,
                yellow: 0,
                approved: 0,
                rejected: 0,
            };
            
            allDeptLeaves.forEach(leave => {
                if (dateStr >= leave.start_date && dateStr <= leave.end_date) {
                    // เช็คจาก delegation_type ก่อน (ไม่ใช่จากสี)
                    if (leave.delegation_type === 'none') {
                        // ต้องอนุมัติ → เช็คสถานะ
                        if (leave.approval_status === 'approved') {
                            leaveTypes.approved++;
                        } else if (leave.approval_status === 'rejected') {
                            leaveTypes.rejected++;
                        } else {
                            // รออนุมัติ
                            leaveTypes.yellow++;
                        }
                    } else if (leave.delegation_type === 'single' || leave.delegation_type === 'custom') {
                        // ไม่ต้องอนุมัติ
                        leaveTypes.green++;
                    }
                }
            });
            
            // *** Step 5: ถ้าวันนี้ถูกเลือกในปฏิทินหลัก → นับเป็น +1 ***
            if (isSelected) {
                leaveTypes.green++;
            }
            
            // อนุมัติแล้ว → สีดำ
            if (leaveTypes.approved > 0) {
                return 'approved';
            }
            
            const totalLeaves = leaveTypes.green + leaveTypes.yellow + leaveTypes.rejected;
            
            if (totalLeaves === 0) {
                return null;
            }
            
            // ถ้าเลือกอย่างเดียว (ไม่มีคนลา) → สีฟ้า
            if (isSelected && totalLeaves === 1 && leaveTypes.green === 1) {
                return 'selected';
            }
            
            // สีแดง: เขียว >= 2
            if (leaveTypes.green >= 2) {
                return isSelected ? 'overlap selected' : 'overlap';
            }
            // สีส้ม: เขียว + เหลือง
            else if ((leaveTypes.green >= 1 && leaveTypes.yellow >= 1) || (leaveTypes.yellow >= 2)) {
                return isSelected ? 'overlap-no-delegation selected' : 'overlap-no-delegation';
            }
            // สีเขียว/เขียวอ่อน: มีแค่ 1 คน
            else if (leaveTypes.green === 1 && leaveTypes.yellow === 0) {
                // หาคนที่ลาในวันนี้
                if (!isSelected && allDeptLeaves.length > 0) {
                    const leavesOnThisDay = allDeptLeaves.filter(leave => 
                        dateStr >= leave.start_date && 
                        dateStr <= leave.end_date &&
                        (leave.delegation_type === 'single' || leave.delegation_type === 'custom')
                    );
                    
                    if (leavesOnThisDay.length === 1) {
                        const leave = leavesOnThisDay[0];
                        const leaveDoctorId = leave.doctor_id;
                        let hasDutyOnThisDay = false;
                        
                        if (leave.delegation_type === 'custom') {
                            if (leave.duty_assignments && leave.duty_assignments.length > 0) {
                                hasDutyOnThisDay = leave.duty_assignments.some(
                                    assignment => assignment.duty_date === dateStr
                                );
                            }
                        } else if (leave.delegation_type === 'single') {
                            const checkDate = new Date(dateStr);
                            const dayOfWeek = checkDate.getDay();
                            const dayNames = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
                            const dayName = dayNames[dayOfWeek];
                            
                            // เช็ค Duty ของแผนกนี้
                            const deptDuties = window.allDepartmentDuties?.[departmentId];
                            
                            if (deptDuties && deptDuties.length > 0) {
                                hasDutyOnThisDay = deptDuties.some(dd => 
                                    dd.doctor_id === leaveDoctorId && (dd.day_of_week ? dd.day_of_week === dayName : dd[dayName] === 1)
                                );
                            } else {
                                hasDutyOnThisDay = true;
                            }
                        }
                        
                        if (!hasDutyOnThisDay) {
                            return 'on-leave-no-duty'; // สีเขียวอ่อน
                        }
                    }
                }
                
                return isSelected ? 'on-leave selected' : 'on-leave';
            }
            // สีเหลือง (none - ต้องอนุมัติ)
            else if (leaveTypes.yellow === 1 && leaveTypes.green === 0) {
                // ถ้าไม่อนุมัติ → ไม่มีสี + กรอบดำ
                if (leaveTypes.rejected > 0) {
                    return 'rejected'; // เฉพาะกรอบดำ ไม่มีสีพื้น
                }
                // รออนุมัติ → สีเหลือง
                return isSelected ? 'no-delegation selected' : 'no-delegation';
            }
            // ถ้ามีแต่ rejected (ไม่มี green, yellow)
            else if (leaveTypes.rejected > 0) {
                return 'rejected'; // เฉพาะกรอบดำ
            }
            else {
                return 'on-leave';
            }
        };
        
        // วันในเดือน
        const today = new Date();
        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(useYear, useMonth, day);
            const dateStr = formatDate(date);
            const dayOfWeek = date.getDay();
            
            // *** Step 5: เช็คว่าวันนี้ถูกเลือกในปฏิทินหลักหรือไม่ ***
            const isSelected = selectedDates && selectedDates.includes(dateStr);
            
            let classes = ['calendar-day'];
            
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                classes.push('weekend');
            }
            
            if (date.toDateString() === today.toDateString()) {
                classes.push('today');
            }
            
            if (date < today && date.toDateString() !== today.toDateString()) {
                classes.push('past-date');
            }
            
            const colorClass = calculateColorClass(dateStr, isSelected);
            
            if (colorClass) {
                const colorClasses = colorClass.split(' ');
                classes.push(...colorClasses);
            }
            
            html += `<div class="${classes.join(' ')}" data-date="${dateStr}">${day}</div>`;
        }
        
        calendar.innerHTML = html;
    }
</script>
