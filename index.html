</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🏥 ระบบลางานแพทย์</h1>
            <p>กรุณาเข้าสู่ระบบเพื่อดำเนินการต่อ</p>
        </div>

```
    <div id="errorMessage" class="error-message"></div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">ชื่อผู้ใช้</label>
            <input type="text" id="username" name="username" required autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">รหัสผ่าน</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
        <button type="button" class="btn btn-secondary" onclick="window.location.href='register.html'">ลงทะเบียน</button>
        <button type="button" class="btn btn-secondary">ลืมรหัสผ่าน</button>
        <button type="button" class="btn btn-secondary">เปลี่ยนรหัสผ่าน</button>
    </form>
</div>

<script>
    // ข้อมูลผู้ใช้ (ชั่วคราว - อนาคตจะย้ายไป Cloudflare)
    const users = {
        'dev': {
            password: '1234',
            role: 'developer',
            redirect: 'dev.html'
        },
        'user': {
            password: '1234',
            role: 'user',
            redirect: 'user.html'
        }
    };

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorMessage = document.getElementById('errorMessage');

        // ตรวจสอบผู้ใช้
        if (users[username] && users[username].password === password) {
            // Login สำเร็จ
            errorMessage.classList.remove('show');
            
            // เก็บข้อมูล session (ชั่วคราว)
            sessionStorage.setItem('loggedIn', 'true');
            sessionStorage.setItem('username', username);
            sessionStorage.setItem('role', users[username].role);
            
            // Redirect ไปหน้าที่เหมาะสม
            window.location.href = users[username].redirect;
        } else {
            // Login ไม่สำเร็จ
            errorMessage.textContent = '❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
            errorMessage.classList.add('show');
            
            // Clear password field
            document.getElementById('password').value = '';
        }
    });
</script>
