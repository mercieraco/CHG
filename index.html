```
    <div id="errorMessage" class="error-message"></div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">ชื่อผู้ใช้</label>
            <input type="text" id="username" name="username" required autocomplete="username" placeholder="Username">
        </div>

        <div class="form-group">
            <label for="password">รหัสผ่าน</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Password">
        </div>

        <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
        <button type="button" class="btn btn-secondary" onclick="window.location.href='register.html'">ลงทะเบียน</button>
        <button type="button" class="btn btn-secondary" onclick="window.location.href='reset_password.html'">ลืมรหัสผ่าน</button>
        <button type="button" class="btn btn-secondary" onclick="window.location.href='change_password.html'">เปลี่ยนรหัสผ่าน</button>
    </form>
</div>

<script>
    // User พิเศษ (Hardcoded)
    const SPECIAL_USER = {
        username: 'User',
        password: 'ch3',
        role: 'guest',  // เปลี่ยนจาก 'user' เป็น 'guest'
        name: 'ผู้ใช้ทั่วไป'
    };

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorMessage = document.getElementById('errorMessage');

        try {
            // 1. เช็ค User พิเศษก่อน
            if (username === SPECIAL_USER.username && password === SPECIAL_USER.password) {
                // Login สำเร็จ - User พิเศษ
                errorMessage.classList.remove('show');
                
                sessionStorage.setItem('loggedIn', 'true');
                sessionStorage.setItem('username', SPECIAL_USER.name);
                sessionStorage.setItem('role', SPECIAL_USER.role);
                
                // ไปหน้าสรุปภาพรวม
                window.location.href = 'summary.html';
                return;
            }

            // 2. เช็คจาก API (แพทย์ + Admin)
            const response = await fetch('https://doc-leave-api.9vk92zm5z2.workers.dev/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    licenseNumber: username,
                    password: password
                })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                // Login สำเร็จ - แพทย์/Admin
                errorMessage.classList.remove('show');
                
                // เก็บข้อมูล session
                sessionStorage.setItem('loggedIn', 'true');
                sessionStorage.setItem('username', data.data.licenseNumber);
                sessionStorage.setItem('license_number', data.data.licenseNumber);
                sessionStorage.setItem('role', data.data.role);
                
                // Redirect ตาม role
                if (data.data.role === 'admin') {
                    window.location.href = 'dev.html';
                } else {
                    // สำหรับ user: เช็คว่ามี เลข ว หลัง หรือไม่
                    checkDoctorData(data.data.licenseNumber);
                }
            } else {
                // Login ไม่สำเร็จ
                errorMessage.textContent = '❌ ' + (data.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
                errorMessage.classList.add('show');
                document.getElementById('password').value = '';
            }
        } catch (error) {
            console.error('Login error:', error);
            errorMessage.textContent = '❌ เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
            errorMessage.classList.add('show');
            document.getElementById('password').value = '';
        }
    });

    // ฟังก์ชันเช็ค เลข ว หลัง
    async function checkDoctorData(licenseNumber) {
        try {
            console.log('🔍 Looking for doctor with license:', licenseNumber);
            
            // ดึงข้อมูลแพทย์ทั้งหมด
            const response = await fetch(`https://depdocdoc.9vk92zm5z2.workers.dev/api/doctors`);
            const data = await response.json();
            
            if (response.ok && data.success) {
                // หาแพทย์จาก license_number
                const doctor = data.data.find(d => d.license_number === licenseNumber);
                
                if (doctor) {
                    // บันทึก doctor_id และข้อมูลอื่นๆ
                    sessionStorage.setItem('doctor_id', doctor.id.toString());
                    sessionStorage.setItem('doctor_name', doctor.name);
                    sessionStorage.setItem('department_id', doctor.department_id.toString());
                    
                    // ⭐ เปลี่ยน role เป็น 'doctor' (แทน 'user')
                    sessionStorage.setItem('role', 'doctor');
                    
                    console.log('✅ Doctor found:', {
                        id: doctor.id,
                        name: doctor.name,
                        license: doctor.license_number
                    });
                    
                    // ไป user.html
                    window.location.href = 'user.html';
                } else {
                    // ไม่พบแพทย์ → ไป wait.html
                    console.log('❌ Doctor not found for license:', licenseNumber);
                    window.location.href = 'wait.html';
                }
            } else {
                // เกิด error → ไป wait.html
                console.error('API error:', data);
                window.location.href = 'wait.html';
            }
        } catch (error) {
            console.error('Check doctor error:', error);
            // เกิด error → ไป wait.html
            window.location.href = 'wait.html';
        }
    }
</script>
