<script>
    // ข้อมูลระบบ
    let departments = [];
    let doctors = [];
    let leaves = [];
    let currentDepartmentId = null;
    let currentCalendarMonth = new Date().getMonth();
    let currentCalendarYear = new Date().getFullYear();
    
    // โหลดข้อมูล
    function loadData() {
        const savedDepartments = localStorage.getItem('hospital_departments');
        const savedDoctors = localStorage.getItem('hospital_doctors');
        const savedLeaves = localStorage.getItem('hospital_leaves');
        
        if (savedDepartments) departments = JSON.parse(savedDepartments);
        if (savedDoctors) doctors = JSON.parse(savedDoctors);
        if (savedLeaves) leaves = JSON.parse(savedLeaves);
        
        renderAll();
    }
    
    function saveData() {
        localStorage.setItem('hospital_departments', JSON.stringify(departments));
        localStorage.setItem('hospital_doctors', JSON.stringify(doctors));
        localStorage.setItem('hospital_leaves', JSON.stringify(leaves));
    }
    
    function renderAll() {
        renderDepartments();
        renderDoctors();
        renderOverview();
        updateDoctorDepartmentSelect();
        updateFilterDepartmentSelect();
        updateLeaveDoctorSelect();
        renderCalendar();
        renderLeaveList();
    }
    
    function showAlert(message, type = 'success') {
        const alertBox = document.getElementById('alertBox');
        alertBox.className = `alert alert-${type}`;
        alertBox.textContent = message;
        alertBox.style.display = 'block';
        setTimeout(() => alertBox.style.display = 'none', 3000);
    }
    
    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + tabName).classList.add('active');
        event.target.classList.add('active');
        
        if (tabName === 'overview') renderOverview();
        if (tabName === 'leave') {
            renderCalendar();
            renderLeaveList();
        }
    }
    
    // ===== จัดการแผนก =====
    
    function addDepartment() {
        const name = document.getElementById('newDepartmentName').value.trim();
        if (!name) {
            showAlert('กรุณากรอกชื่อแผนก', 'info');
            return;
        }
        
        if (departments.find(d => d.name === name)) {
            showAlert('มีแผนกนี้อยู่แล้ว', 'info');
            return;
        }
        
        departments.push({
            id: Date.now(),
            name: name,
            duties: []
        });
        
        saveData();
        renderAll();
        document.getElementById('newDepartmentName').value = '';
        showAlert(`เพิ่มแผนก "${name}" สำเร็จ`);
    }
    
    function deleteDepartment(id) {
        if (!confirm('ต้องการลบแผนกนี้ใช่หรือไม่?')) return;
        departments = departments.filter(d => d.id !== id);
        doctors = doctors.filter(doc => doc.departmentId !== id);
        saveData();
        renderAll();
        showAlert('ลบแผนกสำเร็จ');
    }
    
    function openDutyModal(departmentId) {
        currentDepartmentId = departmentId;
        document.getElementById('dutyModal').classList.add('active');
        document.getElementById('modalDutyName').value = '';
        ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'].forEach(day => {
            document.getElementById(day).value = '0';
        });
    }
    
    function closeDutyModal() {
        document.getElementById('dutyModal').classList.remove('active');
        currentDepartmentId = null;
    }
    
    function saveDuty() {
        const name = document.getElementById('modalDutyName').value.trim();
        if (!name) {
            showAlert('กรุณากรอกชื่อภาระงาน', 'info');
            return;
        }
        
        const dept = departments.find(d => d.id === currentDepartmentId);
        if (!dept) return;
        
        const weeklyMin = {
            mon: parseInt(document.getElementById('mon').value) || 0,
            tue: parseInt(document.getElementById('tue').value) || 0,
            wed: parseInt(document.getElementById('wed').value) || 0,
            thu: parseInt(document.getElementById('thu').value) || 0,
            fri: parseInt(document.getElementById('fri').value) || 0,
            sat: parseInt(document.getElementById('sat').value) || 0,
            sun: parseInt(document.getElementById('sun').value) || 0
        };
        
        dept.duties.push({
            id: Date.now(),
            name: name,
            weeklyMin: weeklyMin
        });
        
        saveData();
        renderAll();
        closeDutyModal();
        showAlert(`เพิ่มภาระงาน "${name}" สำเร็จ`);
    }
    
    function deleteDuty(departmentId, dutyId) {
        if (!confirm('ต้องการลบภาระงานนี้ใช่หรือไม่?')) return;
        const dept = departments.find(d => d.id === departmentId);
        if (!dept) return;
        dept.duties = dept.duties.filter(d => d.id !== dutyId);
        saveData();
        renderAll();
        showAlert('ลบภาระงานสำเร็จ');
    }
    
    function updateWeeklyMin(departmentId, dutyId, day, value) {
        const dept = departments.find(d => d.id === departmentId);
        if (!dept) return;
        const duty = dept.duties.find(d => d.id === dutyId);
        if (!duty) return;
        duty.weeklyMin[day] = parseInt(value) || 0;
        saveData();
    }
    
    function renderDepartments() {
        const container = document.getElementById('departmentsList');
        
        if (departments.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📁</div>
                    <p>ยังไม่มีแผนก กรุณาเพิ่มแผนกใหม่</p>
                </div>
            `;
            return;
        }
        
        const dayNames = {mon: 'จ', tue: 'อ', wed: 'พ', thu: 'พฤ', fri: 'ศ', sat: 'ส', sun: 'อา'};
        
        container.innerHTML = departments.map(dept => `
            <div class="card">
                <div class="card-header">
                    <div class="card-title">▪️ ${dept.name}</div>
                    <div class="card-actions">
                        <button class="btn-success btn-small" onclick="openDutyModal(${dept.id})">
                            + ภาระงาน
                        </button>
                        <button class="btn-danger btn-small" onclick="deleteDepartment(${dept.id})">
                            ลบแผนก
                        </button>
                    </div>
                </div>
                
                ${dept.duties.length > 0 ? `
                    <div class="nested-list">
                        ${dept.duties.map(duty => `
                            <div class="duty-item">
                                <div class="duty-header">
                                    <div class="duty-name">• ${duty.name}</div>
                                    <button class="btn-danger btn-small" onclick="deleteDuty(${dept.id}, ${duty.id})">
                                        ลบ
                                    </button>
                                </div>
                                <div class="weekly-schedule">
                                    ${Object.keys(dayNames).map(day => `
                                        <div class="day-input">
                                            <label>${dayNames[day]}</label>
                                            <input 
                                                type="number" 
                                                value="${duty.weeklyMin[day] || 0}" 
                                                min="0"
                                                onchange="updateWeeklyMin(${dept.id}, ${duty.id}, '${day}', this.value)"
                                            >
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                ` : `
                    <p style="color: #999; font-size: 14px; margin-top: 10px;">
                        ยังไม่มีภาระงาน คลิก "+ ภาระงาน" เพื่อเพิ่ม
                    </p>
                `}
            </div>
        `).join('');
    }
    
    // ===== จัดการแพทย์ =====
    
    function updateDoctorDepartmentSelect() {
        const select = document.getElementById('newDoctorDepartment');
        select.innerHTML = '<option value="">-- เลือกแผนก --</option>' +
            departments.map(dept => `<option value="${dept.id}">${dept.name}</option>`).join('');
    }
    
    function updateFilterDepartmentSelect() {
        const select = document.getElementById('filterDepartment');
        select.innerHTML = '<option value="">ทั้งหมด (All)</option>' +
            departments.map(dept => `<option value="${dept.id}">${dept.name}</option>`).join('');
    }
    
    function addDoctor() {
        const name = document.getElementById('newDoctorName').value.trim();
        const departmentId = parseInt(document.getElementById('newDoctorDepartment').value);
        
        if (!name) {
            showAlert('กรุณากรอกชื่อแพทย์', 'info');
            return;
        }
        
        if (!departmentId) {
            showAlert('กรุณาเลือกแผนก', 'info');
            return;
        }
        
        doctors.push({
            id: Date.now(),
            name: name,
            departmentId: departmentId
        });
        
        saveData();
        renderAll();
        document.getElementById('newDoctorName').value = '';
        document.getElementById('newDoctorDepartment').value = '';
        showAlert(`เพิ่มแพทย์ "${name}" สำเร็จ`);
    }
    
    function deleteDoctor(id) {
        if (!confirm('ต้องการลบแพทย์ท่านนี้ใช่หรือไม่?')) return;
        doctors = doctors.filter(d => d.id !== id);
        leaves = leaves.filter(l => l.doctorId !== id);
        saveData();
        renderAll();
        showAlert('ลบแพทย์สำเร็จ');
    }
    
    function renderDoctors() {
        const container = document.getElementById('doctorsList');
        const filterDept = document.getElementById('filterDepartment').value;
        
        let filteredDoctors = doctors;
        if (filterDept) {
            filteredDoctors = doctors.filter(d => d.departmentId == filterDept);
        }
        
        if (filteredDoctors.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">👤</div>
                    <p>ไม่พบแพทย์ในการกรองนี้</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = filteredDoctors.map(doctor => {
            const dept = departments.find(d => d.id === doctor.departmentId);
            const deptName = dept ? dept.name : 'ไม่ระบุแผนก';
            
            return `
                <div class="list-item">
                    <div class="list-item-content">
                        <div class="list-item-name">👤 ${doctor.name}</div>
                        <div class="list-item-info">
                            <span class="badge badge-primary">${deptName}</span>
                        </div>
                    </div>
                    <div class="list-item-actions">
                        <button class="btn-danger btn-small" onclick="deleteDoctor(${doctor.id})">
                            ลบ
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }
    
    // ===== ลางาน =====
    
    function updateLeaveDoctorSelect() {
        const select = document.getElementById('leaveDoctorId');
        select.innerHTML = '<option value="">-- เลือกแพทย์ --</option>' +
            doctors.map(doc => {
                const dept = departments.find(d => d.id === doc.departmentId);
                return `<option value="${doc.id}">${doc.name} (${dept ? dept.name : '-'})</option>`;
            }).join('');
    }
    
    function renderCalendar() {
        const container = document.getElementById('calendar');
        const firstDay = new Date(currentCalendarYear, currentCalendarMonth, 1);
        const lastDay = new Date(currentCalendarYear, currentCalendarMonth + 1, 0);
        const prevLastDay = new Date(currentCalendarYear, currentCalendarMonth, 0);
        
        const firstDayOfWeek = firstDay.getDay();
        const daysInMonth = lastDay.getDate();
        const daysInPrevMonth = prevLastDay.getDate();
        
        const monthNames = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
                          'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        
        let html = `
            <div class="calendar-header">
                <button class="btn-small" onclick="changeMonth(-1)">◀</button>
                <div class="calendar-title">${monthNames[currentCalendarMonth]} ${currentCalendarYear + 543}</div>
                <button class="btn-small" onclick="changeMonth(1)">▶</button>
            </div>
            <div class="calendar-grid">
                <div class="calendar-day-header">อา</div>
                <div class="calendar-day-header">จ</div>
                <div class="calendar-day-header">อ</div>
                <div class="calendar-day-header">พ</div>
                <div class="calendar-day-header">พฤ</div>
                <div class="calendar-day-header">ศ</div>
                <div class="calendar-day-header">ส</div>
        `;
        
        // วันของเดือนก่อน
        for (let i = firstDayOfWeek - 1; i >= 0; i--) {
            html += `<div class="calendar-day other-month">${daysInPrevMonth - i}</div>`;
        }
        
        // วันของเดือนปัจจุบัน
        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${currentCalendarYear}-${String(currentCalendarMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const hasLeave = leaves.some(l => {
                const start = new Date(l.startDate);
                const end = new Date(l.endDate);
                const current = new Date(dateStr);
                return current >= start && current <= end;
            });
            
            html += `<div class="calendar-day ${hasLeave ? 'has-leave' : ''}">${day}</div>`;
        }
        
        html += '</div>';
        container.innerHTML = html;
    }
    
    function changeMonth(delta) {
        currentCalendarMonth += delta;
        if (currentCalendarMonth > 11) {
            currentCalendarMonth = 0;
            currentCalendarYear++;
        } else if (currentCalendarMonth < 0) {
            currentCalendarMonth = 11;
            currentCalendarYear--;
        }
        renderCalendar();
    }
    
    document.getElementById('leaveDoctorId').addEventListener('change', function() {
        const doctorId = parseInt(this.value);
        if (!doctorId) {
            document.getElementById('affectedDutiesSection').style.display = 'none';
            return;
        }
        
        const doctor = doctors.find(d => d.id === doctorId);
        if (!doctor) return;
        
        const dept = departments.find(d => d.id === doctor.departmentId);
        if (!dept || !dept.duties.length) {
            document.getElementById('affectedDutiesSection').style.display = 'none';
            return;
        }
        
        document.getElementById('affectedDutiesSection').style.display = 'block';
        const container = document.getElementById('affectedDutiesList');
        container.innerHTML = dept.duties.map(duty => `
            <label style="display: block; margin-bottom: 8px; cursor: pointer;">
                <input type="checkbox" class="duty-checkbox" value="${duty.id}" style="margin-right: 8px;">
                ${duty.name}
                <label style="display: inline; margin-left: 10px; font-size: 12px;">
                    <input type="checkbox" class="replacement-checkbox" data-duty-id="${duty.id}" style="margin-left: 10px;">
                    มีคนมาแทน
                </label>
            </label>
        `).join('');
    });
    
    function saveLeave() {
        const doctorId = parseInt(document.getElementById('leaveDoctorId').value);
        const startDate = document.getElementById('leaveStartDate').value;
        const endDate = document.getElementById('leaveEndDate').value;
        const reason = document.getElementById('leaveReason').value.trim();
        
        if (!doctorId || !startDate || !endDate) {
            showAlert('กรุณากรอกข้อมูลให้ครบถ้วน', 'info');
            return;
        }
        
        const affectedDuties = [];
        document.querySelectorAll('.duty-checkbox:checked').forEach(cb => {
            const dutyId = parseInt(cb.value);
            const hasReplacement = document.querySelector(`.replacement-checkbox[data-duty-id="${dutyId}"]`).checked;
            affectedDuties.push({
                dutyId: dutyId,
                hasReplacement: hasReplacement
            });
        });
        
        leaves.push({
            id: Date.now(),
            doctorId: doctorId,
            startDate: startDate,
            endDate: endDate,
            reason: reason,
            affectedDuties: affectedDuties
        });
        
        saveData();
        renderAll();
        
        document.getElementById('leaveDoctorId').value = '';
        document.getElementById('leaveStartDate').value = '';
        document.getElementById('leaveEndDate').value = '';
        document.getElementById('leaveReason').value = '';
        document.getElementById('affectedDutiesSection').style.display = 'none';
        
        showAlert('บันทึกการลาสำเร็จ');
    }
    
    function deleteLeave(id) {
        if (!confirm('ต้องการลบการลานี้ใช่หรือไม่?')) return;
        leaves = leaves.filter(l => l.id !== id);
        saveData();
        renderAll();
        showAlert('ลบการลาสำเร็จ');
    }
    
    function renderLeaveList() {
        const container = document.getElementById('leaveList');
        
        if (leaves.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📅</div>
                    <p>ยังไม่มีการลางาน</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = leaves.map(leave => {
            const doctor = doctors.find(d => d.id === leave.doctorId);
            const dept = doctor ? departments.find(d => d.id === doctor.departmentId) : null;
            
            const criticalDuties = leave.affectedDuties.filter(ad => !ad.hasReplacement);
            const warningDuties = leave.affectedDuties.filter(ad => ad.hasReplacement);
            
            let badgeClass = 'badge-success';
            let statusText = 'ปกติ';
            
            if (criticalDuties.length > 0) {
                badgeClass = 'badge-danger';
                statusText = 'วิกฤต - ไม่มีคนมาแทน';
            } else if (warningDuties.length > 0) {
                badgeClass = 'badge-warning';
                statusText = 'เตือน - มีคนมาแทน';
            }
            
            return `
                <div class="card">
                    <div class="card-header">
                        <div>
                            <div class="card-title">👤 ${doctor ? doctor.name : 'ไม่ระบุ'}</div>
                            <div style="font-size: 13px; color: #666; margin-top: 4px;">
                                ${dept ? dept.name : '-'} | ${leave.startDate} ถึง ${leave.endDate}
                            </div>
                        </div>
                        <div class="card-actions">
                            <span class="badge ${badgeClass}">${statusText}</span>
                            <button class="btn-danger btn-small" onclick="deleteLeave(${leave.id})">ลบ</button>
                        </div>
                    </div>
                    ${leave.reason ? `<div style="font-size: 14px; color: #666; margin-top: 8px;">เหตุผล: ${leave.reason}</div>` : ''}
                    ${leave.affectedDuties.length > 0 ? `
                        <div style="margin-top: 10px; font-size: 13px;">
                            <strong>ภาระงานที่กระทบ:</strong>
                            ${leave.affectedDuties.map(ad => {
                                const duty = dept ? dept.duties.find(d => d.id === ad.dutyId) : null;
                                return `<div style="margin-top: 4px;">
                                    • ${duty ? duty.name : '-'} 
                                    ${ad.hasReplacement 
                                        ? '<span style="color: #ed8936;">⚠️ มีคนมาแทน</span>' 
                                        : '<span style="color: #e53e3e;">❌ ไม่มีคนมาแทน</span>'}
                                </div>`;
                            }).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('');
    }
    
    // ===== ภาพรวม =====
    
    function renderOverview() {
        const container = document.getElementById('overviewContent');
        
        const totalDepartments = departments.length;
        const totalDoctors = doctors.length;
        const totalLeaves = leaves.length;
        
        // วิเคราะห์ภาระงาน
        let criticalIssues = [];
        let warnings = [];
        
        // ตรวจสอบจากการลางาน
        leaves.forEach(leave => {
            const doctor = doctors.find(d => d.id === leave.doctorId);
            const dept = doctor ? departments.find(d => d.id === doctor.departmentId) : null;
            
            leave.affectedDuties.forEach(ad => {
                const duty = dept ? dept.duties.find(d => d.id === ad.dutyId) : null;
                if (!duty) return;
                
                if (!ad.hasReplacement) {
                    criticalIssues.push({
                        type: 'leave',
                        doctorName: doctor.name,
                        deptName: dept.name,
                        dutyName: duty.name,
                        dates: `${leave.startDate} - ${leave.endDate}`,
                        message: `${doctor.name} ลางาน ${duty.name} ไม่มีคนมาแทน`
                    });
                } else {
                    warnings.push({
                        type: 'leave',
                        doctorName: doctor.name,
                        deptName: dept.name,
                        dutyName: duty.name,
                        dates: `${leave.startDate} - ${leave.endDate}`,
                        message: `${doctor.name} ลางาน ${duty.name} มีคนมาแทน`
                    });
                }
            });
        });
        
        container.innerHTML = `
            <div class="grid-3">
                <div class="card">
                    <div style="text-align: center;">
                        <div style="font-size: 48px; margin-bottom: 10px;">▪️</div>
                        <div style="font-size: 32px; font-weight: 600; color: #667eea;">${totalDepartments}</div>
                        <div style="color: #666;">จำนวนแผนก</div>
                    </div>
                </div>
                
                <div class="card">
                    <div style="text-align: center;">
                        <div style="font-size: 48px; margin-bottom: 10px;">👤</div>
                        <div style="font-size: 32px; font-weight: 600; color: #48bb78;">${totalDoctors}</div>
                        <div style="color: #666;">จำนวนแพทย์</div>
                    </div>
                </div>
                
                <div class="card">
                    <div style="text-align: center;">
                        <div style="font-size: 48px; margin-bottom: 10px;">📅</div>
                        <div style="font-size: 32px; font-weight: 600; color: #ed8936;">${totalLeaves}</div>
                        <div style="color: #666;">การลางาน</div>
                    </div>
                </div>
            </div>
            
            ${criticalIssues.length > 0 ? `
                <div style="margin-top: 20px;">
                    <h3 style="color: #e53e3e; margin-bottom: 15px;">🚨 ปัญหาวิกฤต (Critical)</h3>
                    ${criticalIssues.map(issue => `
                        <div class="list-item" style="border-left: 4px solid #e53e3e;">
                            <div class="list-item-content">
                                <div class="list-item-name">❌ ${issue.message}</div>
                                <div class="list-item-info">
                                    <span class="badge badge-danger">${issue.deptName}</span>
                                    <span style="margin-left: 10px;">${issue.dates}</span>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            ` : ''}
            
            ${warnings.length > 0 ? `
                <div style="margin-top: 20px;">
                    <h3 style="color: #ed8936; margin-bottom: 15px;">⚠️ คำเตือน (Warning)</h3>
                    ${warnings.map(warn => `
                        <div class="list-item" style="border-left: 4px solid #ed8936;">
                            <div class="list-item-content">
                                <div class="list-item-name">⚠️ ${warn.message}</div>
                                <div class="list-item-info">
                                    <span class="badge badge-warning">${warn.deptName}</span>
                                    <span style="margin-left: 10px;">${warn.dates}</span>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            ` : ''}
            
            ${criticalIssues.length === 0 && warnings.length === 0 ? `
                <div style="text-align: center; padding: 40px; color: #48bb78; margin-top: 20px;">
                    <div style="font-size: 48px; margin-bottom: 10px;">✅</div>
                    <div style="font-size: 18px; font-weight: 600;">ทุกอย่างปกติ ไม่มีปัญหา</div>
                </div>
            ` : ''}
            
            <div style="margin-top: 30px;">
                <h3 style="margin-bottom: 15px;">📋 รายละเอียดแต่ละแผนก</h3>
                ${departments.map(dept => {
                    const deptDoctors = doctors.filter(d => d.departmentId === dept.id);
                    return `
                        <div class="card">
                            <div style="font-weight: 600; color: #333; margin-bottom: 10px;">
                                ▪️ ${dept.name}
                            </div>
                            <div style="font-size: 14px; color: #666;">
                                จำนวนแพทย์: ${deptDoctors.length} คน
                            </div>
                            ${dept.duties.length > 0 ? `
                                <div style="margin-top: 10px; font-size: 14px;">
                                    <div style="font-weight: 600; margin-bottom: 5px;">ภาระงาน:</div>
                                    ${dept.duties.map(duty => {
                                        const total = Object.values(duty.weeklyMin).reduce((a, b) => a + b, 0);
                                        return `<div style="padding: 5px 0;">• ${duty.name} (ต้องการรวม ${total} เที่ยว/สัปดาห์)</div>`;
                                    }).join('')}
                                </div>
                            ` : '<div style="margin-top: 10px; font-size: 14px; color: #999;">ยังไม่มีภาระงาน</div>'}
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    }
    
    // โหลดข้อมูลเมื่อเริ่มต้น
    loadData();
</script>
