<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🏥 ระบบลางานแพทย์</h1>

```
    <div id="errorMessage" class="error-message"></div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">ชื่อผู้ใช้</label>
            <input type="text" id="username" name="username" required autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">รหัสผ่าน</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
        <button type="button" class="btn btn-secondary" onclick="window.location.href='register.html'">ลงทะเบียน</button>
        <button type="button" class="btn btn-secondary">ลืมรหัสผ่าน</button>
        <button type="button" class="btn btn-secondary">เปลี่ยนรหัสผ่าน</button>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorMessage = document.getElementById('errorMessage');

        try {
            // เรียก API login
            const response = await fetch('https://doc-leave-api.9vk92zm5z2.workers.dev/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    licenseNumber: username,
                    password: password
                })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                // Login สำเร็จ
                errorMessage.classList.remove('show');
                
                // เก็บข้อมูล session
                sessionStorage.setItem('loggedIn', 'true');
                sessionStorage.setItem('username', data.data.licenseNumber);
                sessionStorage.setItem('role', data.data.role);
                
                // Redirect ตาม role
                if (data.data.role === 'admin') {
                    window.location.href = 'dev.html';
                } else {
                    window.location.href = 'user.html';
                }
            } else {
                // Login ไม่สำเร็จ
                errorMessage.textContent = '❌ ' + (data.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
                errorMessage.classList.add('show');
                document.getElementById('password').value = '';
            }
        } catch (error) {
            console.error('Login error:', error);
            errorMessage.textContent = '❌ เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
            errorMessage.classList.add('show');
            document.getElementById('password').value = '';
        }
    });
</script>
