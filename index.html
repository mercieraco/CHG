```
    <div id="message" class="message"></div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">ชื่อผู้ใช้</label>
            <input type="text" id="username" required placeholder="Username">

        <div class="form-group">

<!-- Reset Password Modal -->
<div id="resetModal" class="modal">
    <div class="modal-content">
        <h3>🔑 รีเซ็ตรหัสผ่าน</h3>
        <div id="resetMessage" class="message"></div>
        
        <form id="resetForm">
            <div class="form-group">
                <label for="resetUsername">ชื่อผู้ใช้</label>
                <input type="text" id="resetUsername" required placeholder="Username">
            </div>

            <div class="form-group">
                <label for="resetCode">รหัสรีเซ็ต</label>
                <input type="text" id="resetCode" required placeholder="กรอกรหัส 4 หลัก">
            </div>

            <div class="form-group">
                <label for="newPassword">รหัสผ่านใหม่</label>
                <input type="password" id="newPassword" required placeholder="Password">
            </div>

            <button type="submit" class="btn btn-primary">รีเซ็ตรหัสผ่าน</button>
            <button type="button" class="btn btn-secondary" onclick="closeResetModal()">ยกเลิก</button>
        </form>
    </div>
</div>

<script>
    // API URL
    const API_DOC_URL = 'https://depdocdoc.9vk92zm5z2.workers.dev';

    // User พิเศษ (Hardcoded) - เฉพาะผู้ใช้ทั่วไป
    const SPECIAL_USER = {
        username: 'User',
        password: 'ch3',
        role: 'user',
        name: 'ผู้ใช้ทั่วไป',
        resetCode: '8889'
    };

    // Login Form
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const message = document.getElementById('message');

        // แสดง Loading
        message.className = 'message show';
        message.style.background = '#e3f2fd';
        message.style.color = '#1976d2';
        message.textContent = '⏳ กำลังตรวจสอบ...';

        try {
            // 1. เช็ค User พิเศษก่อน
            if (username === SPECIAL_USER.username && password === SPECIAL_USER.password) {
                sessionStorage.setItem('loggedIn', 'true');
                sessionStorage.setItem('username', SPECIAL_USER.name);
                sessionStorage.setItem('role', SPECIAL_USER.role);

                message.className = 'message success show';
                message.textContent = '✅ เข้าสู่ระบบสำเร็จ (ผู้ใช้ทั่วไป)';

                setTimeout(() => {
                    window.location.href = 'summary.html';
                }, 1000);
                return;
            }

            // 2. เช็คจาก Database (แพทย์ + Admin)
            const response = await fetch(`${API_DOC_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    licenseNumber: username,
                    password: password
                })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                // Login สำเร็จ
                sessionStorage.setItem('loggedIn', 'true');
                sessionStorage.setItem('username', data.data.name);
                sessionStorage.setItem('role', data.data.role);
                sessionStorage.setItem('licenseNumber', data.data.license_number);

                message.className = 'message success show';
                message.textContent = `✅ เข้าสู่ระบบสำเร็จ (${data.data.role === 'admin' ? 'Admin' : 'แพทย์'})`;

                setTimeout(() => {
                    if (data.data.role === 'admin') {
                        window.location.href = 'dev.html';
                    } else {
                        window.location.href = 'user.html';
                    }
                }, 1000);
            } else {
                throw new Error(data.message || 'เข้าสู่ระบบไม่สำเร็จ');
            }
        } catch (error) {
            message.className = 'message error show';
            message.textContent = '❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
        }
    });

    // Reset Password Modal
    function showResetModal() {
        document.getElementById('resetModal').classList.add('show');
    }

    function closeResetModal() {
        document.getElementById('resetModal').classList.remove('show');
        document.getElementById('resetForm').reset();
        document.getElementById('resetMessage').classList.remove('show');
    }

    document.getElementById('resetForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('resetUsername').value.trim();
        const resetCode = document.getElementById('resetCode').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const message = document.getElementById('resetMessage');

        try {
            // 1. เช็ค User พิเศษ
            if (username === SPECIAL_USER.username) {
                if (resetCode !== SPECIAL_USER.resetCode) {
                    message.className = 'message error show';
                    message.textContent = '❌ รหัสรีเซ็ตไม่ถูกต้อง';
                    return;
                }

                SPECIAL_USER.password = newPassword;
                message.className = 'message success show';
                message.textContent = '✅ รีเซ็ตรหัสผ่านสำเร็จ';

                setTimeout(() => {
                    closeResetModal();
                    alert('รีเซ็ตรหัสผ่านสำเร็จ กรุณาเข้าสู่ระบบใหม่');
                }, 1500);
                return;
            }

            // 2. เช็คจาก Database (แพทย์ + Admin)
            const response = await fetch(`${API_DOC_URL}/api/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    licenseNumber: username,
                    resetCode: resetCode,
                    newPassword: newPassword
                })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                message.className = 'message success show';
                message.textContent = '✅ รีเซ็ตรหัสผ่านสำเร็จ';

                setTimeout(() => {
                    closeResetModal();
                    alert('รีเซ็ตรหัสผ่านสำเร็จ กรุณาเข้าสู่ระบบใหม่');
                }, 1500);
            } else {
                throw new Error(data.message || 'รีเซ็ตรหัสผ่านไม่สำเร็จ');
            }
        } catch (error) {
            message.className = 'message error show';
            message.textContent = '❌ ' + error.message;
        }
    });

    // ปิด modal เมื่อคลิกนอก modal
    window.onclick = function(event) {
        const modal = document.getElementById('resetModal');
        if (event.target === modal) {
            closeResetModal();
        }
    };
</script>
