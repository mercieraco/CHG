    body {

    .tabs {
        display: flex;

        margin-bottom: 30px;
        border-bottom: 2px solid #e0e0e0;
        flex-wrap: wrap;
    }
    
    .tab {
        padding: 12px 24px;
        background: none;
        border: none;
        border-bottom: 3px solid transparent;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        color: #666;
        transition: all 0.3s;
    }
    
    .tab:hover {
        color: #667eea;
    }
    
    .tab.active {
        color: #667eea;
        border-bottom-color: #667eea;
    }
    
    .tab-content {
        display: none;
    }
    
    .tab-content.active {
        display: block;
    }
    
    /* Section Styles */
    .section {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
    }
    
    .section-title {
        font-size: 18px;
        font-weight: 600;

        margin-bottom: 15px;

        align-items: center;
        gap: 10px;

    }

        font-weight: 600;

    }

        width: 100%;

        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 16px;
        transition: border-color 0.3s;
    }
    
    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #667eea;
    }
    
    /* Button Styles */
    button {
        padding: 12px 24px;

<script>
    // ข้อมูลระบบ
    let departments = [];
    let doctors = [];
    let leaves = [];
    let currentDepartmentId = null;
    let currentDoctorId = null;
    let currentCalendarMonth = new Date().getMonth();
    let currentCalendarYear = new Date().getFullYear();
    
    // ตัวแปรสำหรับเลือกวันที่
    let selectedStartDate = null;
    let selectedEndDate = null;
    
    // โหลดข้อมูล
    function loadData() {
        const savedDepartments = localStorage.getItem('hospital_departments_v32');
        const savedDoctors = localStorage.getItem('hospital_doctors_v32');
        const savedLeaves = localStorage.getItem('hospital_leaves_v32');
        
        if (savedDepartments) departments = JSON.parse(savedDepartments);
        if (savedDoctors) doctors = JSON.parse(savedDoctors);
        if (savedLeaves) leaves = JSON.parse(savedLeaves);
        
        // Migration: เพิ่ม assignments ให้แพทย์ที่ยังไม่มี
        let needsSave = false;
        doctors.forEach(doc => {
            if (!doc.assignments) {
                doc.assignments = [];
                needsSave = true;
            }
        });
        
        // Migration: ลบ weeklyTotal ออกจาก duties
        departments.forEach(dept => {
            dept.duties.forEach(duty => {
                if (duty.weeklyTotal) {
                    delete duty.weeklyTotal;
                    needsSave = true;
                }
            });
        });
        
        if (needsSave) {
            saveData();
            showAlert('อัพเกรดข้อมูลเป็น v32 สำเร็จ! กรุณาไปที่ "จัดการแพทย์" เพื่อเพิ่มภาระงานให้แพทย์', 'info');
        }
        
        renderAll();
    }
    
    function saveData() {

    // Tab switching via event delegation
    document.getElementById('tabBar').addEventListener('click', function(e) {
        const btn = e.target.closest('[data-tab]');
        if (!btn) return;
        const tabName = btn.dataset.tab;

        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + tabName).classList.add('active');
        btn.classList.add('active');

        if (tabName === 'overview') renderOverview();
        if (tabName === 'leave') {
            clearLeaveSelection();
            updateLeaveDoctorSelect(); // populate dropdown ก่อน
            renderCalendar();
            renderLeaveList();
            bindLeaveDoctorEvent(); // bind event หลัง
        }
    });
    
    // ===== HELPER: คำนวณจำนวนแพทย์ที่มาจริง =====
    function calculateActualDoctors(dutyId, dayKey) {
        return doctors.filter(doc => {
            return doc.assignments && doc.assignments.some(a =>
                a.dutyId === dutyId && a.workDays && a.workDays.includes(dayKey)
            );
        }).length;
    }

    function updateDutyNameInput() {
        const selectedRadio = document.querySelector('input[name="dutyNameType"]:checked');
        const otherInput = document.getElementById('dutyNameOther');
        const hiddenInput = document.getElementById('modalDutyName');
        
        if (!selectedRadio) {
            otherInput.style.display = 'none';
            hiddenInput.value = '';
            return;
        }
        
        if (selectedRadio.value === 'อื่นๆ') {
            otherInput.style.display = 'block';
            otherInput.focus();
            hiddenInput.value = otherInput.value || 'อื่นๆ';
            
            // Update hidden input เมื่อพิมพ์
            otherInput.oninput = function() {
                hiddenInput.value = this.value || 'อื่นๆ';

        if (!name) {

            return;

    function updateDutyValue(departmentId, dutyId, day, type, value) {
        const dept = departments.find(d => d.id === departmentId);
        if (!dept) return;
        const duty = dept.duties.find(d => d.id === dutyId);

        const doc = doctors.find(d => d.id === currentDoctorId);
        if (!doc) return;
        
        const dutyId = Number(document.getElementById('assignDutyId').value);
        if (!dutyId) {
            showAlert('กรุณาเลือกภาระงาน', 'info');

    function onCalendarDayClick(dateStr) {
        const durationType = document.querySelector('input[name="leaveDurationType"]:checked');
        const isShortLeave = durationType && durationType.value === 'short';
        
        if (isShortLeave) {
            // ลา ≤ 24 ชม: เลือกได้แค่วันเดียว
            selectedStartDate = dateStr;
            selectedEndDate = dateStr; // วันเดียวกัน
            document.getElementById('dateSelectionInfo').style.display = 'block';
            updateSelectedDatesDisplay();
            renderCalendar();
            return;
        }
        
        // ลา > 24 ชม: เลือกได้หลายวัน (เดิม)
        if (!selectedStartDate) {
            // เลือกวันเริ่มต้น
            selectedStartDate = dateStr;
            selectedEndDate = null;
            document.getElementById('dateSelectionInfo').style.display = 'block';
            updateSelectedDatesDisplay();
        } else if (!selectedEndDate) {
            // เลือกวันสิ้นสุด
            const start = new Date(selectedStartDate);
            const end = new Date(dateStr);
            
            if (end < start) {
                // ถ้าเลือกวันที่น้อยกว่าวันเริ่มต้น ให้สลับ
                selectedEndDate = selectedStartDate;
                selectedStartDate = dateStr;
            } else {
                selectedEndDate = dateStr;
            }
            updateSelectedDatesDisplay();
        } else {
            // เลือกใหม่
            selectedStartDate = dateStr;
            selectedEndDate = null;
            updateSelectedDatesDisplay();
        }
        
        renderCalendar();
    }
    
    function updateSelectedDatesDisplay() {
        const display = document.getElementById('selectedDates');
        const durationType = document.querySelector('input[name="leaveDurationType"]:checked');
        const isShortLeave = durationType && durationType.value === 'short';
        
        if (isShortLeave && selectedStartDate) {
            // ลา ≤ 24 ชม: แสดงแค่วันเดียว
            display.innerHTML = `✓ เลือกแล้ว: ${selectedStartDate}`;
            display.style.color = '#22543d';
        } else if (selectedStartDate && selectedEndDate) {
            // ลา > 24 ชม: แสดงช่วงวัน
            display.innerHTML = `✓ เลือกแล้ว: ${selectedStartDate} ถึง ${selectedEndDate}`;
            display.style.color = '#22543d';
        } else if (selectedStartDate) {
            display.innerHTML = `เลือกวันเริ่มต้น: ${selectedStartDate}<br>👆 คลิกเลือกวันสิ้นสุด`;
            display.style.color = '#2c5282';
        } else {
            display.innerHTML = '';
        }
    }
    
    function renderCalendar() {
        const container = document.getElementById('calendar');
        const firstDay = new Date(currentCalendarYear, currentCalendarMonth, 1);
        const lastDay = new Date(currentCalendarYear, currentCalendarMonth + 1, 0);
        const prevLastDay = new Date(currentCalendarYear, currentCalendarMonth, 0);
        
        // ปรับให้ 0=จันทร์, 1=อังคาร, ..., 6=อาทิตย์
        let firstDayOfWeek = firstDay.getDay() - 1;
        if (firstDayOfWeek === -1) firstDayOfWeek = 6; // ถ้าอาทิตย์ให้เป็น 6
        
        const daysInMonth = lastDay.getDate();
        const daysInPrevMonth = prevLastDay.getDate();
        
        const monthNames = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
                          'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        
        let html = `
            <div class="calendar-header">
                <button class="btn-small" onclick="changeMonth(-1)">◀</button>
                <div class="calendar-title">${monthNames[currentCalendarMonth]} ${currentCalendarYear + 543}</div>
                <button class="btn-small" onclick="changeMonth(1)">▶</button>
            </div>
            <div class="calendar-grid">
                <div class="calendar-day-header">จ</div>
                <div class="calendar-day-header">อ</div>
                <div class="calendar-day-header">พ</div>
                <div class="calendar-day-header">พฤ</div>
                <div class="calendar-day-header">ศ</div>
                <div class="calendar-day-header">ส</div>
                <div class="calendar-day-header">อา</div>
        `;
        
        // วันว่างก่อนวันที่ 1
        for (let i = 0; i < firstDayOfWeek; i++) {
            html += `<div class="calendar-day other-month"></div>`;
        }
        
        // วันของเดือนปัจจุบัน
        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${currentCalendarYear}-${String(currentCalendarMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            
            const hasLeave = leaves.some(l => {
                const start = new Date(l.startDate);
                const end = new Date(l.endDate);
                const current = new Date(dateStr);
                return current >= start && current <= end;
            });
            
            let classes = ['calendar-day'];
            if (hasLeave) classes.push('has-leave');
            
            // ตรวจสอบว่าเป็นวันที่ถูกเลือก
            if (selectedStartDate === dateStr) {
                classes.push('selected-start');
            } else if (selectedEndDate === dateStr) {
                classes.push('selected-end');
            } else if (selectedStartDate && selectedEndDate) {
                const current = new Date(dateStr);
                const start = new Date(selectedStartDate);
                const end = new Date(selectedEndDate);
                if (current > start && current < end) {
                    classes.push('in-range');
                }
            }
            
            html += `<div class="${classes.join(' ')}" onclick="onCalendarDayClick('${dateStr}')">${day}</div>`;
        }
        
        html += '</div>';
        container.innerHTML = html;
    }
    
    function changeMonth(delta) {
        currentCalendarMonth += delta;
        if (currentCalendarMonth > 11) {
            currentCalendarMonth = 0;
            currentCalendarYear++;
        } else if (currentCalendarMonth < 0) {
            currentCalendarMonth = 11;
            currentCalendarYear--;
        }
        renderCalendar();
    }
    
    function updateLeaveReasonInput() {
        const selectedRadio = document.querySelector('input[name="leaveReasonType"]:checked');
        const otherInput = document.getElementById('leaveReasonOther');
        const hiddenInput = document.getElementById('leaveReason');
        
        if (!selectedRadio) {
            otherInput.style.display = 'none';
            hiddenInput.value = '';
            // ซ่อน Step 3 และปฏิทิน
            document.getElementById('leaveDurationSection').style.display = 'none';
            document.getElementById('calendarSection').style.display = 'none';
            return;
        }
        
        if (selectedRadio.value === 'อื่นๆ') {
            otherInput.style.display = 'block';
            otherInput.focus();
            hiddenInput.value = otherInput.value || 'อื่นๆ';
            
            // Update hidden input เมื่อพิมพ์
            otherInput.oninput = function() {
                hiddenInput.value = this.value || 'อื่นๆ';
            };
        } else {
            otherInput.style.display = 'none';
            otherInput.value = '';
            hiddenInput.value = selectedRadio.value;
        }
        
        // เลือกเหตุผลแล้ว → แสดง Step 3 (ระยะเวลา)
        document.getElementById('leaveDurationSection').style.display = 'block';
        
        // Auto-trigger: เลือก "ลา > 24 ชม" โดยอัตโนมัติ
        const longLeave = document.querySelector('input[name="leaveDurationType"][value="long"]');
        if (longLeave && !document.querySelector('input[name="leaveDurationType"]:checked')) {
            longLeave.checked = true;
        }
        
        // แสดงปฏิทินทันที (เพราะมี default checked)
        updateLeaveDurationType();
    }
    
    function updateLeaveDurationType() {
        const durationType = document.querySelector('input[name="leaveDurationType"]:checked');
        
        if (!durationType) {
            document.getElementById('calendarSection').style.display = 'none';
            return;
        }
        
        // แสดงปฏิทิน
        document.getElementById('calendarSection').style.display = 'block';
        
        // Reset การเลือกวัน
        selectedStartDate = null;
        selectedEndDate = null;
        document.getElementById('dateSelectionInfo').style.display = 'none';
        
        // Render ปฏิทิน
        renderCalendar();
    }

        const newSel = sel.cloneNode(true);
        sel.parentNode.replaceChild(newSel, sel);

        newSel.addEventListener('change', function() {
            const doctorId = parseInt(this.value);
            if (!doctorId) {
                // ไม่ได้เลือกแพทย์ → ซ่อนทุกอย่าง
                document.getElementById('leaveReasonSection').style.display = 'none';
                document.getElementById('calendarSection').style.display = 'none';
                document.getElementById('affectedDutiesSection').style.display = 'none';
                return;
            }
            
            // เลือกแพทย์แล้ว → แสดงเหตุผลการลา
            document.getElementById('leaveReasonSection').style.display = 'block';
            
            // ซ่อนปฏิทินจนกว่าจะเลือกเหตุผล
            document.getElementById('calendarSection').style.display = 'none';
            
            const doctor = doctors.find(d => d.id === doctorId);
            if (!doctor) return;
            
            const dept = departments.find(d => d.id === doctor.departmentId);

                    <select id="selectedDutyId" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px;">
                        <option value="">-- เลือกภาระงานที่กระทบ --</option>
                        ${dept.duties.map(duty => `<option value="${duty.id}">${duty.name}</option>`).join('')}
                    </select>
                </div>
                
                <div style="margin-bottom: 15px;">
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; margin: 0;">
                        <input type="checkbox" id="hasReplacementCheckbox" style="width: auto; margin: 0;">
                        <span style="font-size: 14px;">มีคนมาแทน</span>
                    </label>
                </div>
                
                <div id="replacementSection" style="display: none; margin-top: 10px; padding: 15px; background: #f0f4f8; border-radius: 8px;">
                    <div style="margin-bottom: 12px;">
                        <label style="font-weight: 600; font-size: 14px; margin-bottom: 6px; display: block;">กรองตามแผนก</label>

                            <option value="">ทั้งหมด</option>

                        </select>
                    </div>
                    <div>
                        <label style="font-weight: 600; font-size: 14px; margin-bottom: 6px; display: block;">เลือกแพทย์ที่มาแทน</label>
                        <select id="replacementDoctorId" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px;">
                            <option value="">-- เลือกแพทย์ --</option>
                        </select>
                    </div>
                </div>
            `;
            
            // Bind events สำหรับ checkbox และ filter
            const checkbox = document.getElementById('hasReplacementCheckbox');
            const replacementSection = document.getElementById('replacementSection');
            const deptFilter = document.getElementById('replacementDeptFilter');
            const docSelect = document.getElementById('replacementDoctorId');
            
            checkbox.addEventListener('change', function() {
                replacementSection.style.display = this.checked ? 'block' : 'none';
                if (this.checked) updateReplacementDoctorList();
            });
            
            deptFilter.addEventListener('change', updateReplacementDoctorList);
            
            function updateReplacementDoctorList() {
                const filterDeptId = deptFilter.value;
                let filteredDocs = doctors.filter(d => d.id !== doctorId); // ไม่ให้เลือกคนที่ลาเอง
                
                if (filterDeptId) {
                    filteredDocs = filteredDocs.filter(d => d.departmentId == filterDeptId);
                }
                
                // เรียงตาม alphabetical
                filteredDocs.sort((a, b) => a.name.localeCompare(b.name, 'th'));
                
                docSelect.innerHTML = '<option value="">-- เลือกแพทย์ --</option>' +
                    filteredDocs.map(d => {
                        const deptName = departments.find(dep => dep.id === d.departmentId)?.name || '';
                        return `<option value="${d.id}">${d.name} (${deptName})</option>`;
                    }).join('');

            // เรียกครั้งแรก
            updateReplacementDoctorList();
        });

    function saveLeave() {
        const doctorId = parseInt(document.getElementById('leaveDoctorId').value);
        const reason = document.getElementById('leaveReason').value.trim();
        
        if (!doctorId || !selectedStartDate || !selectedEndDate) {
            showAlert('กรุณากรอกข้อมูลให้ครบถ้วนและเลือกวันที่บนปฏิทิน', 'info');
            return;
        }
        
        // อ่านจาก dropdown
        const selectedDutyId = parseInt(document.getElementById('selectedDutyId')?.value);
        if (!selectedDutyId) {
            showAlert('กรุณาเลือกภาระงานที่กระทบ', 'info');
            return;
        }
        
        const hasReplacement = document.getElementById('hasReplacementCheckbox')?.checked || false;
        const replacementDoctorId = hasReplacement ? (parseInt(document.getElementById('replacementDoctorId')?.value) || null) : null;
        
        if (hasReplacement && !replacementDoctorId) {
            showAlert('กรุณาเลือกแพทย์ที่มาแทน', 'info');
            return;
        }
        
        const affectedDuties = [{
            dutyId: selectedDutyId,
            hasReplacement: hasReplacement,
            replacementDoctorId: replacementDoctorId
        }];
        
        leaves.push({
            id: Date.now(),
            doctorId: doctorId,
            startDate: selectedStartDate,
            endDate: selectedEndDate,
            reason: reason,
            affectedDuties: affectedDuties
        });
        
        saveData();
        clearLeaveSelection();
        renderAll();
        
        showAlert('บันทึกการลาสำเร็จ');
    }
    
    function deleteLeave(id) {
        if (!confirm('ต้องการลบการลานี้ใช่หรือไม่?')) return;
        leaves = leaves.filter(l => l.id !== id);
        saveData();
        renderAll();
        showAlert('ลบการลาสำเร็จ');
    }
    
    function renderLeaveList() {
        const container = document.getElementById('leaveList');
        
        if (leaves.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📅</div>
                    <p>ยังไม่มีการลางาน</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = leaves.map(leave => {
            const doctor = doctors.find(d => d.id === leave.doctorId);
            const dept = doctor ? departments.find(d => d.id === doctor.departmentId) : null;
            
            // คำนวณ status จริงๆ เดียวกับ overview
            // วนทุกวันในช่วงลา แล้วหาว่า remaining < min ไหม
            let hasCritical = false;
            let hasWarning = false;
            
            if (dept) {
                leave.affectedDuties.forEach(ad => {
                    const duty = dept.duties.find(d => d.id === ad.dutyId);
                    if (!duty) return;
                    
                    const startDate = new Date(leave.startDate + 'T00:00:00');
                    const endDate = new Date(leave.endDate + 'T00:00:00');
                    const dayKeys = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
                    
                    for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                        const dayKey = dayKeys[d.getDay()];
                        const total = calculateActualDoctors(duty.id, dayKey);
                        const min = duty.weeklyMin[dayKey] || 0;
                        if (total === 0 && min === 0) continue; // วันหยุด skip
                        
                        // นับคนที่ลาในวันนี้สำหรับ duty นี้ แต่ไม่นับคนที่มีคนมาแทน
                        const leavesOnDay = leaves.filter(l => {
                            const lStart = new Date(l.startDate + 'T00:00:00');
                            const lEnd = new Date(l.endDate + 'T00:00:00');
                            if (!(d >= lStart && d <= lEnd)) return false;
                            
                            // เช็คว่า duty นี้ถูก affect และไม่มีคนมาแทน
                            const affectedDuty = l.affectedDuties.find(ld => ld.dutyId === duty.id);
                            return affectedDuty && !affectedDuty.hasReplacement;
                        }).length;
                        
                        const remaining = total - leavesOnDay;
                        
                        if (remaining < min) {
                            if (remaining < 2) {
                                hasCritical = true;
                            } else {
                                hasWarning = true;
                            }
                        }
                    }
                });
            }
            
            let badgeClass = 'badge-success';
            let statusText = 'ปกติ';
            
            if (hasCritical) {
                badgeClass = 'badge-danger';
                statusText = 'วิกฤต';
            } else if (hasWarning) {
                badgeClass = 'badge-warning';
                statusText = 'เตือน';
            }
            
            return `
                <div class="card">
                    <div class="card-header">
                        <div>
                            <div class="card-title">👤 ${doctor ? doctor.name : 'ไม่ระบุ'}</div>
                            <div style="font-size: 13px; color: #666; margin-top: 4px;">
                                ${dept ? dept.name : '-'} | ${leave.startDate} ถึง ${leave.endDate}
                            </div>
                        </div>
                        <div class="card-actions">
                            <span class="badge ${badgeClass}">${statusText}</span>
                            <button class="btn-danger btn-small" onclick="deleteLeave(${leave.id})">ลบ</button>
                        </div>
                    </div>
                    ${leave.reason ? `<div style="font-size: 14px; color: #666; margin-top: 8px;">เหตุผล: ${leave.reason}</div>` : ''}
                    ${leave.affectedDuties.length > 0 ? `
                        <div style="margin-top: 10px; font-size: 13px;">
                            <strong>ภาระงานที่กระทบ:</strong>
                            ${leave.affectedDuties.map(ad => {
                                const duty = dept ? dept.duties.find(d => d.id === ad.dutyId) : null;
                                if (!duty) return '<div style="margin-top:4px;">• ไม่พบภาระงาน</div>';
                                
                                // คำนวณ worst case remaining สำหรับ duty นี้
                                const dayKeys = ['sun','mon','tue','wed','thu','fri','sat'];
                                let worstRemaining = Infinity;
                                let worstMin = 0;
                                let worstTotal = 0;
                                const startDate = new Date(leave.startDate + 'T00:00:00');
                                const endDate = new Date(leave.endDate + 'T00:00:00');
                                
                                for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate()+1)) {
                                    const dayKey = dayKeys[d.getDay()];
                                    const total = calculateActualDoctors(duty.id, dayKey);
                                    const min = duty.weeklyMin[dayKey] || 0;
                                    if (total === 0 && min === 0) continue;
                                    
                                    const leavesOnDay = leaves.filter(l => {
                                        const lS = new Date(l.startDate + 'T00:00:00');
                                        const lE = new Date(l.endDate + 'T00:00:00');
                                        if (!(d >= lS && d <= lE)) return false;
                                        
                                        // เช็คว่า duty นี้ถูก affect และไม่มีคนมาแทน
                                        const affectedDuty = l.affectedDuties.find(ld => ld.dutyId === duty.id);
                                        return affectedDuty && !affectedDuty.hasReplacement;
                                    }).length;
                                    
                                    const rem = total - leavesOnDay;
                                    if (rem < worstRemaining) {
                                        worstRemaining = rem;
                                        worstMin = min;
                                        worstTotal = total;
                                    }
                                }
                                
                                if (worstRemaining === Infinity) worstRemaining = 0;
                                
                                let icon = '';
                                
                                if (ad.hasReplacement) {
                                    // ถ้ามีคนมาแทน จะไม่กระทบ
                                    const replacementDoc = ad.replacementDoctorId ? doctors.find(d => d.id === ad.replacementDoctorId) : null;
                                    const replacementName = replacementDoc ? replacementDoc.name : 'ไม่ระบุ';
                                    icon = '<span style="color:#48bb78;">✓ มีคนมาแทน: ' + replacementName + '</span>';
                                } else if (worstRemaining < worstMin && worstRemaining < 2) {
                                    icon = '<span style="color:#e53e3e;">🚨 วิกฤต (เหลือ ' + worstRemaining + '/' + worstMin + ')</span>';
                                } else if (worstRemaining < worstMin) {
                                    icon = '<span style="color:#ed8936;">⚠️ เตือน (เหลือ ' + worstRemaining + '/' + worstMin + ')</span>';
                                } else {
                                    icon = '<span style="color:#48bb78;">✓ ปกติ (เหลือ ' + worstRemaining + '/' + worstMin + ')</span>';
                                }
                                
                                return '<div style="margin-top: 4px;">• ' + duty.name + ' ' + icon + '</div>';
                            }).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('');
    }

    function renderOverview() {
        const container = document.getElementById('overviewContent');
        
        const totalDepartments = departments.length;
        const totalDoctors = doctors.length;
        const totalLeaves = leaves.length;
        
        console.log('DEBUG renderOverview:', {
            totalDepartments,
            totalDoctors,
            totalLeaves,
            doctorsArray: doctors,
            leavesArray: leaves
        });
        
        // วิเคราะห์ภาระงาน แบบใหม่ที่คำนวณจากจำนวนที่มา - คนลา
        // จัดกลุ่มตามวัน (date+duty) เพื่อไม่ให้ duplicate
        const issueMap = {}; // key = 'date-deptId-dutyId'
        
        // วนทุกแผนก และ duty
        departments.forEach(dept => {
            dept.duties.forEach(duty => {
                // หา date range ทั้งหมดที่มีคนลา
                const allDates = new Set();
                leaves.forEach(leave => {
                    const affectedDuty = leave.affectedDuties.find(ad => ad.dutyId === duty.id);
                    if (!affectedDuty) return;
                    
                    const start = new Date(leave.startDate + 'T00:00:00');
                    const end = new Date(leave.endDate + 'T00:00:00');
                    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                        allDates.add(d.toISOString().split('T')[0]);
                    }
                });
                
                // วนทุกวันที่มีคนลา
                allDates.forEach(dateStr => {
                    const d = new Date(dateStr + 'T00:00:00');
                    const dayKey = ['sun','mon','tue','wed','thu','fri','sat'][d.getDay()];
                    const total = calculateActualDoctors(duty.id, dayKey);
                    const min = duty.weeklyMin[dayKey] || 0;
                    if (total === 0 && min === 0) return; // วันหยุด
                    
                    // นับคนที่ลาในวันนี้ (ไม่นับคนที่มีคนมาแทน)
                    const leavesOnDay = leaves.filter(l => {
                        const lS = new Date(l.startDate + 'T00:00:00');
                        const lE = new Date(l.endDate + 'T00:00:00');
                        if (!(d >= lS && d <= lE)) return false;
                        
                        const ad = l.affectedDuties.find(ld => ld.dutyId === duty.id);
                        return ad && !ad.hasReplacement;
                    }).length;
                    
                    const remaining = total - leavesOnDay;
                    
                    if (remaining < min) {
                        const key = `${dateStr}-${dept.id}-${duty.id}`;
                        const issue = {
                            deptName: dept.name,
                            dutyName: duty.name,
                            date: dateStr,
                            total: total,
                            remaining: remaining,
                            min: min,
                            message: `${dateStr}: ${duty.name} เหลือ ${remaining}/${min} คน`
                        };
                        
                        if (!issueMap[key]) {
                            issueMap[key] = issue;
                        }
                    }
                });
            });
        });
        
        // แยก critical และ warning
        let criticalIssues = [];
        let warnings = [];
        
        Object.values(issueMap).forEach(issue => {
            if (issue.remaining < 2) {
                issue.message += ' (วิกฤต!)';
                criticalIssues.push(issue);
            } else {
                warnings.push(issue);
            }
        });
        
        container.innerHTML = `
            <div class="grid-3">
                <div class="card">
                    <div style="text-align: center;">
                        <div style="font-size: 48px; margin-bottom: 10px;">▪️</div>
                        <div style="font-size: 32px; font-weight: 600; color: #667eea;">${totalDepartments}</div>
                        <div style="color: #666;">จำนวนแผนก</div>
                    </div>
                </div>
                
                <div class="card">
                    <div style="text-align: center;">
                        <div style="font-size: 48px; margin-bottom: 10px;">👤</div>
                        <div style="font-size: 32px; font-weight: 600; color: #48bb78;">${totalDoctors}</div>
                        <div style="color: #666;">จำนวนแพทย์</div>
                    </div>
                </div>
                
                <div class="card">
                    <div style="text-align: center;">
                        <div style="font-size: 48px; margin-bottom: 10px;">📅</div>
                        <div style="font-size: 32px; font-weight: 600; color: #ed8936;">${totalLeaves}</div>
                        <div style="color: #666;">การลางาน</div>
                    </div>
                </div>
            </div>
            
            ${criticalIssues.length > 0 ? `
                <div style="margin-top: 20px;">
                    <h3 style="color: #e53e3e; margin-bottom: 15px;">🚨 ปัญหาวิกฤต (Critical - เหลือน้อยกว่า 2 คน)</h3>
                    ${criticalIssues.map(issue => `
                        <div class="list-item" style="border-left: 4px solid #e53e3e;">
                            <div class="list-item-content">
                                <div class="list-item-name">❌ ${issue.message}</div>
                                <div class="list-item-info">
                                    <span class="badge badge-danger">${issue.deptName}</span>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            ` : ''}
            
            ${warnings.length > 0 ? `
                <div style="margin-top: 20px;">
                    <h3 style="color: #ed8936; margin-bottom: 15px;">⚠️ คำเตือน (Warning - น้อยกว่าขั้นต่ำแต่ยังมี ≥ 2 คน)</h3>
                    ${warnings.map(warn => `
                        <div class="list-item" style="border-left: 4px solid #ed8936;">
                            <div class="list-item-content">
                                <div class="list-item-name">⚠️ ${warn.message}</div>
                                <div class="list-item-info">
                                    <span class="badge badge-warning">${warn.deptName}</span>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            ` : ''}
            
            ${criticalIssues.length === 0 && warnings.length === 0 ? `
                <div style="text-align: center; padding: 40px; color: #48bb78; margin-top: 20px;">
                    <div style="font-size: 48px; margin-bottom: 10px;">✅</div>
                    <div style="font-size: 18px; font-weight: 600;">ทุกอย่างปกติ ไม่มีปัญหา</div>
                </div>
            ` : ''}
            
            <div style="margin-top: 30px;">
                <h3 style="margin-bottom: 15px;">📋 รายละเอียดแต่ละแผนก</h3>
                ${departments.map(dept => {
                    const deptDoctors = doctors.filter(d => d.departmentId === dept.id);
                    return `
                        <div class="card">
                            <div style="font-weight: 600; color: #333; margin-bottom: 10px;">
                                ▪️ ${dept.name}
                            </div>
                            <div style="font-size: 14px; color: #666;">
                                จำนวนแพทย์: ${deptDoctors.length} คน
                            </div>
                            ${dept.duties.length > 0 ? `
                                <div style="margin-top: 10px; font-size: 14px;">
                                    <div style="font-weight: 600; margin-bottom: 5px;">ภาระงาน:</div>
                                    ${dept.duties.map(duty => {
                                        const minWeek = duty.weeklyMin ? Object.values(duty.weeklyMin).reduce((a, b) => a + b, 0) : 0;
                                        return `<div style="padding: 5px 0;">• ${duty.name} (ต้องการขั้นต่ำ ${minWeek} เที่ยว/สัปดาห์)</div>`;
                                    }).join('')}
                                </div>
                            ` : '<div style="margin-top: 10px; font-size: 14px; color: #999;">ยังไม่มีภาระงาน</div>'}
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    }
    
    // โหลดข้อมูลเมื่อเริ่มต้น
    loadData();
    bindLeaveDoctorEvent();
</script>
