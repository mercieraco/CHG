<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบจัดการแพทย์โรงพยาบาล</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
font-family: ‘Segoe UI’, Tahoma, Geneva, Verdana, sans-serif;
background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
min-height: 100vh;
padding: 20px;
}

.container {
max-width: 1400px;
margin: 0 auto;
background: white;
border-radius: 15px;
padding: 30px;
box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h1 { color: #667eea; margin-bottom: 6px; text-align: center; }
.subtitle { text-align: center; color: #666; margin-bottom: 28px; }

/* ===== TABS ===== */
.tabs {
display: flex;
gap: 4px;
margin-bottom: 28px;
border-bottom: 2px solid #e0e0e0;
}

.tab {
padding: 12px 22px;
background: none;
border: none;
border-bottom: 3px solid transparent;
cursor: pointer;
font-size: 15px;
font-weight: 600;
color: #666;
transition: color 0.2s;
user-select: none;
}

.tab:hover { color: #667eea; }
.tab.active { color: #667eea; border-bottom-color: #667eea; }

.tab-content { display: none; }
.tab-content.active { display: block; }

/* ===== SECTION ===== */
.section {
background: #f8f9fa;
padding: 20px;
border-radius: 10px;
margin-bottom: 20px;
}

.section-title {
font-size: 17px;
font-weight: 600;
color: #333;
margin-bottom: 14px;
}

/* ===== FORM ===== */
.form-group { margin-bottom: 14px; }

label {
display: block;
margin-bottom: 6px;
color: #333;
font-weight: 600;
font-size: 14px;
}

input, select, textarea {
width: 100%;
padding: 10px 12px;
border: 2px solid #e0e0e0;
border-radius: 8px;
font-size: 15px;
transition: border-color 0.2s;
font-family: inherit;
}

input:focus, select:focus, textarea:focus {
outline: none;
border-color: #667eea;
}

/* ===== BUTTONS ===== */
button {
padding: 10px 20px;
border: none;
border-radius: 8px;
font-size: 14px;
font-weight: 600;
cursor: pointer;
transition: all 0.2s;
font-family: inherit;
}

.btn-primary { background:#667eea; color:#fff; }
.btn-primary:hover { background:#5568d3; }

.btn-success { background:#48bb78; color:#fff; }
.btn-success:hover { background:#38a169; }

.btn-danger { background:#f56565; color:#fff; }
.btn-danger:hover { background:#e53e3e; }

.btn-sm { padding: 5px 10px; font-size: 12px; }

.btn-row { display: flex; gap: 8px; margin-top: 18px; }

/* ===== CARD ===== */
.card {
background: white;
border: 2px solid #e0e0e0;
border-radius: 8px;
padding: 14px;
margin-bottom: 12px;
}

.card-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 8px;
}

.card-title { font-size: 15px; font-weight: 600; color: #333; }
.card-actions { display: flex; gap: 6px; }

/* ===== LIST ITEM ===== */
.list-item {
display: flex;
justify-content: space-between;
align-items: center;
padding: 10px 12px;
background: white;
border: 1px solid #e0e0e0;
border-radius: 6px;
margin-bottom: 6px;
}

.list-item-name { font-weight: 600; color: #333; margin-bottom: 3px; }
.list-item-info { font-size: 13px; color: #666; }

/* ===== BADGE ===== */
.badge {
display: inline-block;
padding: 3px 9px;
border-radius: 12px;
font-size: 12px;
font-weight: 600;
}

.badge-primary { background:#bee3f8; color:#2c5282; }
.badge-success { background:#c6f6d5; color:#22543d; }
.badge-warning { background:#feebc8; color:#7c2d12; }
.badge-danger { background:#fed7d7; color:#742a2a; }

/* ===== DUTY ITEM ===== */
.duty-item {
background: #eef2f7;
padding: 10px 12px;
border-radius: 6px;
margin-bottom: 8px;
border-left: 3px solid #667eea;
}

.duty-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 8px;
}

.duty-name { font-weight: 600; color:#333; }

/* ===== WEEKLY GRID ===== */
.weekly-grid {
display: grid;
grid-template-columns: repeat(7, 1fr);
gap: 6px;
}

.day-col { text-align: center; }

.day-col .day-label {
font-size: 11px;
font-weight: 700;
color: #555;
margin-bottom: 4px;
display: block;
}

.day-col .sub-label {
font-size: 9px;
color: #999;
display: block;
margin-top: 2px;
}

.day-col input {
padding: 5px 2px;
font-size: 13px;
text-align: center;
border-radius: 4px;
margin-top: 2px;
}

/* ===== INPUT ROW ===== */
.input-row { display: flex; gap: 10px; }
.input-row input { flex: 1; }

/* ===== ALERT ===== */
.alert {
padding: 12px 16px;
border-radius: 8px;
margin-bottom: 18px;
display: none;
font-size: 14px;
}

.alert-success { background:#c6f6d5; color:#22543d; border:1px solid #9ae6b4; }
.alert-info { background:#bee3f8; color:#2c5282; border:1px solid #90cdf4; }

/* ===== EMPTY STATE ===== */
.empty-state { text-align: center; padding: 36px; color: #999; }
.empty-state-icon { font-size: 40px; margin-bottom: 8px; }

/* ===== GRID LAYOUTS ===== */
.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }

/* ===== CALENDAR ===== */
.calendar-wrap {
background: white;
border: 2px solid #e0e0e0;
border-radius: 8px;
padding: 14px;
}

.cal-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 12px;
}

.cal-title { font-weight: 600; font-size: 15px; }

.cal-grid {
display: grid;
grid-template-columns: repeat(7, 1fr);
gap: 3px;
}

.cal-day-hdr {
text-align: center;
font-size: 11px;
font-weight: 700;
color: #666;
padding: 6px 0;
}

.cal-day {
aspect-ratio: 1;
display: flex;
align-items: center;
justify-content: center;
font-size: 13px;
border: 1px solid #e8e8e8;
border-radius: 4px;
cursor: pointer;
transition: background 0.15s, border-color 0.15s;
position: relative;
user-select: none;
}

.cal-day:hover { background:#f0f4ff; border-color:#667eea; }
.cal-day.other { color:#ccc; cursor:default; }
.cal-day.other:hover { background:none; border-color:#e8e8e8; }

.cal-day.start, .cal-day.end {
background: #667eea;
color: #fff;
border-color: #667eea;
font-weight: 700;
}

.cal-day.in-range {
background: #dce8ff;
border-color: #b3ceff;
}

.cal-day.leave-mark {
border-bottom: 3px solid #f56565;
}

/* ===== DATE INFO BOX ===== */
.date-info-box {
background: #eef4ff;
border: 1px solid #c3deff;
border-radius: 6px;
padding: 10px 12px;
font-size: 13px;
color: #2c5282;
margin-top: 10px;
min-height: 60px;
}

/* ===== LEAVE SECTION LAYOUT ===== */
.leave-top {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 20px;
}

/* ===== FILTER BAR ===== */
.filter-bar {
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 14px;
}

.filter-bar label { margin:0; white-space:nowrap; }
.filter-bar select { flex:1; max-width:280px; }

/* ===== MODAL ===== */
.modal-backdrop {
display: none;
position: fixed;
inset: 0;
background: rgba(0,0,0,0.45);
z-index: 100;
align-items: center;
justify-content: center;
padding: 20px;
}

.modal-backdrop.active { display: flex; }

.modal-box {
background: #fff;
border-radius: 12px;
padding: 28px;
width: 100%;
max-width: 860px;
max-height: 85vh;
overflow-y: auto;
}

.modal-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 18px;
}

.modal-title { font-size: 18px; font-weight: 600; color:#333; }

.modal-close {
background: none;
border: none;
font-size: 22px;
cursor: pointer;
color: #999;
padding: 0;
line-height: 1;
}

.modal-close:hover { color:#333; }

@media (max-width:720px) {
.leave-top, .grid-3 { grid-template-columns: 1fr; }
.weekly-grid { grid-template-columns: repeat(4,1fr); }
}
</style>

</head>
<body>
<div class="container">
    <h1>🏥 ระบบจัดการแพทย์โรงพยาบาล</h1>
    <p class="subtitle">Hospital Doctor Management System</p>

```
<div id="alertBox" class="alert"></div>

<!-- TABS -->
<div class="tabs" id="tabBar"></div>

<!-- TAB CONTENTS -->
<div id="tab-overview" class="tab-content active"></div>
<div id="tab-leave"    class="tab-content"></div>
<div id="tab-departments" class="tab-content"></div>
<div id="tab-doctors"  class="tab-content"></div>
```

</div>

<!-- DUTY MODAL -->

<div id="dutyModal" class="modal-backdrop">
    <div class="modal-box">
        <div class="modal-header">
            <span class="modal-title">เพิ่มภาระงานใหม่</span>
            <button class="modal-close" id="dutyModalClose">×</button>
        </div>
        <div class="form-group">
            <label>ชื่อภาระงาน</label>
            <input type="text" id="modalDutyName" placeholder="เช่น โอพีดีผู้ป่วยนอก">
        </div>
        <p style="font-size:12px;color:#888;margin-bottom:8px;">บนสุด = จำนวนแพทย์ที่มาทำงาน | ล่างสุด = จำนวนแพทย์ขั้นต่ำ</p>
        <div class="weekly-grid" id="modalWeeklyGrid"></div>
        <div class="btn-row">
            <button class="btn-primary" id="saveDutyBtn">บันทึก</button>
            <button class="btn-danger"  id="cancelDutyBtn">ยกเลิก</button>
        </div>
    </div>
</div>

<script>
// ======================================================
// DATA
// ======================================================
let departments = [];
let doctors     = [];
let leaves      = [];

const DAYS = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_LABELS = ['จ','อ','พ','พฤ','ศ','ส','อา'];
// JS getDay(): 0=Sun 1=Mon … 6=Sat  →  map to our key
const JS_DAY_TO_KEY = ['sun','mon','tue','wed','thu','fri','sat'];

const MONTH_TH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                  'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

// ======================================================
// PERSIST
// ======================================================
function loadData() {
    try { departments = JSON.parse(localStorage.getItem('hosp_dept'))  || []; } catch(e) {}
    try { doctors     = JSON.parse(localStorage.getItem('hosp_doc'))   || []; } catch(e) {}
    try { leaves      = JSON.parse(localStorage.getItem('hosp_leave')) || []; } catch(e) {}
}

function saveData() {
    localStorage.setItem('hosp_dept',  JSON.stringify(departments));
    localStorage.setItem('hosp_doc',   JSON.stringify(doctors));
    localStorage.setItem('hosp_leave', JSON.stringify(leaves));
}

// ======================================================
// ALERT
// ======================================================
let alertTimer = null;
function showAlert(msg, type='success') {
    const el = document.getElementById('alertBox');
    el.className = 'alert alert-' + type;
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(alertTimer);
    alertTimer = setTimeout(() => el.style.display = 'none', 3000);
}

// ======================================================
// TABS  (event delegation — no reliance on event.target)
// ======================================================
const TAB_DEFS = [
    { key: 'overview',    label: '📊 ภาพรวม' },
    { key: 'leave',       label: '📅 ลางาน' },
    { key: 'departments', label: '📋 จัดการแผนก' },
    { key: 'doctors',     label: '👤 จัดการแพทย์' }
];

function buildTabBar() {
    const bar = document.getElementById('tabBar');
    bar.innerHTML = TAB_DEFS.map((t,i) =>
        `<button class="tab ${i===0?'active':''}" data-tab="${t.key}">${t.label}</button>`
    ).join('');
}

document.getElementById('tabBar').addEventListener('click', function(e) {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    const key = btn.dataset.tab;
    if (!key) return;

    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');

    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + key).classList.add('active');

    if (key === 'overview')     renderOverview();
    if (key === 'leave')        renderLeaveTab();
    if (key === 'departments')  renderDepartmentsTab();
    if (key === 'doctors')      renderDoctorsTab();
});

// ======================================================
// DEPARTMENTS TAB
// ======================================================
function renderDepartmentsTab() {
    const el = document.getElementById('tab-departments');

    let deptListHtml = departments.length === 0
        ? '<div class="empty-state"><div class="empty-state-icon">📁</div><p>ยังไม่มีแผนก</p></div>'
        : departments.map(dept => renderDeptCard(dept)).join('');

    el.innerHTML = `
        <div class="section">
            <div class="section-title">➕ เพิ่มแผนกใหม่</div>
            <div class="input-row">
                <input type="text" id="newDeptName" placeholder="ชื่อแผนก เช่น กระดูกและข้อ">
                <button class="btn-primary" id="addDeptBtn">เพิ่มแผนก</button>
            </div>
        </div>
        <div class="section">
            <div class="section-title">📂 รายการแผนก</div>
            <div id="deptList">${deptListHtml}</div>
        </div>`;

    // events
    document.getElementById('addDeptBtn').addEventListener('click', onAddDept);
    el.addEventListener('click', onDeptListClick);
}

function renderDeptCard(dept) {
    let dutiesHtml = '';
    if (dept.duties.length === 0) {
        dutiesHtml = '<p style="color:#999;font-size:13px;margin-top:6px;">ยังไม่มีภาระงาน คลิก "+ ภาระงาน"</p>';
    } else {
        dutiesHtml = dept.duties.map(duty => {
            let cols = DAYS.map((d, i) => `
                <div class="day-col">
                    <span class="day-label">${DAY_LABELS[i]}</span>
                    <input type="number" min="0" value="${duty.weeklyTotal[d]||0}"
                           data-dept="${dept.id}" data-duty="${duty.id}" data-day="${d}" data-field="total">
                    <span class="sub-label">มา</span>
                    <input type="number" min="0" value="${duty.weeklyMin[d]||0}"
                           data-dept="${dept.id}" data-duty="${duty.id}" data-day="${d}" data-field="min">
                    <span class="sub-label">ขั้นต่ำ</span>
                </div>`).join('');

            return `
                <div class="duty-item">
                    <div class="duty-header">
                        <span class="duty-name">• ${duty.name}</span>
                        <button class="btn-danger btn-sm" data-action="deleteDuty" data-dept="${dept.id}" data-duty="${duty.id}">ลบ</button>
                    </div>
                    <div class="weekly-grid">${cols}</div>
                </div>`;
        }).join('');
    }

    return `
        <div class="card" data-dept="${dept.id}">
            <div class="card-header">
                <span class="card-title">▪️ ${dept.name}</span>
                <div class="card-actions">
                    <button class="btn-success btn-sm" data-action="addDuty" data-dept="${dept.id}">+ ภาระงาน</button>
                    <button class="btn-danger  btn-sm" data-action="deleteDept" data-dept="${dept.id}">ลบแผนก</button>
                </div>
            </div>
            ${dutiesHtml}
        </div>`;
}

function onAddDept() {
    const input = document.getElementById('newDeptName');
    const name = input.value.trim();
    if (!name) { showAlert('กรุณากรอกชื่อแผนก','info'); return; }
    if (departments.find(d => d.name === name)) { showAlert('มีแผนกนี้แล้ว','info'); return; }
    departments.push({ id: Date.now(), name, duties: [] });
    saveData();
    input.value = '';
    showAlert(`เพิ่มแผนก "${name}" สำเร็จ`);
    renderDepartmentsTab();
}

function onDeptListClick(e) {
    // delegation for action buttons
    const btn = e.target.closest('[data-action]');
    if (!btn) {
        // เลือกเปลี่ยน input ใน weekly grid
        const inp = e.target.closest('input[data-field]');
        if (inp) onDutyInputChange(inp);
        return;
    }

    const action = btn.dataset.action;
    const deptId  = Number(btn.dataset.dept);
    const dutyId  = btn.dataset.duty ? Number(btn.dataset.duty) : null;

    if (action === 'deleteDept') {
        if (!confirm('ลบแผนกนี้ (พร้อมแพทย์ และภาระงาน)?')) return;
        departments = departments.filter(d => d.id !== deptId);
        doctors     = doctors.filter(d => d.departmentId !== deptId);
        saveData();
        showAlert('ลบแผนกสำเร็จ');
        renderDepartmentsTab();
    }

    if (action === 'addDuty') openDutyModal(deptId);

    if (action === 'deleteDuty') {
        if (!confirm('ลบภาระงานนี้?')) return;
        const dept = departments.find(d => d.id === deptId);
        if (dept) dept.duties = dept.duties.filter(d => d.id !== dutyId);
        saveData();
        showAlert('ลบภาระงานสำเร็จ');
        renderDepartmentsTab();
    }
}

function onDutyInputChange(inp) {
    const deptId  = Number(inp.dataset.dept);
    const dutyId  = Number(inp.dataset.duty);
    const day     = inp.dataset.day;
    const field   = inp.dataset.field;   // 'total' | 'min'
    const val     = parseInt(inp.value) || 0;

    const dept = departments.find(d => d.id === deptId);
    if (!dept) return;
    const duty = dept.duties.find(d => d.id === dutyId);
    if (!duty) return;

    if (field === 'total') duty.weeklyTotal[day] = val;
    else                   duty.weeklyMin[day]   = val;
    saveData();
}

// ======================================================
// DUTY MODAL
// ======================================================
let modalDeptId = null;

function openDutyModal(deptId) {
    modalDeptId = deptId;

    // สร้าง weekly grid ใน modal
    const grid = document.getElementById('modalWeeklyGrid');
    grid.innerHTML = DAYS.map((d, i) => `
        <div class="day-col">
            <span class="day-label">${DAY_LABELS[i]}</span>
            <input type="number" id="modal-total-${d}" min="0" value="0">
            <span class="sub-label">มา</span>
            <input type="number" id="modal-min-${d}"   min="0" value="0">
            <span class="sub-label">ขั้นต่ำ</span>
        </div>`).join('');

    document.getElementById('modalDutyName').value = '';
    document.getElementById('dutyModal').classList.add('active');
}

document.getElementById('dutyModalClose').addEventListener('click', closeDutyModal);
document.getElementById('cancelDutyBtn').addEventListener('click', closeDutyModal);
document.getElementById('dutyModal').addEventListener('click', function(e) {
    if (e.target === this) closeDutyModal();   // คลิก backdrop
});

function closeDutyModal() {
    document.getElementById('dutyModal').classList.remove('active');
    modalDeptId = null;
}

document.getElementById('saveDutyBtn').addEventListener('click', function() {
    const name = document.getElementById('modalDutyName').value.trim();
    if (!name) { showAlert('กรุณากรอกชื่อภาระงาน','info'); return; }

    const dept = departments.find(d => d.id === modalDeptId);
    if (!dept) return;

    const weeklyTotal = {}, weeklyMin = {};
    DAYS.forEach(d => {
        weeklyTotal[d] = parseInt(document.getElementById('modal-total-' + d).value) || 0;
        weeklyMin[d]   = parseInt(document.getElementById('modal-min-'   + d).value) || 0;
    });

    dept.duties.push({ id: Date.now(), name, weeklyTotal, weeklyMin });
    saveData();
    closeDutyModal();
    showAlert(`เพิ่มภาระงาน "${name}" สำเร็จ`);
    renderDepartmentsTab();   // re-render
});

// ======================================================
// DOCTORS TAB
// ======================================================
function renderDoctorsTab() {
    const el = document.getElementById('tab-doctors');

    const filterOpts = '<option value="">ทั้งหมด (All)</option>' +
        departments.map(d => `<option value="${d.id}">${d.name}</option>`).join('');

    const deptOpts = '<option value="">-- เลือกแผนก --</option>' +
        departments.map(d => `<option value="${d.id}">${d.name}</option>`).join('');

    el.innerHTML = `
        <div class="section">
            <div class="section-title">➕ เพิ่มแพทย์ใหม่</div>
            <div class="form-group">
                <label>ชื่อ-นามสกุล แพทย์</label>
                <input type="text" id="newDocName" placeholder="เช่น นพ.สมชาย ใจดี">
            </div>
            <div class="form-group">
                <label>แผนก</label>
                <select id="newDocDept">${deptOpts}</select>
            </div>
            <button class="btn-primary" id="addDocBtn">เพิ่มแพทย์</button>
        </div>
        <div class="section">
            <div class="section-title">👥 รายชื่อแพทย์</div>
            <div class="filter-bar">
                <label>กรอง:</label>
                <select id="filterDept">${filterOpts}</select>
            </div>
            <div id="docList"></div>
        </div>`;

    renderDocList();

    document.getElementById('addDocBtn').addEventListener('click', onAddDoc);
    document.getElementById('filterDept').addEventListener('change', renderDocList);
    document.getElementById('docList').addEventListener('click', onDocListClick);
}

function renderDocList() {
    const filterVal = document.getElementById('filterDept').value;
    let list = doctors;
    if (filterVal) list = doctors.filter(d => String(d.departmentId) === filterVal);

    const el = document.getElementById('docList');
    if (list.length === 0) {

function renderCalendar() {
const wrap = document.getElementById(‘calendarWrap’);
const firstDate  = new Date(calYear, calMonth, 1);

const daysInMon  = lastDate.getDate();

```
let html = `
    <div class="calendar-wrap">
        <div class="cal-header">
            <button class="btn-danger btn-sm" id="calPrev">◀</button>
            <span class="cal-title">${MONTH_TH[calMonth]} ${calYear + 543}</span>
            <button class="btn-success btn-sm" id="calNext">▶</button>
        </div>
        <div class="cal-grid">
            <div class="cal-day-hdr">อา</div>
            <div class="cal-day-hdr">จ</div>
            <div class="cal-day-hdr">อ</div>
            <div class="cal-day-hdr">พ</div>
            <div class="cal-day-hdr">พฤ</div>
            <div class="cal-day-hdr">ศ</div>
            <div class="cal-day-hdr">ส</div>`;

// blank cells before day 1
for (let i = 0; i < startDow; i++) {
    html += '<div class="cal-day other"></div>';
}

// วันของเดือน
for (let day = 1; day <= daysInMon; day++) {
    const ds = dateStr(calYear, calMonth + 1, day);
    let cls = 'cal-day';

    // ตรวจ leave mark (มีใครลาวันนี้?)
    if (isLeavedDate(ds)) cls += ' leave-mark';

    // ตรวจ selection
    if (ds === selStart && ds === selEnd) {
        cls += ' start end';
    } else if (ds === selStart) {
        cls += ' start';
    } else if (ds === selEnd) {
        cls += ' end';
    } else if (selStart && selEnd && ds > selStart && ds < selEnd) {
        cls += ' in-range';
    }

    html += `<div class="${cls}" data-date="${ds}">${day}</div>`;
}

html += '</div></div>';
wrap.innerHTML = html;

// events

document.getElementById('calNext').addEventListener('click', function() {

function renderOverview() {
const el = document.getElementById(‘tab-overview’);

```
// คำนวณ critical / warning
// สำหรับแต่ละ duty ในแต่ละวัน ตลอดช่วงที่มีคนลา
// เก็บ unique วัน+duty เพื่อไม่ duplicate

const issueMap = {};   // key = 'deptId-dutyId-date'

leaves.forEach(lv => {
    const doc  = doctors.find(d => d.id === lv.doctorId);
    const dept = doc ? departments.find(d => d.id === doc.departmentId) : null;
    if (!dept) return;

    lv.affectedDuties.forEach(ad => {
        const duty = dept.duties.find(d => d.id === ad.dutyId);
        if (!duty) return;

        // วนทุกวันในช่วง
        const start = new Date(lv.startDate + 'T00:00:00');
        const end   = new Date(lv.endDate   + 'T00:00:00');
        for (let cur = new Date(start); cur <= end; cur.setDate(cur.getDate()+1)) {
            const dayKey = JS_DAY_TO_KEY[cur.getDay()];
            const total  = duty.weeklyTotal[dayKey] || 0;
            const min    = duty.weeklyMin[dayKey]   || 0;
            if (total === 0 && min === 0) continue;   // วันหยุด

            const ds = cur.toISOString().split('T')[0];
            const key = `${dept.id}-${duty.id}-${ds}`;

            if (!issueMap[key]) {
                issueMap[key] = {
                    deptName: dept.name,
                    dutyName: duty.name,
                    date: ds,
                    total,
                    min,
                    leavedCount: 0
                };
            }
            issueMap[key].leavedCount++;
        }
    });
});

let criticals = [], warnings = [];
Object.values(issueMap).forEach(item => {
    const remaining = item.total - item.leavedCount;
    if (remaining >= item.min) return;   // ปกติ

    if (remaining < 2) {
        criticals.push(item);
    } else {
        warnings.push(item);
    }
});

// ── HTML ──
let warningSection = '', criticalSection = '';

if (criticals.length) {
    criticalSection = `
        <div style="margin-top:20px;">
            <h3 style="color:#e53e3e;margin-bottom:10px;">🚨 วิกฤต (เหลือน้อยกว่า 2 คน)</h3>
            ${criticals.map(c => `
                <div class="list-item" style="border-left:4px solid #e53e3e;">
                    <div>
                        <div class="list-item-name">❌ ${c.date} — ${c.dutyName}</div>
                        <div class="list-item-info">
                            <span class="badge badge-danger">${c.deptName}</span>
                            มี ${c.total} คน, ลา ${c.leavedCount} คน → เหลือ <strong style="color:#e53e3e;">${c.total - c.leavedCount} คน</strong> (ต้องการขั้นต่ำ ${c.min})
                        </div>
                    </div>
                </div>`).join('')}
        </div>`;
}

if (warnings.length) {
    warningSection = `
        <div style="margin-top:20px;">
            <h3 style="color:#ed8936;margin-bottom:10px;">⚠️ เตือน (น้อยกว่าขั้นต่ำ แต่ ≥ 2 คน)</h3>
            ${warnings.map(w => `
                <div class="list-item" style="border-left:4px solid #ed8936;">
                    <div>
                        <div class="list-item-name">⚠️ ${w.date} — ${w.dutyName}</div>
                        <div class="list-item-info">
                            <span class="badge badge-warning">${w.deptName}</span>
                            มี ${w.total} คน, ลา ${w.leavedCount} คน → เหลือ <strong style="color:#ed8936;">${w.total - w.leavedCount} คน</strong> (ต้องการขั้นต่ำ ${w.min})
                        </div>
                    </div>
                </div>`).join('')}
        </div>`;
}

let allOk = '';
if (!criticals.length && !warnings.length) {
    allOk = `<div style="text-align:center;padding:40px;color:#48bb78;margin-top:20px;">
        <div style="font-size:44px;">✅</div>
        <div style="font-size:17px;font-weight:600;">ทุกอย่างปกติ</div>
    </div>`;
}

// dept detail
let deptDetails = departments.map(dept => {
    const cnt = doctors.filter(d => d.departmentId === dept.id).length;
    let dutiesHtml = dept.duties.length
        ? dept.duties.map(dy => `<div style="padding:3px 0;font-size:13px;">• ${dy.name}</div>`).join('')
        : '<div style="font-size:13px;color:#999;">ไม่มีภาระงาน</div>';

    return `<div class="card">
        <div style="font-weight:600;color:#333;">▪️ ${dept.name} — แพทย์ ${cnt} คน</div>
        <div style="margin-top:6px;">${dutiesHtml}</div>
    </div>`;
}).join('');

el.innerHTML = `
    <div class="grid-3">
        <div class="card"><div style="text-align:center;">
            <div style="font-size:40px;">▪️</div>
            <div style="font-size:30px;font-weight:700;color:#667eea;">${departments.length}</div>
            <div style="color:#666;">แผนก</div>
        </div></div>
        <div class="card"><div style="text-align:center;">
            <div style="font-size:40px;">👤</div>
            <div style="font-size:30px;font-weight:700;color:#48bb78;">${doctors.length}</div>
            <div style="color:#666;">แพทย์</div>
        </div></div>
        <div class="card"><div style="text-align:center;">
            <div style="font-size:40px;">📅</div>
            <div style="font-size:30px;font-weight:700;color:#ed8936;">${leaves.length}</div>
            <div style="color:#666;">การลา</div>
        </div></div>
    </div>

    ${criticalSection}
    ${warningSection}
    ${allOk}

    <div style="margin-top:24px;">
        <h3 style="margin-bottom:10px;">📋 รายละเอียดแผนก</h3>
        ${deptDetails || '<div class="empty-state"><div class="empty-state-icon">📁</div><p>ยังไม่มีแผนก</p></div>'}
    </div>`;
```

function dateStr(y, m, d) {
return y + ‘-’ + String(m).padStart(2,‘0’) + ‘-’ + String(d).padStart(2,‘0’);
}

function isLeavedDate(ds) {
return leaves.some(lv => ds >= lv.startDate && ds <= lv.endDate);
}
