<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

            margin: 0;

```
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 600px;
        text-align: center;
    }

    .header {
        margin-bottom: 30px;
    }

    .header h1 {
        color: #333;
        font-size: 32px;
        margin-bottom: 10px;
    }

    .header p {
        color: #666;
        font-size: 16px;
    }

    .user-info {
        background: #f5f5f5;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 30px;
    }

    .user-info h2 {
        color: #11998e;
        font-size: 20px;
        margin-bottom: 10px;
    }

    .user-info p {
        color: #666;
        font-size: 14px;
    }

    .menu-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 30px;
    }

    .btn {
        padding: 15px 30px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        text-decoration: none;
        display: inline-block;
    }

    .btn-menu {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 40px 20px;
        font-size: 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }

    .btn-menu:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }

    .btn-menu .icon {
        font-size: 48px;
    }

    .btn-back {
        background: #f5f5f5;
        color: #666;
        width: 100%;
    }

    .btn-back:hover {
        background: #e0e0e0;
    }

    @media (max-width: 600px) {
        .menu-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
```

</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 จัดการแผนกและแพทย์</h1>
            <p>เพิ่ม/ลบ แผนกและแพทย์ในระบบ</p>
        </div>

```
    <div class="user-info">
        <h2>ยินดีต้อนรับ</h2>
        <p id="userDisplay">กำลังโหลดข้อมูล...</p>
    </div>

    <div class="menu-grid">
        <button onclick="alert('ฟีเจอร์เพิ่มแผนก - กำลังพัฒนา')" class="btn btn-menu">
            <span class="icon">🏥</span>
            <span>เพิ่มแผนก</span>
        </button>
        <button onclick="alert('ฟีเจอร์เพิ่มแพทย์ - กำลังพัฒนา')" class="btn btn-menu">
            <span class="icon">👨‍⚕️</span>
            <span>เพิ่มแพทย์</span>
        </button>
    </div>

    <button onclick="window.location.href='dev.html'" class="btn btn-back">← กลับไปหน้า Admin</button>
</div>

<script>
    // ตรวจสอบการ login
    window.onload = function() {
        const loggedIn = sessionStorage.getItem('loggedIn');
        const username = sessionStorage.getItem('username');
        const role = sessionStorage.getItem('role');

        if (!loggedIn || role !== 'admin') {
            // ถ้ายังไม่ได้ login หรือไม่ใช่ admin ให้กลับไปหน้า login
            window.location.href = 'index.html';
            return;
        }

        // แสดงข้อมูลผู้ใช้
        document.getElementById('userDisplay').textContent = `คุณ ${username} (Admin)`;
    };
</script>
```

</body>
</html>
