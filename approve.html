    <!-- เลือกแผนก -->
    <div class="form-group">
        <label>เลือกแผนก</label>
        <select id="departmentSelect" onchange="loadDepartmentData()">
            <option value="">-- ทุกแผนก --</option>
        </select>
    </div>

    <!-- ปฏิทิน -->
    <div class="calendar-container">
        <div class="calendar-header">
            <div class="month-nav">
                <button onclick="previousMonth()">◀ เดือนก่อน</button>
                <span id="currentMonth"></span>
                <button onclick="nextMonth()">เดือนถัดไป ▶</button>
            </div>
        </div>
        <!-- หัวตารางวัน -->
        <div class="calendar-weekdays">
            <div class="calendar-weekday">จ</div>
            <div class="calendar-weekday">อ</div>
            <div class="calendar-weekday">พ</div>
            <div class="calendar-weekday">พฤ</div>
            <div class="calendar-weekday">ศ</div>
            <div class="calendar-weekday weekend">ส</div>
            <div class="calendar-weekday weekend">อา</div>
        </div>
        <div class="calendar" id="calendar"></div>
    </div>

    <!-- รายการรออนุมัติ -->
    <div class="approval-list">
        <h2>รายการรออนุมัติ (<span id="pendingCount">0</span>)</h2>
        <div id="approvalItems">
            <div class="empty-message">ไม่มีรายการรออนุมัติ</div>
        </div>
    </div>

    <button onclick="window.location.href='dev.html'" class="btn-back">← กลับหน้าหลัก</button>
</div>

<script>
    // ตรวจสอบ login
    window.onload = function() {
        const loggedIn = sessionStorage.getItem('loggedIn');
        const role = sessionStorage.getItem('role');

        if (!loggedIn || role !== 'admin') {
            window.location.href = 'index.html';
            return;
        }

        loadDepartments();
        renderCalendar();
        loadPendingApprovals();
    };

    const API_URL = 'https://approval-worker.9vk92zm5z2.workers.dev';
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();

    // โหลดรายการแผนก
    async function loadDepartments() {
        try {
            const response = await fetch(`${API_URL}/api/departments`);
            const data = await response.json();
            
            const select = document.getElementById('departmentSelect');
            data.data.forEach(dept => {
                const option = document.createElement('option');
                option.value = dept.id;
                option.textContent = dept.name;
                select.appendChild(option);
            });
        } catch (error) {
            console.error('Load departments error:', error);
        }
    }

    // โหลดข้อมูลตามแผนก
    async function loadDepartmentData() {
        const departmentId = document.getElementById('departmentSelect').value;
        
        if (departmentId) {
            await loadDepartmentLeaves(departmentId);
        } else {
            // ถ้าเลือก "ทุกแผนก" ให้โหลดทุกแผนก
            departmentLeaves = [];
        }
        
        renderCalendar();
        loadPendingApprovals();
    }

    let departmentLeaves = [];

    // โหลดการลาของแผนก
    async function loadDepartmentLeaves(departmentId) {
        try {
            const response = await fetch(`${API_URL}/api/leaves/department/${departmentId}`);
            const data = await response.json();
            
            if (response.ok && data.success) {
                departmentLeaves = data.data;
            } else {
                console.error('Load leaves error:', data.message);
                departmentLeaves = [];
            }
        } catch (error) {
            console.error('Load leaves error:', error);
            departmentLeaves = [];
        }
    }

    // แสดงปฏิทิน (read-only)
    function renderCalendar() {
        const calendar = document.getElementById('calendar');
        const monthDisplay = document.getElementById('currentMonth');
        
        const firstDay = new Date(currentYear, currentMonth, 1);
        const lastDay = new Date(currentYear, currentMonth + 1, 0);
        const daysInMonth = lastDay.getDate();
        let startDay = firstDay.getDay();
        
        // แปลงให้จันทร์ = 0, อาทิตย์ = 6
        startDay = (startDay === 0) ? 6 : startDay - 1;
        
        const thaiMonths = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
                           'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        
        monthDisplay.textContent = `${thaiMonths[currentMonth]} ${currentYear + 543}`;
        
        let html = '';
        
        // ช่องว่าง
        for (let i = 0; i < startDay; i++) {
            html += '<div class="calendar-day empty"></div>';
        }
        
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        
        // วันในเดือน
        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(currentYear, currentMonth, day);
            let dayOfWeek = date.getDay();
            
            // แปลงให้จันทร์ = 0, อาทิตย์ = 6
            dayOfWeek = (dayOfWeek === 0) ? 6 : dayOfWeek - 1;
            
            const dateStr = formatDate(date);
            let classes = ['calendar-day'];
            
            // เสาร์ (5) และอาทิตย์ (6)
            if (dayOfWeek === 5 || dayOfWeek === 6) {
                classes.push('weekend');
            }
            
            if (date.toDateString() === today.toDateString()) {
                classes.push('today');
            }
            
            if (date < today) {
                classes.push('past-date');
            }
            
            // คำนวณสีตามการลา
            const colorClass = calculateColorClass(dateStr);
            if (colorClass) {
                classes.push(colorClass);
            }
            
            html += `<div class="${classes.join(' ')}">${day}</div>`;
        }
        
        calendar.innerHTML = html;
    }

    // ฟังก์ชัน format date เป็น YYYY-MM-DD
    function formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    // คำนวณสีตามการลา
    function calculateColorClass(dateStr) {
        const leavesOnDate = departmentLeaves.filter(leave => 
            dateStr >= leave.start_date && dateStr <= leave.end_date
        );
        
        if (leavesOnDate.length === 0) return null;
        
        // นับประเภทการลา
        const leaveTypes = { green: 0, yellow: 0, approved: 0, rejected: 0 };
        
        leavesOnDate.forEach(leave => {
            if (leave.approval_status === 'approved') {
                leaveTypes.approved++;
            } else if (leave.approval_status === 'rejected') {
                leaveTypes.rejected++;
            } else if (leave.delegation_type === 'none') {
                leaveTypes.yellow++;
            } else {
                leaveTypes.green++;
            }
        });
        
        // ลำดับความสำคัญของสี
        if (leaveTypes.approved > 0) return 'approved';  // ดำ
        if (leaveTypes.rejected > 0) return 'rejected';  // ขาว กรอบดำ
        
        // ซ้อนทับ
        if (leaveTypes.green + leaveTypes.yellow > 1) {
            if (leaveTypes.yellow > 0) {
                return 'overlap-no-delegation';  // ส้ม
            } else {
                return 'overlap';  // แดง
            }
        }
        
        // เดี่ยว
        if (leaveTypes.green === 1) return 'on-leave';  // เขียว
        if (leaveTypes.yellow === 1) return 'no-delegation';  // เหลือง
        
        return null;
    }

    function previousMonth() {
        currentMonth--;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }
        renderCalendar();
    }

    function nextMonth() {
        currentMonth++;
        if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        renderCalendar();
    }

    // โหลดรายการรออนุมัติ
    async function loadPendingApprovals() {
        const container = document.getElementById('approvalItems');
        const countSpan = document.getElementById('pendingCount');
        const departmentId = document.getElementById('departmentSelect').value;
        
        try {
            let url = `${API_URL}/api/leaves/pending`;
            if (departmentId) {
                url += `?department_id=${departmentId}`;
            }
            
            const response = await fetch(url);
            const data = await response.json();
            
            if (response.ok && data.success && data.data.length > 0) {
                countSpan.textContent = data.data.length;
                
                let html = '';
                data.data.forEach(leave => {
                    const startDate = formatDateThai(leave.start_date);
                    const endDate = formatDateThai(leave.end_date);
                    const days = Math.ceil((new Date(leave.end_date) - new Date(leave.start_date)) / (1000 * 60 * 60 * 24)) + 1;
                    
                    html += `
                        <div class="approval-item">
                            <div class="approval-item-header">
                                <div class="approval-item-top">
                                    <div class="approval-item-info">
                                        <h3>${leave.doctor_name} (${leave.department_name})</h3>
                                        <p>📅 ${startDate} - ${endDate} (${days} วัน)</p>
                                        <p>💬 เหตุผล: ${leave.no_delegation_reason || '-'}</p>
                                    </div>
                                    <button class="btn-view-department" onclick="viewDepartment(${leave.department_id}); event.stopPropagation();">
                                        📍 ${leave.department_name}
                                    </button>
                                </div>
                                <div class="approval-buttons">
                                    <button class="btn-approve" onclick="approveLeave(${leave.id})">✓ อนุมัติ</button>
                                    <button class="btn-reject" onclick="rejectLeave(${leave.id})">✗ ไม่อนุมัติ</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
            } else {
                container.innerHTML = '<div class="empty-message">ไม่มีรายการรออนุมัติ</div>';
                countSpan.textContent = '0';
            }
        } catch (error) {
            console.error('Load pending approvals error:', error);
            container.innerHTML = '<div class="empty-message">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>';
            countSpan.textContent = '0';
        }
    }

    // Format วันที่เป็นภาษาไทย
    function formatDateThai(dateStr) {
        const date = new Date(dateStr);
        const day = date.getDate();
        const month = date.getMonth() + 1;
        const year = date.getFullYear() + 543;
        return `${day}/${month}/${year}`;
    }

    // อนุมัติ
    async function approveLeave(leaveId) {
        if (!confirm('ยืนยันการอนุมัติ?')) return;
        
        try {
            const response = await fetch(`${API_URL}/api/leaves/${leaveId}/approve`, {
                method: 'POST'
            });
            const data = await response.json();
            
            if (response.ok && data.success) {
                alert('✓ อนุมัติสำเร็จ');
                await loadDepartmentData();  // โหลดข้อมูลใหม่
            } else {
                alert('เกิดข้อผิดพลาด: ' + data.message);
            }
        } catch (error) {
            console.error('Approve error:', error);
            alert('เกิดข้อผิดพลาดในการอนุมัติ');
        }
    }

    // ไม่อนุมัติ
    async function rejectLeave(leaveId) {
        if (!confirm('ยืนยันการไม่อนุมัติ?')) return;
        
        try {
            const response = await fetch(`${API_URL}/api/leaves/${leaveId}/reject`, {
                method: 'POST'
            });
            const data = await response.json();
            
            if (response.ok && data.success) {
                alert('✓ ไม่อนุมัติสำเร็จ');
                await loadDepartmentData();  // โหลดข้อมูลใหม่
            } else {
                alert('เกิดข้อผิดพลาด: ' + data.message);
            }
        } catch (error) {
            console.error('Reject error:', error);
            alert('เกิดข้อผิดพลาดในการไม่อนุมัติ');
        }
    }

    // ดูแผนก - เลือก dropdown อัตโนมัติ
    function viewDepartment(departmentId) {
        const select = document.getElementById('departmentSelect');
        select.value = departmentId;
        
        // Scroll ขึ้นไปดู dropdown
        select.scrollIntoView({ behavior: 'smooth', block: 'center' });
        
        // Highlight dropdown
        select.style.outline = '3px solid #667eea';
        setTimeout(() => {
            select.style.outline = '';
        }, 2000);
        
        // โหลดข้อมูลแผนกนั้น
        loadDepartmentData();
    }
</script>

    <!-- เลือกแผนก -->
    <div class="form-group">
        <label>เลือกแผนก</label>
        <select id="departmentSelect" onchange="loadDepartmentData()">
            <option value="">-- ทุกแผนก --</option>

    </div>

    <!-- ปฏิทิน -->
    <div class="calendar-container">
        <div class="calendar-header">
            <div class="month-nav">
                <button onclick="previousMonth()">◀ เดือนก่อน</button>
                <span id="currentMonth"></span>
                <button onclick="nextMonth()">เดือนถัดไป ▶</button>
            </div>

        <div class="calendar-weekdays">

<script>
    // ตรวจสอบ login
    window.onload = function() {
        const loggedIn = sessionStorage.getItem('loggedIn');
        const role = sessionStorage.getItem('role');

        if (!loggedIn || role !== 'admin') {
            window.location.href = 'index.html';
            return;
        }

        loadDepartments();
        renderCalendar();
        loadPendingApprovals();
    };

    const API_URL = 'https://approval-worker.9vk92zm5z2.workers.dev';
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();

    // โหลดรายการแผนก
    async function loadDepartments() {
        try {
            const response = await fetch(`${API_URL}/api/departments`);
            const data = await response.json();
            
            const select = document.getElementById('departmentSelect');
            data.data.forEach(dept => {
                const option = document.createElement('option');
                option.value = dept.id;
                option.textContent = dept.name;
                select.appendChild(option);
            });
        } catch (error) {
            console.error('Load departments error:', error);
        }
    }

    // โหลดข้อมูลตามแผนก
    async function loadDepartmentData() {
        const departmentId = document.getElementById('departmentSelect').value;
        
        if (departmentId) {
            await loadDepartmentLeaves(departmentId);
        } else {
            // ถ้าเลือก "ทุกแผนก" ให้โหลดทุกแผนก
            departmentLeaves = [];
        }
        
        renderCalendar();
        loadPendingApprovals();
    }

    let departmentLeaves = [];

    // โหลดการลาของแผนก
    async function loadDepartmentLeaves(departmentId) {
        try {
            const response = await fetch(`${API_URL}/api/leaves/department/${departmentId}`);
            const data = await response.json();
            
            if (response.ok && data.success) {
                departmentLeaves = data.data;
            } else {
                console.error('Load leaves error:', data.message);
                departmentLeaves = [];
            }
        } catch (error) {
            console.error('Load leaves error:', error);
            departmentLeaves = [];
        }
    }

    // แสดงปฏิทิน (read-only)
    function renderCalendar() {
        const calendar = document.getElementById('calendar');
        const monthDisplay = document.getElementById('currentMonth');
        
        const firstDay = new Date(currentYear, currentMonth, 1);
        const lastDay = new Date(currentYear, currentMonth + 1, 0);
        const daysInMonth = lastDay.getDate();
        let startDay = firstDay.getDay();
        
        // แปลงให้จันทร์ = 0, อาทิตย์ = 6
        startDay = (startDay === 0) ? 6 : startDay - 1;
        
        const thaiMonths = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
                           'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        
        monthDisplay.textContent = `${thaiMonths[currentMonth]} ${currentYear + 543}`;
        
        let html = '';
        
        // ช่องว่าง
        for (let i = 0; i < startDay; i++) {
            html += '<div class="calendar-day empty"></div>';
        }
        
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        
        // วันในเดือน
        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(currentYear, currentMonth, day);
            let dayOfWeek = date.getDay();
            
            // แปลงให้จันทร์ = 0, อาทิตย์ = 6
            dayOfWeek = (dayOfWeek === 0) ? 6 : dayOfWeek - 1;
            
            const dateStr = formatDate(date);
            let classes = ['calendar-day'];
            
            // เสาร์ (5) และอาทิตย์ (6)
            if (dayOfWeek === 5 || dayOfWeek === 6) {
                classes.push('weekend');
            }
            
            if (date.toDateString() === today.toDateString()) {
                classes.push('today');
            }
            
            if (date < today) {
                classes.push('past-date');
            }
            
            // คำนวณสีตามการลา
            const colorClass = calculateColorClass(dateStr);
            if (colorClass) {
                classes.push(colorClass);
            }
            
            html += `<div class="${classes.join(' ')}">${day}</div>`;
        }
        
        calendar.innerHTML = html;
    }

    // ฟังก์ชัน format date เป็น YYYY-MM-DD
    function formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    // คำนวณสีตามการลา
    function calculateColorClass(dateStr) {
        const leavesOnDate = departmentLeaves.filter(leave => 
            dateStr >= leave.start_date && dateStr <= leave.end_date
        );
        
        if (leavesOnDate.length === 0) return null;
        
        // นับประเภทการลา
        const leaveTypes = { green: 0, yellow: 0, approved: 0, rejected: 0 };
        
        leavesOnDate.forEach(leave => {
            if (leave.approval_status === 'approved') {
                leaveTypes.approved++;
            } else if (leave.approval_status === 'rejected') {
                leaveTypes.rejected++;
            } else if (leave.delegation_type === 'none') {
                leaveTypes.yellow++;
            } else {
                leaveTypes.green++;
            }
        });
        
        // ลำดับความสำคัญของสี
        if (leaveTypes.approved > 0) return 'approved';  // ดำ
        if (leaveTypes.rejected > 0) return 'rejected';  // ขาว กรอบดำ
        
        // ซ้อนทับ
        if (leaveTypes.green + leaveTypes.yellow > 1) {
            if (leaveTypes.yellow > 0) {
                return 'overlap-no-delegation';  // ส้ม
            } else {
                return 'overlap';  // แดง
            }
        }
        
        // เดี่ยว
        if (leaveTypes.green === 1) return 'on-leave';  // เขียว
        if (leaveTypes.yellow === 1) return 'no-delegation';  // เหลือง
        
        return null;
    }

    function previousMonth() {
        currentMonth--;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }
        renderCalendar();
    }

    function nextMonth() {
        currentMonth++;
        if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        renderCalendar();
    }

    // โหลดรายการรออนุมัติ
    async function loadPendingApprovals() {
        const container = document.getElementById('approvalItems');
        const countSpan = document.getElementById('pendingCount');
        const departmentId = document.getElementById('departmentSelect').value;
        
        try {
            let url = `${API_URL}/api/leaves/pending`;
            if (departmentId) {
                url += `?department_id=${departmentId}`;
            }
            
            const response = await fetch(url);
            const data = await response.json();
            
            if (response.ok && data.success && data.data.length > 0) {
                countSpan.textContent = data.data.length;
                
                let html = '';
                data.data.forEach(leave => {
                    const startDate = formatDateThai(leave.start_date);
                    const endDate = formatDateThai(leave.end_date);
                    const days = Math.ceil((new Date(leave.end_date) - new Date(leave.start_date)) / (1000 * 60 * 60 * 24)) + 1;
                    
                    html += `
                        <div class="approval-item">
                            <div class="approval-item-header">
                                <div class="approval-item-top">
                                    <div class="approval-item-info">
                                        <h3>${leave.doctor_name} (${leave.department_name})</h3>
                                        <p>📅 ${startDate} - ${endDate} (${days} วัน)</p>
                                        <p>💬 เหตุผล: ${leave.no_delegation_reason || '-'}</p>
                                    </div>
                                    <button class="btn-view-department" onclick="viewDepartment(${leave.department_id}); event.stopPropagation();">
                                        📍 ${leave.department_name}
                                    </button>
                                </div>
                                <div class="approval-buttons">
                                    <button class="btn-approve" onclick="approveLeave(${leave.id})">✓ อนุมัติ</button>
                                    <button class="btn-reject" onclick="rejectLeave(${leave.id})">✗ ไม่อนุมัติ</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
            } else {
                container.innerHTML = '<div class="empty-message">ไม่มีรายการรออนุมัติ</div>';
                countSpan.textContent = '0';
            }
        } catch (error) {
            console.error('Load pending approvals error:', error);
            container.innerHTML = '<div class="empty-message">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>';
            countSpan.textContent = '0';
        }
    }

    // Format วันที่เป็นภาษาไทย
    function formatDateThai(dateStr) {
        const date = new Date(dateStr);
        const day = date.getDate();
        const month = date.getMonth() + 1;
        const year = date.getFullYear() + 543;
        return `${day}/${month}/${year}`;
    }

    // อนุมัติ
    async function approveLeave(leaveId) {
        if (!confirm('ยืนยันการอนุมัติ?')) return;
        
        try {
            const response = await fetch(`${API_URL}/api/leaves/${leaveId}/approve`, {
                method: 'POST'
            });
            const data = await response.json();
            
            if (response.ok && data.success) {
                alert('✓ อนุมัติสำเร็จ');
                await loadDepartmentData();  // โหลดข้อมูลใหม่
            } else {
                alert('เกิดข้อผิดพลาด: ' + data.message);
            }
        } catch (error) {
            console.error('Approve error:', error);
            alert('เกิดข้อผิดพลาดในการอนุมัติ');
        }
    }

    // ไม่อนุมัติ
    async function rejectLeave(leaveId) {
        if (!confirm('ยืนยันการไม่อนุมัติ?')) return;
        
        try {
            const response = await fetch(`${API_URL}/api/leaves/${leaveId}/reject`, {
                method: 'POST'
            });
            const data = await response.json();
            
            if (response.ok && data.success) {
                alert('✓ ไม่อนุมัติสำเร็จ');
                await loadDepartmentData();  // โหลดข้อมูลใหม่
            } else {
                alert('เกิดข้อผิดพลาด: ' + data.message);
            }
        } catch (error) {
            console.error('Reject error:', error);
            alert('เกิดข้อผิดพลาดในการไม่อนุมัติ');
        }
    }

    // ดูแผนก - เลือก dropdown อัตโนมัติ
    function viewDepartment(departmentId) {
        const select = document.getElementById('departmentSelect');
        select.value = departmentId;
        
        // Scroll ขึ้นไปดู dropdown
        select.scrollIntoView({ behavior: 'smooth', block: 'center' });
        
        // Highlight dropdown
        select.style.outline = '3px solid #667eea';
        setTimeout(() => {
            select.style.outline = '';
        }, 2000);
        
        // โหลดข้อมูลแผนกนั้น
        loadDepartmentData();
    }
</script>
