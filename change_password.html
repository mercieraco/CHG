</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔑 เปลี่ยนรหัสผ่าน</h1>
            <p>กรอกข้อมูลเพื่อเปลี่ยนรหัสผ่านของคุณ</p>

```
    <div class="info-box">
        <p>💡 <strong>สำหรับการเปลี่ยนรหัสผ่าน:</strong> กรุณากรอกเลขใบประกอบวิชาชีพและรหัสผ่านเดิมของคุณ จากนั้นกำหนดรหัสผ่านใหม่ที่ต้องการ</p>
    </div>

    <div id="errorMessage" class="message error"></div>
    <div id="successMessage" class="message success"></div>

    <form id="changePasswordForm">
        <div class="form-group">
            <label for="licenseNumber">เลขใบประกอบวิชาชีพแพทย์ (เลข ว)</label>
            <input type="text" id="licenseNumber" name="licenseNumber" required 
                   placeholder="กรอกเลขใบประกอบวิชาชีพ" pattern="[0-9]+">
            <small>กรอกเฉพาะตัวเลขเท่านั้น</small>
        </div>

        <div class="form-group">
            <label for="oldPassword">รหัสผ่านเดิม</label>
            <input type="password" id="oldPassword" name="oldPassword" required 
                   placeholder="กรอกรหัสผ่านเดิม" autocomplete="current-password">
        </div>

        <div class="form-group">
            <label for="newPassword">รหัสผ่านใหม่</label>
            <input type="password" id="newPassword" name="newPassword" required 
                   placeholder="กรอกรหัสผ่านใหม่" minlength="4" autocomplete="new-password">
            <small>รหัสผ่านอย่างน้อย 4 ตัวอักษร</small>
        </div>

        <div class="form-group">
            <label for="confirmNewPassword">ยืนยันรหัสผ่านใหม่</label>
            <input type="password" id="confirmNewPassword" name="confirmNewPassword" required 
                   placeholder="กรอกรหัสผ่านใหม่อีกครั้ง" minlength="4" autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary">เปลี่ยนรหัสผ่าน</button>
        <button type="button" onclick="window.location.href='index.html'" class="btn btn-secondary">← กลับไปหน้า Login</button>
    </form>
</div>

<script>
    document.getElementById('changePasswordForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const licenseNumber = document.getElementById('licenseNumber').value.trim();
        const oldPassword = document.getElementById('oldPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmNewPassword = document.getElementById('confirmNewPassword').value;
        
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        
        // ซ่อนข้อความเดิม
        errorMessage.classList.remove('show');
        successMessage.classList.remove('show');

        // ตรวจสอบรูปแบบเลขใบประกอบวิชาชีพ
        if (!/^[0-9]+$/.test(licenseNumber)) {
            errorMessage.textContent = '❌ เลขใบประกอบวิชาชีพต้องเป็นตัวเลขเท่านั้น';
            errorMessage.classList.add('show');
            return;
        }

        // ตรวจสอบว่ารหัสผ่านใหม่ตรงกัน
        if (newPassword !== confirmNewPassword) {
            errorMessage.textContent = '❌ รหัสผ่านใหม่ไม่ตรงกัน กรุณาตรวจสอบอีกครั้ง';
            errorMessage.classList.add('show');
            return;
        }

        // ตรวจสอบว่ารหัสผ่านใหม่ต่างจากเดิม
        if (oldPassword === newPassword) {
            errorMessage.textContent = '❌ รหัสผ่านใหม่ต้องไม่เหมือนกับรหัสผ่านเดิม';
            errorMessage.classList.add('show');
            return;
        }

        try {
            // เรียก API change password
            const response = await fetch('https://doc-leave-api.9vk92zm5z2.workers.dev/api/change-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    licenseNumber: licenseNumber,
                    oldPassword: oldPassword,
                    newPassword: newPassword
                })
            });

            const data = await response.json();
            
            if (response.ok && data.success) {
                // เปลี่ยนรหัสผ่านสำเร็จ
                successMessage.innerHTML = `
                    <strong>✅ รหัสผ่านได้รับการเปลี่ยนแล้ว</strong>
                    <p style="margin: 15px 0 0 0; font-size: 14px; color: #666;">
                        รหัสผ่านของคุณได้รับการเปลี่ยนเรียบร้อยแล้ว<br>
                        กรุณา Login ด้วยรหัสผ่านใหม่
                    </p>
                    <button onclick="window.location.href='index.html'" class="btn btn-primary btn-login-only">→ ไปหน้า Login</button>
                `;
                successMessage.classList.add('show');
                
                // ซ่อนฟอร์ม
                document.getElementById('changePasswordForm').classList.add('hidden');
            } else {
                throw new Error(data.message || 'เกิดข้อผิดพลาด');
            }

        } catch (error) {
            console.error('Change password error:', error);
            errorMessage.textContent = '❌ ' + error.message;
            errorMessage.classList.add('show');
        }
    });
</script>
