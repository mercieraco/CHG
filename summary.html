    body {

    .btn-back-top {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(245, 87, 108, 0.9);
        color: white;

        border-radius: 25px;
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
        z-index: 1000;
        cursor: pointer;
        border: none;
        transition: all 0.3s;
    }

    .btn-back-top:hover {
        background: rgba(245, 87, 108, 1);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
    }

<div class="container">
    <div class="header">
        <h1>📊 สรุปภาพรวม Duty</h1>
        <p>ดูตารางเวร การแลกเวร และภาพรวมของทุกแผนก</p>

        <p id="userDisplay">กำลังโหลดข้อมูล...</p>
    </div>

    <div class="content-section">
        <div class="placeholder-icon">📅</div>
        <h2>สรุปภาพรวม</h2>
        <p>
            หน้านี้จะแสดงปฏิทินภาพรวมของแต่ละแผนก<br>
            สามารถเลือกดูแผนก เดือน และรายละเอียดของแต่ละวัน<br>
            รวมถึงข้อมูลการแลกเวรต่างๆ
        </p>
        <p style="margin-top: 20px; color: #999; font-size: 14px;">
            (ระบบกำลังพัฒนา - ทดสอบการ Navigation)
        </p>
    </div>
</div>

<script>
    // ตรวจสอบ Login
    window.onload = function() {
        const loggedIn = sessionStorage.getItem('loggedIn');
        const username = sessionStorage.getItem('username');
        const role = sessionStorage.getItem('role');

        if (!loggedIn) {
            window.location.href = 'index.html';
            return;
        }

        // แสดงข้อมูล User
        displayUserInfo(username, role);

        // ตั้งค่าปุ่มกลับตาม role
        setupBackButton(role);
    };

    // แสดงข้อมูล User
    function displayUserInfo(username, role) {
        const userDisplay = document.getElementById('userDisplay');
        let roleText = '';
        let roleClass = '';

        if (role === 'admin') {
            roleText = 'Admin';
            roleClass = 'role-admin';
        } else if (role === 'doctor') {
            roleText = 'แพทย์';
            roleClass = 'role-doctor';
        } else {
            roleText = 'ผู้ใช้ทั่วไป';
            roleClass = 'role-user';
        }

        userDisplay.innerHTML = `
            คุณ ${username}
            <span class="user-role ${roleClass}">${roleText}</span>
        `;
    }

    // ตั้งค่าปุ่มกลับตาม role
    function setupBackButton(role) {
        const btnBack = document.getElementById('btnBack');

        if (role === 'admin') {
            // Admin → กลับ dev.html
            btnBack.onclick = function() {
                window.location.href = 'dev.html';
            };
        } else if (role === 'doctor') {
            // แพทย์ → กลับ user.html
            btnBack.onclick = function() {
                window.location.href = 'user.html';
            };
        } else {
            // User ทั่วไป → Logout
            btnBack.onclick = function() {
                if (confirm('ต้องการออกจากระบบ?')) {
                    sessionStorage.clear();
                    window.location.href = 'index.html';
                }
            };
        }
    }
</script>
