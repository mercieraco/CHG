<script>
    const API_DEP_URL = 'https://depdocdoc.9vk92zm5z2.workers.dev';
    const API_LEAVE_URL = 'https://dep-rest-worker.9vk92zm5z2.workers.dev';
    
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let doctorLeaves = [];
    let departments = [];

    // ตรวจสอบ Login
    window.onload = async function() {
        console.log('🚀 Page loaded');
        
        const loggedIn = sessionStorage.getItem('loggedIn');
        const role = sessionStorage.getItem('role');
        
        console.log('Session:', { loggedIn, role });

        if (!loggedIn) {
            console.log('❌ Not logged in, redirecting...');
            window.location.href = 'index.html';
            return;
        }

        console.log('✅ Logged in as:', role);

        // ตั้งค่าปุ่มกลับ
        setupBackButton(role);
        
        // โหลดแผนก
        console.log('📋 Starting to load departments...');
        await loadDepartments();
        console.log('📋 Departments loaded');
        
        // สร้าง dropdown เดือนและปี
        console.log('📅 Generating month/year dropdowns...');
        generateMonthYearDropdowns();
        console.log('📅 Dropdowns generated');
        
        // Render ปฏิทิน
        console.log('🗓️ Rendering calendar...');
        renderCalendar();
        console.log('🗓️ Calendar rendered');
        
        console.log('✅ Initialization complete');
    };

    // ตั้งค่าปุ่มกลับตาม role
    function setupBackButton(role) {
        const btnBack = document.getElementById('btnBack');

        if (role === 'admin') {
            btnBack.onclick = function() {
                window.location.href = 'dev.html';
            };
        } else if (role === 'doctor' || role === 'user') {
            btnBack.onclick = function() {
                window.location.href = 'user.html';
            };
        } else if (role === 'guest') {
            btnBack.onclick = function() {
                if (confirm('ต้องการออกจากระบบ?')) {
                    sessionStorage.clear();
                    window.location.href = 'index.html';
                }
            };
        } else {
            btnBack.onclick = function() {
                if (confirm('ต้องการออกจากระบบ?')) {
                    sessionStorage.clear();
                    window.location.href = 'index.html';
                }
            };
        }
    }

    // โหลดแผนก
    async function loadDepartments() {
        console.log('🔄 Loading departments...');
        console.log('API URL:', API_DEP_URL);
        
        try {
            const response = await fetch(`${API_DEP_URL}/api/departments`);
            console.log('Response status:', response.status, response.ok);
            
            const data = await response.json();
            console.log('Response data:', data);
            
            if (response.ok && data.success) {
                departments = data.data.sort((a, b) => a.name.localeCompare(b.name, ['en', 'th']));
                console.log('✅ Departments loaded:', departments.length, departments);
                
                const select = document.getElementById('departmentSelect');
                console.log('Select element:', select);
                
                if (!select) {
                    console.error('❌ departmentSelect not found!');
                    return;
                }
                
                // ล้าง options เก่า (ยกเว้น option แรก)
                while (select.options.length > 1) {
                    select.remove(1);
                }
                
                departments.forEach(dept => {
                    const option = document.createElement('option');
                    option.value = dept.id;
                    option.textContent = dept.name;
                    select.appendChild(option);
                    console.log(`  Added: ${dept.name} (ID: ${dept.id})`);
                });
                
                console.log('✅ Department dropdown populated');
            } else {
                console.error('❌ API failed:', data);
            }
        } catch (error) {
            console.error('❌ Load departments error:', error);
        }
    }

    // สร้าง dropdown เดือนและปี
    function generateMonthYearDropdowns() {
        const monthSelect = document.getElementById('monthSelect');
        const yearSelect = document.getElementById('yearSelect');
        
        const monthNames = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
                           'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        
        // สร้าง dropdown เดือน (0-11)
        monthNames.forEach((name, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = name;
            if (index === currentMonth) {
                option.selected = true;
            }
            monthSelect.appendChild(option);
        });
        
        // สร้าง dropdown ปี (3 ปีย้อนหลัง + ปีนี้ + 3 ปีข้างหน้า)
        const currentYearNow = new Date().getFullYear();
        for (let year = currentYearNow - 3; year <= currentYearNow + 3; year++) {
            const option = document.createElement('option');
            option.value = year;
            option.textContent = `${year + 543}`;  // แสดงเป็น พ.ศ.
            if (year === currentYear) {
                option.selected = true;
            }
            yearSelect.appendChild(option);
        }
    }

    // เปลี่ยนเดือน/ปีจาก dropdown
    function changeMonthYear() {
        const monthValue = document.getElementById('monthSelect').value;
        const yearValue = document.getElementById('yearSelect').value;
        
        if (monthValue === '' || yearValue === '') return;
        
        currentMonth = parseInt(monthValue);
        currentYear = parseInt(yearValue);
        renderCalendar();
    }

    // โหลดการลาของแผนก
    async function loadDepartmentLeaves() {
        const departmentId = document.getElementById('departmentSelect').value;
        
        if (!departmentId) {
            doctorLeaves = [];
            renderCalendar();
            return;
        }

        try {
            const response = await fetch(`${API_LEAVE_URL}/api/leaves/department/${departmentId}`);
            const data = await response.json();
            
            if (response.ok && data.success) {
                doctorLeaves = data.data;
                console.log('Loaded leaves:', doctorLeaves.length);
            } else {
                doctorLeaves = [];
            }
        } catch (error) {
            console.error('Load leaves error:', error);
            doctorLeaves = [];
        }
        
        renderCalendar();
    }

    // Render Calendar
    function renderCalendar() {
        const calendar = document.getElementById('calendar');
        const monthYear = document.getElementById('currentMonth');
        
        const monthNames = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
                          'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        
        monthYear.textContent = `${monthNames[currentMonth]} ${currentYear + 543}`;
        
        const firstDay = new Date(currentYear, currentMonth, 1);
        const lastDay = new Date(currentYear, currentMonth + 1, 0);
        const startDayOfWeek = firstDay.getDay();
        const daysInMonth = lastDay.getDate();
        
        const dayHeaders = ['จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส', 'อา'];
        
        let html = '';
        dayHeaders.forEach(day => {
            html += `<div class="calendar-day-header">${day}</div>`;
        });
        
        // วันว่าง (เริ่มจันทร์)
        const startDay = startDayOfWeek === 0 ? 6 : startDayOfWeek - 1;
        for (let i = 0; i < startDay; i++) {
            html += '<div class="calendar-day empty"></div>';
        }
        
        // คำนวณสี
        const calculateColorClass = (dateStr) => {
            const leaveTypes = {
                green: 0,
                yellow: 0,
                approved: 0,
                rejected: 0
            };
            
            doctorLeaves.forEach(leave => {
                if (dateStr >= leave.start_date && dateStr <= leave.end_date) {
                    if (leave.approval_status === 'approved') {
                        leaveTypes.approved++;
                    } else if (leave.approval_status === 'rejected') {
                        leaveTypes.rejected++;
                    } else if (leave.delegation_type === 'none') {
                        leaveTypes.yellow++;
                    } else if (leave.delegation_type === 'single' || leave.delegation_type === 'custom') {
                        leaveTypes.green++;
                    }
                }
            });
            
            // อนุมัติ → ดำ
            if (leaveTypes.approved > 0) {
                return 'approved';
            }
            
            const totalLeaves = leaveTypes.green + leaveTypes.yellow + leaveTypes.rejected;
            if (totalLeaves === 0) return null;
            
            // แดง: เขียว >= 2
            if (leaveTypes.green >= 2) {
                return 'overlap';
            }
            // ส้ม: เขียว + เหลือง หรือ เหลือง >= 2
            else if ((leaveTypes.green >= 1 && leaveTypes.yellow >= 1) || (leaveTypes.yellow >= 2)) {
                return 'overlap-no-delegation';
            }
            // เขียว: 1 คน
            else if (leaveTypes.green === 1 && leaveTypes.yellow === 0) {
                return 'on-leave';
            }
            // เหลือง: ไม่ฝาก
            else if (leaveTypes.yellow === 1 && leaveTypes.green === 0) {
                return 'no-delegation';
            } else {
                return 'on-leave';
            }
        };
        
        // วันในเดือน
        const today = new Date();
        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(currentYear, currentMonth, day);
            const dateStr = formatDate(date);
            const dayOfWeek = date.getDay();
            
            let classes = ['calendar-day'];
            
            // เสาร์-อาทิตย์
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                classes.push('weekend');
            }
            
            // วันนี้
            if (date.toDateString() === today.toDateString()) {
                classes.push('today');
            }
            
            // วันที่ผ่านแล้ว
            if (date < today && date.toDateString() !== today.toDateString()) {
                classes.push('past-date');
            }
            
            // สีการลา
            const colorClass = calculateColorClass(dateStr);
            if (colorClass) {
                classes.push(colorClass);
            }
            
            html += `<div class="${classes.join(' ')}" data-date="${dateStr}" onclick="showDayDetail('${dateStr}')">${day}</div>`;
        }
        
        calendar.innerHTML = html;
    }

    // แสดงรายละเอียดวัน
    async function showDayDetail(dateStr) {
        const departmentId = document.getElementById('departmentSelect').value;
        
        if (!departmentId) {
            alert('กรุณาเลือกแผนกก่อน');
            return;
        }

        console.log('=== Show Day Detail ===');
        console.log('Date:', dateStr);
        console.log('Department ID:', departmentId);

        try {
            // 1. ดึงชื่อแผนก
            const department = departments.find(d => d.id == departmentId);
            const departmentName = department ? department.name : 'ไม่ระบุ';

            // 2. ดึง Duties ของแผนกนี้
            const dutiesResponse = await fetch(`${API_DEP_URL}/api/duties/department/${departmentId}`);
            const dutiesData = await dutiesResponse.json();

            if (!dutiesData.success || dutiesData.data.length === 0) {
                alert('ไม่พบข้อมูล Duty ในแผนกนี้');
                return;
            }

            const duties = dutiesData.data;
            console.log('✅ Duties in department:', duties);

            // 3. ดึง Doctor-Duties ของแผนกนี้
            const doctorDutiesResponse = await fetch(`${API_DEP_URL}/api/doctor-duties/department/${departmentId}`);
            const doctorDutiesData = await doctorDutiesResponse.json();

            const doctorDuties = doctorDutiesData.success ? doctorDutiesData.data : [];
            console.log('✅ Doctor-Duties:', doctorDuties.length, doctorDuties);

            // 4. ดึงรายชื่อแพทย์ทั้งหมด
            const doctorsResponse = await fetch(`${API_DEP_URL}/api/doctors`);
            const doctorsData = await doctorsResponse.json();

            const allDoctors = doctorsData.success ? doctorsData.data : [];
            console.log('✅ All doctors:', allDoctors.length);

            // 5. หาว่าวันนี้เป็นวันอะไร
            const date = new Date(dateStr);
            const dayOfWeek = date.getDay(); // 0=อาทิตย์, 1=จันทร์, ...
            const dayNames = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
            const dayName = dayNames[dayOfWeek];

            console.log('📅 Day of week:', dayName);

            // 6. สร้างข้อมูลแต่ละ Duty
            const dutyDetails = [];

            duties.forEach(duty => {
                console.log(`\n🔍 Processing Duty: ${duty.duty_name} (ID: ${duty.id})`);
                
                // หาแพทย์ที่ทำ Duty นี้ในวันนี้
                const doctorsOnDuty = doctorDuties.filter(dd => {
                    const match = dd.duty_id === duty.id && dd[dayName] === 1;
                    if (match) {
                        console.log(`  ✓ Doctor ID ${dd.doctor_id} works on ${dayName}`);
                    }
                    return match;
                });

                console.log(`  → Total doctors on duty: ${doctorsOnDuty.length}`);

                // หาแพทย์ที่ลาในวันนี้ (ของแผนกนี้เท่านั้น)
                const doctorsOnLeave = doctorLeaves.filter(leave => {
                    // เช็คว่าอยู่ในช่วงวันที่
                    const inDateRange = dateStr >= leave.start_date && dateStr <= leave.end_date;
                    // เช็คว่าเป็นแผนกนี้
                    const inDepartment = leave.department_id == departmentId;
                    
                    if (inDateRange && inDepartment) {
                        console.log(`  🏖️ Doctor ID ${leave.doctor_id} is on leave (${leave.delegation_type})`);
                    }
                    
                    return inDateRange && inDepartment;
                });

                console.log(`  → Doctors on leave: ${doctorsOnLeave.length}`);

                // จับคู่แพทย์กับข้อมูล
                const doctorList = doctorsOnDuty.map(dd => {
                    const doctor = allDoctors.find(d => d.id === dd.doctor_id);
                    if (!doctor) {
                        console.warn(`  ⚠️ Doctor ID ${dd.doctor_id} not found in doctors list`);
                        return null;
                    }

                    console.log(`  👨‍⚕️ Processing doctor: ${doctor.name}`);

                    // เช็คว่าแพทย์คนนี้ลาหรือไม่
                    const leave = doctorsOnLeave.find(l => l.doctor_id === doctor.id);

                    if (leave) {
                        console.log(`    → On leave, finding replacement...`);
                        
                        // ลา → หาคนมาแทน
                        let replacement = null;

                        if (leave.delegation_type === 'single' && leave.replacement_doctor_id) {
                            // Single Delegation
                            replacement = allDoctors.find(d => d.id === leave.replacement_doctor_id);
                            console.log(`    → Single delegation, replacement: ${replacement?.name || 'NOT FOUND'}`);
                        } else if (leave.delegation_type === 'custom' && leave.duty_assignments) {
                            // Custom Delegation
                            const assignment = leave.duty_assignments.find(a => 
                                a.duty_date === dateStr && a.duty_id === duty.id
                            );
                            if (assignment) {
                                replacement = allDoctors.find(d => d.id === assignment.replacement_doctor_id);
                                console.log(`    → Custom delegation, replacement: ${replacement?.name || 'NOT FOUND'}`);
                            } else {
                                console.log(`    → Custom delegation, but no assignment for this duty/date`);
                            }
                        } else if (leave.delegation_type === 'none') {
                            console.log(`    → No delegation (ไม่ฝากงาน)`);
                        }

                        return {
                            doctor: doctor,
                            onLeave: true,
                            replacement: replacement
                        };
                    } else {
                        console.log(`    → Not on leave, working normally`);
                        
                        // ไม่ลา
                        return {
                            doctor: doctor,
                            onLeave: false,
                            replacement: null
                        };
                    }
                }).filter(item => item !== null);

                console.log(`  ✅ Final doctor list for ${duty.duty_name}: ${doctorList.length} doctors`);

                dutyDetails.push({
                    dutyName: duty.duty_name,
                    doctors: doctorList
                });
            });

            console.log('\n📊 Summary:', dutyDetails);

            // 7. แสดง Modal
            displayDayDetailModal(dateStr, departmentName, dutyDetails);

        } catch (error) {
            console.error('❌ Error loading day detail:', error);
            alert('เกิดข้อผิดพลาด: ' + error.message);
        }
    }

    // แสดง Modal
    function displayDayDetailModal(dateStr, departmentName, dutyDetails) {
        document.getElementById('modalDate').textContent = `วันที่ ${formatDateThai(dateStr)}`;
        document.getElementById('modalDepartment').textContent = `แผนก: ${departmentName}`;

        let html = '';

        if (dutyDetails.length === 0) {
            html = '<div class="no-doctor">ไม่มีข้อมูล Duty</div>';
        } else {
            dutyDetails.forEach(duty => {
                html += `<div class="duty-section">`;
                html += `<div class="duty-name">${duty.dutyName}</div>`;
                html += `<div class="doctor-list">`;

                if (duty.doctors.length === 0) {
                    html += `<div class="no-doctor">ไม่มีแพทย์</div>`;
                } else {
                    duty.doctors.forEach(item => {
                        const doctorName = item.doctor.name;

                        if (item.onLeave && item.replacement) {
                            // ลา + มีคนมาแทน
                            html += `
                                <div class="doctor-item on-leave">
                                    <span class="doctor-name">${item.replacement.name}</span>
                                    <span class="replacement-info">
                                        <span class="replacement-arrow">→</span> แทน ${doctorName}
                                    </span>
                                </div>
                            `;
                        } else if (item.onLeave && !item.replacement) {
                            // ลา + ไม่มีคนมาแทน (ไม่ฝากงาน)
                            html += `
                                <div class="doctor-item on-leave">
                                    <span class="doctor-name">${doctorName} (ลางาน - ไม่ฝากงาน)</span>
                                </div>
                            `;
                        } else {
                            // ไม่ลา
                            html += `
                                <div class="doctor-item">
                                    <span class="doctor-name">${doctorName}</span>
                                </div>
                            `;
                        }
                    });
                }

                html += `</div></div>`;
            });
        }

        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('dayDetailModal').classList.add('show');
    }

    // ปิด Modal
    function closeDayDetailModal() {
        document.getElementById('dayDetailModal').classList.remove('show');
    }

    // ปิด Modal เมื่อคลิกนอก
    window.onclick = function(event) {
        const modal = document.getElementById('dayDetailModal');
        if (event.target === modal) {
            closeDayDetailModal();
        }
    };

    // Format Date
    function formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function formatDateThai(dateStr) {
        const date = new Date(dateStr);
        const day = date.getDate();
        const month = date.getMonth() + 1;
        const year = date.getFullYear() + 543;
        return `${day}/${month}/${year}`;
    }

    // เดือนก่อน/ถัดไป
    function previousMonth() {
        currentMonth--;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }
        // อัพเดท dropdown
        document.getElementById('monthSelect').value = currentMonth;
        document.getElementById('yearSelect').value = currentYear;
        renderCalendar();
    }

    function nextMonth() {
        currentMonth++;
        if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        // อัพเดท dropdown
        document.getElementById('monthSelect').value = currentMonth;
        document.getElementById('yearSelect').value = currentYear;
        renderCalendar();
    }
</script>
