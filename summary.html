<script>
    const API_DEP_URL = 'https://dep-doc-worker.9vk92zm5z2.workers.dev';
    const API_LEAVE_URL = 'https://dep-rest-worker.9vk92zm5z2.workers.dev';
    
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let doctorLeaves = [];
    let departments = [];
    let currentDuties = [];
    let currentDoctorDuties = [];
    let allDoctors = [];

    // ตรวจสอบ Login
    window.onload = async function() {
        const loggedIn = sessionStorage.getItem('loggedIn');
        const role = sessionStorage.getItem('role');

        if (!loggedIn) {
            window.location.href = 'index.html';
            return;
        }

        // ตั้งค่าปุ่มกลับ
        setupBackButton(role);
        
        // โหลดแผนก
        await loadDepartments();
        
        // สร้าง dropdown เดือนและปี
        generateMonthYearDropdowns();
        
        // Render ปฏิทิน
        renderCalendar();
    };

    // ตั้งค่าปุ่มกลับตาม role
    function setupBackButton(role) {
        const btnBack = document.getElementById('btnBack');

        if (role === 'admin') {
            btnBack.onclick = function() {
                window.location.href = 'dev.html';
            };
        } else if (role === 'doctor' || role === 'user') {
            btnBack.onclick = function() {
                window.location.href = 'user.html';
            };
        } else if (role === 'guest') {
            btnBack.onclick = function() {
                if (confirm('ต้องการออกจากระบบ?')) {
                    sessionStorage.clear();
                    window.location.href = 'index.html';
                }
            };
        } else {
            btnBack.onclick = function() {
                if (confirm('ต้องการออกจากระบบ?')) {
                    sessionStorage.clear();
                    window.location.href = 'index.html';
                }
            };
        }
    }

    // โหลดแผนก
    async function loadDepartments() {
        try {
            const response = await fetch(`${API_DEP_URL}/api/departments`);
            const data = await response.json();
            
            if (response.ok && data.success) {
                departments = data.data.sort((a, b) => a.name.localeCompare(b.name, ['en', 'th']));
                
                const select = document.getElementById('departmentSelect');
                departments.forEach(dept => {
                    const option = document.createElement('option');
                    option.value = dept.id;
                    option.textContent = dept.name;
                    select.appendChild(option);
                });
            }
        } catch (error) {
            console.error('Load departments error:', error);
        }
    }

    // สร้าง dropdown เดือนและปี
    function generateMonthYearDropdowns() {
        const monthSelect = document.getElementById('monthSelect');
        const yearSelect = document.getElementById('yearSelect');
        
        const monthNames = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
                           'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        
        // สร้าง dropdown เดือน (0-11)
        monthNames.forEach((name, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = name;
            if (index === currentMonth) {
                option.selected = true;
            }
            monthSelect.appendChild(option);
        });
        
        // สร้าง dropdown ปี (ปีที่แล้ว + ปีนี้ + 2 ปีข้างหน้า + "เลือก...")
        const currentYearNow = new Date().getFullYear();
        const currentYearBE = currentYearNow + 543; // พ.ศ.
        
        // ⭐ อัพเดท currentYear ให้เป็นปีปัจจุบัน
        currentYear = currentYearNow;
        
        // 4 ปี: ปีที่แล้ว, ปีนี้, ปีหน้า, อีก 2 ปี
        const years = [
            currentYearBE - 1,  // ปีที่แล้ว
            currentYearBE,      // ปีนี้
            currentYearBE + 1,  // ปีหน้า
            currentYearBE + 2   // อีก 2 ปี
        ];
        
        years.forEach((yearBE, index) => {
            const option = document.createElement('option');
            option.value = yearBE - 543; // แปลงเป็น ค.ศ.
            option.textContent = yearBE;
            
            // ปีนี้เป็น default (index = 1)
            if (index === 1) {
                option.selected = true;
            }
            
            yearSelect.appendChild(option);
        });
        
        // เพิ่มตัวเลือก "เลือก..."
        const customOption = document.createElement('option');
        customOption.value = 'custom';
        customOption.textContent = 'เลือก...';
        yearSelect.appendChild(customOption);
    }

    // เปลี่ยนเดือน/ปีจาก dropdown
    function changeMonthYear() {
        const monthValue = document.getElementById('monthSelect').value;
        const yearValue = document.getElementById('yearSelect').value;
        
        if (monthValue === '' || yearValue === '') return;
        
        // ถ้าเลือก "เลือก..." → เปิด Modal
        if (yearValue === 'custom') {
            openYearModal();
            return;
        }
        
        currentMonth = parseInt(monthValue);
        currentYear = parseInt(yearValue);
        renderCalendar();
    }

    // เปิด Modal เลือกปี
    function openYearModal() {
        const modal = document.getElementById('yearModal');
        const input = document.getElementById('yearSuffixInput');
        const resultText = document.getElementById('yearResultText');
        const confirmBtn = document.getElementById('confirmYearBtn');
        
        // Reset
        input.value = '';
        resultText.textContent = '';
        confirmBtn.disabled = true;

                confirmBtn.style.cursor = 'pointer';

                confirmBtn.disabled = true;
                confirmBtn.style.opacity = '0.5';
            }
        });
        
        // กด Enter ที่ input = กดตกลง

    // ยืนยันปีที่เลือก
    function confirmCustomYear() {
        const input = document.getElementById('yearSuffixInput');
        const suffix = parseInt(input.value);
        
        if (suffix >= 69 && suffix <= 99) {
            const yearBE = 2500 + suffix;
            const yearCE = yearBE - 543;
            
            // อัพเดท dropdown
            const yearSelect = document.getElementById('yearSelect');
            
            // เช็คว่ามีปีนี้ใน dropdown หรือไม่
            let optionExists = false;
            for (let i = 0; i < yearSelect.options.length; i++) {
                if (parseInt(yearSelect.options[i].value) === yearCE) {
                    yearSelect.value = yearCE;
                    optionExists = true;
                    break;
                }
            }
            
            // ถ้าไม่มี → เพิ่มเข้าไป
            if (!optionExists) {
                const newOption = document.createElement('option');
                newOption.value = yearCE;
                newOption.textContent = yearBE;
                newOption.selected = true;
                
                // เพิ่มก่อน "เลือก..."
                const customOption = yearSelect.options[yearSelect.options.length - 1];
                yearSelect.insertBefore(newOption, customOption);
            }
            
            // อัพเดทปฏิทิน
            currentYear = yearCE;
            renderCalendar();
            
            // ปิด Modal (ไม่ reset dropdown)
            closeYearModal(false);
        }
    }

    // โหลดข้อมูลแผนก (Duties + Doctor-Duties + Leaves + Doctors)
    async function loadDepartmentData() {
        const departmentId = document.getElementById('departmentSelect').value;
        const dutySelect = document.getElementById('dutySelect');
        
        // รีเซ็ต
        dutySelect.innerHTML = '<option value="">เลือก</option>';
        currentDuties = [];
        currentDoctorDuties = [];
        doctorLeaves = [];
        
        if (!departmentId) {
            renderCalendar();
            return;
        }

        try {
            // 1. โหลด Duties ของแผนก
            const dutiesRes = await fetch(`${API_DEP_URL}/api/duties/department/${departmentId}`);
            const dutiesData = await dutiesRes.json();
            
            if (dutiesData.success) {
                currentDuties = dutiesData.data || [];
                currentDuties.forEach(duty => {
                    const option = document.createElement('option');
                    option.value = duty.id;
                    option.textContent = duty.duty_name;
                    dutySelect.appendChild(option);
                });
            }

            // 2. โหลด Doctor-Duties ของแผนกหลัก (จาก dep-rest-worker)
            console.log('📋 Loading doctor-duties for main department...');
            console.log('API URL:', `${API_LEAVE_URL}/api/duties/department/${departmentId}`);
            const ddRes = await fetch(`${API_LEAVE_URL}/api/duties/department/${departmentId}`);
            console.log('Response status:', ddRes.status, ddRes.ok);
            const ddData = await ddRes.json();
            console.log('Response data:', ddData);
            
            if (ddData.success) {
                currentDoctorDuties = ddData.data || [];
                console.log('✅ Main department doctor-duties:', currentDoctorDuties.length);
            } else {
                console.error('❌ API failed:', ddData);
            }

            // 3. โหลด Doctors ทั้งหมด (ถ้ายังไม่มี)
            if (allDoctors.length === 0) {
                const docRes = await fetch(`${API_DEP_URL}/api/doctors`);
                const docData = await docRes.json();
                if (docData.success) {
                    allDoctors = docData.data || [];
                }
            }

            // 4. โหลด Leaves
            const leavesRes = await fetch(`${API_LEAVE_URL}/api/leaves/department/${departmentId}`);
            const leavesData = await leavesRes.json();
            if (leavesData.success) {
                doctorLeaves = leavesData.data || [];
                
                // ⭐ Feature 3: กรองเฉพาะการลาที่ยังไม่สิ้นสุด (end_date >= วันนี้)
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                doctorLeaves = doctorLeaves.filter(leave => {
                    const endDate = new Date(leave.end_date);
                    endDate.setHours(0, 0, 0, 0);
                    return endDate >= today;
                });
                console.log(`  ✅ Filtered for active/future leaves: ${doctorLeaves.length}`);
                
                // ⭐ Feature 2: เรียงลำดับตามวันที่ยื่นเรื่อง (created_at)
                doctorLeaves.sort((a, b) => {
                    const dateA = new Date(a.created_at);
                    const dateB = new Date(b.created_at);
                    return dateA - dateB;
                });
                console.log('  ✅ Sorted by created_at (oldest first)');
            }

            renderCalendar();
            displayLeaveRecords(); // ⭐ เพิ่ม: แสดงแถบการลา
            
        } catch (error) {
            console.error('Load department data error:', error);
        }
    }

    // GEN4 V2: State สำหรับการจัดเรียงและซ่อน/แสดง
    let currentSortMode = 'created'; // 'created' หรือ 'date'
    let showDetails = false; // false = ซ่อน, true = แสดง

    // GEN4 V2: ฟังก์ชันจัดเรียง
    function sortLeaveRecords(mode) {
        currentSortMode = mode;
        
        if (mode === 'created') {
            // เรียงตาม created_at (ลาก่อน → ลาทีหลัง)
            doctorLeaves.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
        } else if (mode === 'date') {
            // เรียงตาม start_date (ใกล้วันนี้ → ไกลวันนี้)
            const today = new Date();
            doctorLeaves.sort((a, b) => {
                const dateA = new Date(a.start_date);
                const dateB = new Date(b.start_date);
                const diffA = Math.abs(dateA - today);
                const diffB = Math.abs(dateB - today);
                return diffA - diffB;
            });
        }
        
        // อัพเดทปุ่ม
        updateSortButtons();
        
        // แสดงผลใหม่
        displayLeaveRecords();
    }

    // ⭐ Feature 1 & 4: แสดงแถบการลา

        const container = document.getElementById('leaveRecords');
        if (!container) return;
        
        container.innerHTML = '';

        if (doctorLeaves.length === 0) {
            container.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">ไม่มีรายการลางาน</p>';
            return;
        }

        doctorLeaves.forEach(leave => {
            const startDate = formatDateThai(leave.start_date);
            const endDate = formatDateThai(leave.end_date);
            const days = Math.ceil((new Date(leave.end_date) - new Date(leave.start_date)) / (1000 * 60 * 60 * 24)) + 1;

            const doctorFullName = leave.doctor_name || '';
            const doctorFirstName = getFirstName(doctorFullName);
            const doctorLastInitial = getLastNameInitial(doctorFullName);

            const recordDiv = document.createElement('div');
            recordDiv.className = 'leave-record';

            if (leave.delegation_type === 'single') {
                recordDiv.classList.add('single-delegation');

                let fullText = `${startDate} - ${endDate} (${days} วัน) | ${doctorFullName}`;
                
                if (leave.has_replacement && leave.replacement_doctor_name) {
                    const replacementFullName = leave.replacement_doctor_name;
                    const replacementFirstName = getFirstName(replacementFullName);
                    const replacementLastInitial = getLastNameInitial(replacementFullName);
                    shortText += ` >> ${replacementFirstName} (${replacementLastInitial})`;
                    fullText += ` >> ${replacementFullName}`;
                }
                
                // ⭐ Feature 4: เพิ่มเหตุผลการลา
                if (leave.no_delegation_reason && leave.no_delegation_reason.trim()) {
                    shortText += ` : ${leave.no_delegation_reason}`;
                    fullText += ` : ${leave.no_delegation_reason}`;
                }
                
                recordDiv.innerHTML = `
                    <div class="leave-record-info" onclick="highlightLeaveDates('${leave.start_date}', '${leave.end_date}'); event.stopPropagation();">
                        <span class="name-short">${shortText}</span>
                        <span class="name-full">${fullText}</span>
                    </div>
                `;
            } else if (leave.delegation_type === 'custom' && leave.duty_assignments) {
                recordDiv.classList.add('custom-delegation');
                
                // GEN4 V2: แสดงรายละเอียดแต่ละวัน (ถ้า showDetails = true)
                let html = `
                    <div class="leave-record-info">
                        <div class="leave-header" style="font-weight: bold; margin-bottom: 5px; cursor: pointer;" onclick="highlightLeaveDates('${leave.start_date}', '${leave.end_date}'); event.stopPropagation();">
                            <span class="name-short">${startDate} - ${endDate} (${days} วัน) | ${doctorFirstName} (${doctorLastInitial})${leave.no_delegation_reason && leave.no_delegation_reason.trim() ? ` : ${leave.no_delegation_reason}` : ''}</span>
                            <span class="name-full">${startDate} - ${endDate} (${days} วัน) | ${doctorFullName}${leave.no_delegation_reason && leave.no_delegation_reason.trim() ? ` : ${leave.no_delegation_reason}` : ''}</span>
                        </div>
                `;
                
                // GEN4 V2: แสดงรายละเอียดเฉพาะเมื่อ showDetails = true
                if (showDetails) {
                    html += `<div class="daily-details" style="font-size: 0.9em; padding-left: 20px; color: #555;">`;
                    
                    // สร้างรายการวัน
                    const leaveStartDate = new Date(leave.start_date);
                    const leaveEndDate = new Date(leave.end_date);
                    const currentDate = new Date(leaveStartDate);
                    
                    while (currentDate <= leaveEndDate) {
                        const dateStr = currentDate.toISOString().split('T')[0];
                        const dayDisplay = formatDateThai(dateStr);
                        
                        // หาว่าวันนี้มีใครมาแทนบ้าง
                        const dailyAssignments = leave.duty_assignments
                            .filter(a => a.duty_date === dateStr)
                            .map(a => {
                                const replacementDoc = allDoctors.find(d => d.id === a.replacement_doctor_id);

                            });
                        
                        if (dailyAssignments.length > 0) {
                            const uniqueReplacements = [...new Set(dailyAssignments)];
                            html += `<div style="margin-bottom: 3px;">${dayDisplay}: ${uniqueReplacements.join(', ')}</div>`;
                        } else {
                            // GEN4 V0: วันที่ไม่มี duty_assignment = วันนั้นไม่มี duty
                            html += `<div style="margin-bottom: 3px; color: #999;">${dayDisplay}: no duty</div>`;

                    html += `</div>`;

                        // แผนกอื่น: แสดง "รออนุมัติ" ปกติ
                        shortText += ` | ไม่ฝากงาน ⏳ รออนุมัติ`;
                        fullText += ` | ไม่ฝากงาน (รออนุมัติ)`;
                    }
                }
                
                // ⭐ Feature 4: เพิ่มเหตุผลการลา
                if (leave.no_delegation_reason && leave.no_delegation_reason.trim()) {

    // ⭐ Feature 1: ปฏิทินเปลี่ยนเดือนเมื่อคลิก
    function highlightLeaveDates(startDate, endDate) {
        const start = new Date(startDate);
        const end = new Date(endDate);
        const dates = [];
        
        for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
            dates.push(formatDate(d));
        }

        // เปลี่ยนปฏิทินไปเดือนที่เริ่มลา
        const startMonth = start.getMonth();
        const startYear = start.getFullYear();
        
        currentMonth = startMonth;
        currentYear = startYear;
        renderCalendar();
        
        // รอ Render เสร็จ (50ms) แล้วค่อย Highlight
        setTimeout(() => {
            performHighlight(dates);
        }, 50);
    }
    
    function performHighlight(dates) {
        console.log('🎯 performHighlight called with dates:', dates);
        
        // ลบ highlight เก่า
        document.querySelectorAll('.calendar-day.highlight').forEach(el => {
            el.classList.remove('highlight');
        });

        // เพิ่ม highlight ใหม่
        dates.forEach(dateStr => {
            const dayElements = document.querySelectorAll('.calendar-day');
            console.log(`  Searching for date: ${dateStr}, found ${dayElements.length} calendar days`);
            
            let found = false;
            dayElements.forEach(el => {
                const dateAttribute = el.getAttribute('data-date');
                if (dateAttribute === dateStr) {
                    el.classList.add('highlight');
                    found = true;
                    console.log(`    ✅ Highlighted: ${dateStr}`);
                }
            });
            
            if (!found) {
                console.log(`    ❌ Not found: ${dateStr}`);
            }
        });

        // Scroll ไปที่ปฏิทิน
        const calendar = document.getElementById('calendar');
        if (calendar) {
            calendar.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    // Helper: ดึงชื่อ
    function getFirstName(fullName) {
        if (!fullName) return '';
        const parts = fullName.trim().split(' ');
        return parts[0] || '';
    }

    // Helper: ดึงตัวอักษรแรกนามสกุล (ข้ามสระ)
    function getLastNameInitial(fullName) {
        if (!fullName) return '?';
        const parts = fullName.trim().split(/\s+/);
        if (parts.length < 2) return '?';
        const lastName = parts[parts.length - 1];
        
        // ข้ามสระไทย (เอาแค่พยัญชนะตัวแรก)
        const thaiVowels = ['เ', 'แ', 'โ', 'ใ', 'ไ', 'ำ', 'ั', 'า', 'ิ', 'ี', 'ึ', 'ื', 'ุ', 'ู', '็', '่', '้', '๊', '๋', '์', 'ํ', 'ๅ'];
        
        for (let i = 0; i < lastName.length; i++) {
            const char = lastName.charAt(i);
            if (!thaiVowels.includes(char)) {
                return char;
            }
        }
        
        return lastName.charAt(0); // fallback
    }

    // Render Calendar
    function renderCalendar() {
        const calendar = document.getElementById('calendar');
        const monthYear = document.getElementById('currentMonth');
        
        const monthNames = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
                          'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        
        monthYear.textContent = `${monthNames[currentMonth]} ${currentYear + 543}`;
        
        const firstDay = new Date(currentYear, currentMonth, 1);
        const lastDay = new Date(currentYear, currentMonth + 1, 0);
        const startDayOfWeek = firstDay.getDay();
        const daysInMonth = lastDay.getDate();
        
        const dayHeaders = ['จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส', 'อา'];
        
        let html = '';
        dayHeaders.forEach(day => {
            html += `<div class="calendar-day-header">${day}</div>`;
        });
        
        // วันว่าง (เริ่มจันทร์)
        const startDay = startDayOfWeek === 0 ? 6 : startDayOfWeek - 1;
        for (let i = 0; i < startDay; i++) {
            html += '<div class="calendar-day empty"></div>';
        }
        
        // คำนวณสี
        const calculateColorClass = (dateStr) => {
            const leaveTypes = {
                green: 0,
                yellow: 0,
                approved: 0,
                rejected: 0
            };
            
            doctorLeaves.forEach(leave => {
                if (dateStr >= leave.start_date && dateStr <= leave.end_date) {
                    if (leave.approval_status === 'approved') {
                        leaveTypes.approved++;
                    } else if (leave.approval_status === 'rejected') {
                        leaveTypes.rejected++;
                    } else if (leave.delegation_type === 'none') {
                        leaveTypes.yellow++;
                    } else if (leave.delegation_type === 'single' || leave.delegation_type === 'custom') {
                        leaveTypes.green++;
                    }
                }
            });
            
            // อนุมัติ → ดำ
            if (leaveTypes.approved > 0) {
                return 'approved';
            }
            
            const totalLeaves = leaveTypes.green + leaveTypes.yellow + leaveTypes.rejected;
            if (totalLeaves === 0) return null;
            
            // แดง: เขียว >= 2
            if (leaveTypes.green >= 2) {
                return 'overlap';
            }
            // ส้ม: เขียว + เหลือง หรือ เหลือง >= 2
            else if ((leaveTypes.green >= 1 && leaveTypes.yellow >= 1) || (leaveTypes.yellow >= 2)) {
                return 'overlap-no-delegation';
            }
            // เขียว: 1 คน
            else if (leaveTypes.green === 1 && leaveTypes.yellow === 0) {
                return 'on-leave';
            }
            // เหลือง: ไม่ฝาก
            else if (leaveTypes.yellow === 1 && leaveTypes.green === 0) {
                return 'no-delegation';
            } else {
                return 'on-leave';
            }
        };
        
        // วันในเดือน
        const today = new Date();
        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(currentYear, currentMonth, day);
            const dateStr = formatDate(date);
            const dayOfWeek = date.getDay();
            
            let classes = ['calendar-day'];
            
            // เสาร์-อาทิตย์
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                classes.push('weekend');
            }
            
            // วันนี้
            if (date.toDateString() === today.toDateString()) {
                classes.push('today');
            }
            
            // วันที่ผ่านแล้ว
            if (date < today && date.toDateString() !== today.toDateString()) {
                classes.push('past-date');
            }
            
            // สีการลา
            const colorClass = calculateColorClass(dateStr);
            if (colorClass) {
                classes.push(colorClass);
            }
            
            // สร้าง HTML สำหรับวัน
            const doctorNamesHtml = getDoctorNamesForDay(dateStr);
            
            html += `
                <div class="${classes.join(' ')}" data-date="${dateStr}" onclick="showDayDetail('${dateStr}')">
                    <div class="calendar-day-content">
                        <div class="day-number">${day}</div>
                        ${doctorNamesHtml}
                    </div>
                </div>
            `;
        }
        
        calendar.innerHTML = html;
    }

    // แสดงรายละเอียดวัน (ยังไม่ทำ - Part ถัดไป)
    // แสดงรายละเอียดวัน
    async function showDayDetail(dateStr) {
        const deptId = document.getElementById('departmentSelect').value;
        if (!deptId) {
            alert('กรุณาเลือกแผนกก่อน');
            return;
        }

        const dept = departments.find(d => d.id == deptId);
        const deptName = dept ? dept.name : 'ไม่ระบุ';

        console.log('=== Show Day Detail ===');
        console.log('Date:', dateStr);
        console.log('Department ID:', deptId);
        console.log('Department Name:', deptName);

        try {
            // 1. ดึง Duties
            console.log('📋 Fetching duties...');
            const dutiesRes = await fetch(`https://dep-doc-worker.9vk92zm5z2.workers.dev/api/duties/department/${deptId}`);
            console.log('Duties response status:', dutiesRes.status, dutiesRes.ok);
            
            const dutiesData = await dutiesRes.json();
            console.log('Duties data:', dutiesData);
            
            if (!dutiesData.success) {
                console.error('❌ Duties API failed:', dutiesData);
                alert('ไม่พบข้อมูล Duty: ' + (dutiesData.message || 'Unknown error'));
                return;
            }

            const duties = dutiesData.data || [];
            console.log('✅ Duties loaded:', duties.length, duties);

            // 2. ดึง Doctor-Duties (ใช้ dep-rest-worker)
            console.log('👨‍⚕️ Fetching doctor-duties...');
            const ddRes = await fetch(`https://dep-rest-worker.9vk92zm5z2.workers.dev/api/duties/department/${deptId}`);
            console.log('Doctor-duties response status:', ddRes.status, ddRes.ok);
            
            const ddData = await ddRes.json();
            console.log('Doctor-duties data:', ddData);
            
            const doctorDuties = ddData.success ? ddData.data : [];
            console.log('✅ Doctor-duties loaded:', doctorDuties.length, doctorDuties);
            
            // 3. ดึงรายชื่อแพทย์
            console.log('👤 Fetching doctors...');
            const docRes = await fetch(`https://dep-doc-worker.9vk92zm5z2.workers.dev/api/doctors`);
            console.log('Doctors response status:', docRes.status, docRes.ok);
            
            const docData = await docRes.json();
            console.log('Doctors data:', docData);
            
            const allDoctors = docData.success ? docData.data : [];
            console.log('✅ Doctors loaded:', allDoctors.length);

            // หาวัน
            const date = new Date(dateStr);
            const dayIdx = date.getDay();
            const dayNames = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
            const dayName = dayNames[dayIdx];
            console.log('📅 Day of week:', dayName, '(index:', dayIdx, ')');

            // สร้างข้อมูล
            let html = '';

            console.log('\n=== Processing Duties ===');
            duties.forEach(duty => {
                console.log(`\n🔍 Duty: ${duty.duty_name} (ID: ${duty.id})`);
                
                // หาแพทย์ที่ทำ duty นี้วันนี้
                const docsOnDuty = doctorDuties.filter(dd => {
                    const match = dd.duty_id === duty.id && dd[dayName] === 1;
                    if (match) {
                        console.log(`  ✓ Doctor ID ${dd.doctor_id} has ${dayName}=1`);
                    }
                    return match;
                });
                
                console.log(`  → Total doctors on duty: ${docsOnDuty.length}`);

                html += `<div class="duty-section">`;
                html += `<div class="duty-name">${duty.duty_name}</div>`;

                if (docsOnDuty.length === 0) {
                    html += `<div class="no-doctor">ไม่มีแพทย์</div>`;
                } else {
                    docsOnDuty.forEach(dd => {
                        const doc = allDoctors.find(d => d.id === dd.doctor_id);
                        if (!doc) {
                            console.warn(`  ⚠️ Doctor ID ${dd.doctor_id} not found`);
                            return;
                        }
                        
                        console.log(`  👨‍⚕️ Processing: ${doc.name}`);

                        // เช็คว่าลาหรือไม่
                        const leave = doctorLeaves.find(l => 
                            l.doctor_id === doc.id &&
                            dateStr >= l.start_date &&
                            dateStr <= l.end_date &&
                            l.department_id == deptId
                        );

                        if (leave) {
                            console.log(`    🏖️ On leave (${leave.delegation_type})`);
                            
                            // ลา - หาคนมาแทน
                            let replacement = null;

                            if (leave.delegation_type === 'single' && leave.replacement_doctor_id) {
                                replacement = allDoctors.find(d => d.id === leave.replacement_doctor_id);
                                console.log(`    → Single delegation, replacement: ${replacement?.name || 'NOT FOUND'}`);
                            } else if (leave.delegation_type === 'custom' && leave.duty_assignments) {
                                const assign = leave.duty_assignments.find(a => 
                                    a.duty_date === dateStr && a.duty_id === duty.id
                                );
                                if (assign) {
                                    replacement = allDoctors.find(d => d.id === assign.replacement_doctor_id);
                                    console.log(`    → Custom delegation, replacement: ${replacement?.name || 'NOT FOUND'}`);
                                } else {
                                    console.log(`    → Custom delegation, but no assignment for this duty/date`);
                                }
                            } else if (leave.delegation_type === 'none') {
                                console.log(`    → No delegation`);
                            }

                            if (replacement) {
                                html += `
                                    <div class="doctor-item replacement">
                                        <span class="doctor-name">${replacement.name}</span>
                                        <span class="replacement-badge">แทน</span>
                                        <span class="original-doctor">${doc.name}</span>
                                    </div>
                                `;
                            } else {
                                // ⭐ เพิ่มเหตุผลการลา
                                const reasonText = leave.no_delegation_reason && leave.no_delegation_reason.trim() 
                                    ? ` : ${leave.no_delegation_reason}` 
                                    : '';
                                html += `
                                    <div class="doctor-item replacement">
                                        <span class="doctor-name">${doc.name} (ลางาน - ไม่ฝากงาน)${reasonText}</span>
                                    </div>
                                `;
                            }
                        } else {
                            console.log(`    ✅ Working normally`);
                            
                            // ไม่ลา
                            html += `
                                <div class="doctor-item">
                                    <span class="doctor-name">${doc.name}</span>
                                </div>
                            `;
                        }
                    });
                }

                html += `</div>`;
            });

            console.log('\n✅ HTML generated, showing modal');

            // แสดง Modal
            document.getElementById('modalDate').textContent = `วันที่ ${formatDateThai(dateStr)}`;
            document.getElementById('modalDept').textContent = `แผนก: ${deptName}`;
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('dayModal').classList.add('show');

        } catch (error) {
            console.error('❌ Error:', error);
            alert('เกิดข้อผิดพลาด: ' + error.message);
        }
    }

    // ปิด Modal
    function closeModal() {
        document.getElementById('dayModal').classList.remove('show');
    }

    // ดึงชื่อแพทย์สำหรับวันนั้น
    function getDoctorNamesForDay(dateStr) {
        const dutyId = document.getElementById('dutySelect').value;
        const deptId = document.getElementById('departmentSelect').value;
        
        // ถ้าไม่เลือก duty → ไม่แสดงชื่อ
        if (!dutyId || !deptId) {
            return '';
        }

        // หาวัน
        const date = new Date(dateStr);
        const dayIdx = date.getDay();
        const dayNames = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
        const dayName = dayNames[dayIdx];

        // หาแพทย์ที่ทำ duty นี้วันนี้
        const docsOnDuty = currentDoctorDuties.filter(dd => 
            dd.duty_id == dutyId && dd[dayName] === 1
        );

        if (docsOnDuty.length === 0) {
            return '';
        }

        // สร้างรายชื่อ
        let names = [];
        
        docsOnDuty.forEach(dd => {
            const doc = allDoctors.find(d => d.id === dd.doctor_id);
            if (!doc) return;

            const firstName = getFirstName(doc.name);

            // เช็คว่าลาหรือไม่
            const leave = doctorLeaves.find(l => 
                l.doctor_id === doc.id &&
                dateStr >= l.start_date &&
                dateStr <= l.end_date &&
                l.department_id == deptId
            );

            if (leave) {
                // ลา - หาคนมาแทน
                let replacement = null;

                if (leave.delegation_type === 'single' && leave.replacement_doctor_id) {
                    replacement = allDoctors.find(d => d.id === leave.replacement_doctor_id);
                } else if (leave.delegation_type === 'custom' && leave.duty_assignments) {
                    const assign = leave.duty_assignments.find(a => 
                        a.duty_date === dateStr && a.duty_id == dutyId
                    );
                    if (assign) {
                        replacement = allDoctors.find(d => d.id === assign.replacement_doctor_id);
                    }
                }

                if (replacement) {
                    // มีคนมาแทน
                    const repFirstName = getFirstName(replacement.name);
                    names.push(`<div class="doctor-replacement"><span>${repFirstName}</span><span class="original-name">${firstName}</span></div>`);
                } else {
                    // ไม่มีคนมาแทน
                    names.push(`<div class="doctor-replacement"><span class="no-replacement">✗</span><span class="original-name">${firstName}</span></div>`);
                }
            } else {
                // ไม่ลา
                names.push(`<div class="doctor-name-item">${firstName}</div>`);
            }
        });

        if (names.length === 0) {
            return '';
        }

        // กำหนดขนาด font ตามจำนวนคน
        let sizeClass = '';
        if (names.length >= 4) {
            sizeClass = 'tiny';
        } else if (names.length >= 3) {
            sizeClass = 'small';
        }

        return `<div class="doctor-names ${sizeClass}">${names.join('')}</div>`;
    }

    // ดึงชื่อ (ไม่เอานามสกุล)
    function getFirstName(fullName) {
        if (!fullName) return '';
        const parts = fullName.trim().split(/\s+/);
        if (parts.length < 2) return fullName;
        return parts.slice(0, -1).join(' ');
    }

    // Format Date
    function formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function formatDateThai(dateStr) {
        const date = new Date(dateStr);
        const day = date.getDate();
        const month = date.getMonth() + 1;
        const year = date.getFullYear() + 543;
        return `${day}/${month}/${year}`;
    }

    // เดือนก่อน/ถัดไป
    function previousMonth() {
        currentMonth--;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }
        // อัพเดท dropdown
        document.getElementById('monthSelect').value = currentMonth;
        document.getElementById('yearSelect').value = currentYear;
        renderCalendar();
    }

    function nextMonth() {
        currentMonth++;
        if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        // อัพเดท dropdown
        document.getElementById('monthSelect').value = currentMonth;
        document.getElementById('yearSelect').value = currentYear;
        renderCalendar();
    }
</script>
