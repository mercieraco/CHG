<!DOCTYPE html>

<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลางานแพทย์ - ลงทะเบียน</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

```
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .register-container {
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 600px;
        text-align: center;
        margin: 0 auto;
    }

    .header {
        margin-bottom: 30px;
    }

    .header h1 {
        color: #333;
        font-size: 32px;
        margin-bottom: 10px;
    }

    .header p {
        color: #666;
        font-size: 16px;
    }

    .info-box {
        background: #f5f5f5;
        padding: 30px;
        border-radius: 10px;
        margin-bottom: 30px;
    }

    .info-box h2 {
        color: #667eea;
        font-size: 24px;
        margin-bottom: 15px;
    }

    .info-box p {
        color: #666;
        font-size: 14px;
        line-height: 1.6;
    }

    .btn {
        padding: 15px 30px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        text-decoration: none;
        display: inline-block;
    }

    .btn-back {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }

    .btn-back:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .coming-soon {
        color: #999;
        font-style: italic;
        margin-top: 20px;
        font-size: 14px;
    }
</style>
```

</head>
<body>
    <div class="register-container">
        <div class="header">
            <h1>📝 ลงทะเบียน</h1>
            <p>สมัครใช้งานระบบลางานแพทย์</p>
        </div>

```
    <div class="info-box">
        <h2>🚧 อยู่ระหว่างการพัฒนา</h2>
        <p>ขณะนี้ระบบลงทะเบียนอยู่ระหว่างการพัฒนา<br>
        กรุณาติดต่อผู้ดูแลระบบเพื่อขอสร้างบัญชีผู้ใช้</p>
    </div>

    <button onclick="goBack()" class="btn btn-back">← กลับไปหน้าเข้าสู่ระบบ</button>

    <p class="coming-soon">ฟีเจอร์การลงทะเบียนจะพัฒนาในขั้นตอนถัดไป</p>
</div>

<script>
    function goBack() {
        window.location.href = 'index.html';
    }
</script>
```

</body>
</html>
