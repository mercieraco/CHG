    <div class="user-info">
        <h2>ยินดีต้อนรับ</h2>
        <p id="userDisplay">กำลังโหลดข้อมูล...</p>
        <span class="badge">🔧 ADMIN ACCESS</span>
    </div>

    <div class="menu-buttons">
        <button onclick="window.location.href='dep_doc.html'" class="btn btn-menu">
            🏥 จัดการแผนก และแพทย์
        </button>
        <button onclick="window.location.href='dep_rest.html'" class="btn btn-menu">
            📝 จัดการการลา
        </button>
        <button class="btn btn-menu btn-disabled" disabled>
            📊 สรุปภาพรวม
        </button>
    </div>

    <button onclick="logout()" class="btn btn-logout">← ออกจากระบบ</button>

    <p class="coming-soon">ฟีเจอร์การจัดการและอนุมัติจะพัฒนาในขั้นตอนถัดไป</p>
</div>

<script>
    // ตรวจสอบการ login
    window.onload = function() {
        const loggedIn = sessionStorage.getItem('loggedIn');
        const username = sessionStorage.getItem('username');
        const role = sessionStorage.getItem('role');

        if (!loggedIn || role !== 'admin') {
            // ถ้ายังไม่ได้ login หรือไม่ใช่ admin ให้กลับไปหน้า login
            window.location.href = 'index.html';
            return;
        }

        // แสดงข้อมูลผู้ใช้
        document.getElementById('userDisplay').textContent = `คุณ ${username} (Admin)`;
    };

    function logout() {
        // ลบข้อมูล session
        sessionStorage.clear();
        
        // กลับไปหน้า login
        window.location.href = 'index.html';
    }
</script>
